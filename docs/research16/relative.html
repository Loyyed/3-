arable":"300124.SZ 汇川技术","exclusion":"控制系统及客户切换可作行业交叉对照，但新能源、驱动与电梯排除集团直比。","scope":"需同日净债务、租赁资本化和归属于同权普通股的利润","equity_right":"人民币普通股 A股","value_effect":"缺相符样本，区间保留为DCF情景宽度。","tag":"样本筛选"},{"company":"688188_柏楚电子","comparable":"300747.SZ 锐科激光","exclusion":"上游激光器设备周期可作反证，产品权利及利润率不同。","scope":"需同日净债务、租赁资本化和归属于同权普通股的利润","equity_right":"人民币普通股 A股","value_effect":"缺相符样本，区间保留为DCF情景宽度。","tag":"样本筛选"},{"company":"688188_柏楚电子","comparable":"002008.SZ 大族激光","exclusion":"设备端订单参考，多业务设备集团不作直接倍数。","scope":"需同日净债务、租赁资本化和归属于同权普通股的利润","equity_right":"人民币普通股 A股","value_effect":"缺相符样本，区间保留为DCF情景宽度。","tag":"样本筛选"},{"company":"US_ISRG_直觉外科","comparable":"MDT Medtronic","exclusion":"Hugo有FDA许可，但机器人独立收入、投入及普通股权利未分拆。集团倍数排除。","scope":"需同日净债务、租赁资本化和归属于同权普通股的利润","equity_right":"普通股，每股面值0.001美元","value_effect":"缺相符样本，区间保留为DCF情景宽度。","tag":"样本筛选"},{"company":"US_ISRG_直觉外科","comparable":"SYK Stryker","exclusion":"Mako适应证与骨科植入绑定，手术量及耗材范围不可直接比。","scope":"需同日净债务、租赁资本化和归属于同权普通股的利润","equity_right":"普通股，每股面值0.001美元","value_effect":"缺相符样本，区间保留为DCF情景宽度。","tag":"样本筛选"},{"company":"US_ISRG_直觉外科","comparable":"CMR Surgical（非上市）","exclusion":"Versius提供产品竞争边界，没有同日公开普通股交易倍数。","scope":"需同日净债务、租赁资本化和归属于同权普通股的利润","equity_right":"普通股，每股面值0.001美元","value_effect":"缺相符样本，区间保留为DCF情景宽度。","tag":"样本筛选"}]</script>
    <script type="application/json" id="columns">["company","comparable","exclusion","scope","equity_right","value_effect","tag"]</script><script>
const rows = JSON.parse(document.querySelector('#data').textContent);
const columns = JSON.parse(document.querySelector('#columns').textContent);
const selector = [...document.querySelectorAll('select')];
const body = document.querySelector('tbody');
const search = document.querySelector('input[type=search]');
const status = document.querySelector('#status');
const filters = ['company','tag','scenario'];
let page = 0;
const size = 60;
selector.forEach((select, i) => {
  [...new Set(rows.map(row => row[filters[i]]).filter(Boolean))].sort().forEach(value => {
    const option = document.createElement('option');
    option.value = value;
    option.textContent = value;
    select.append(option);
  });
});
const index = rows.map(row => JSON.stringify(row).toLowerCase());
function render() {
  const terms = search.value.toLowerCase().trim().split(/\s+/);
  const result = rows.filter((row, i) => selector.every((s, n) => !s.value || row[filters[n]] === s.value) &&
                                         terms.every(term => index[i].includes(term)));
  const maxPage = Math.max(0, Math.ceil(result.length / size) - 1);
  page = Math.min(maxPage, Math.max(0, page));
  status.textContent = '共 ' + result.length + ' 行 · 第 ' + (page+1) + ' / ' + (maxPage+1) + ' 页';
  body.replaceChildren();
  for (const row of result.slice(page * size, (page+1)*size)) {
    const tr = document.createElement('tr');
    if (row.anchor) tr.id = row.anchor;
    columns.forEach(key => {
      const td = document.createElement('td');
      const value = row[key];
      if (key === 'url' && value && /^https?:/.test(value)) {
        const a = document.createElement('a');
        a.textContent = '发行人或监管原件';
        a.href = value;
        td.append(a);
      } else if (key === 'jump' && value) {
        const a = document.createElement('a');
        a.textContent = '当前账本条目';
        a.href = value;
        td.append(a);
      } else if (value != null && typeof value === 'object') {
        const details = document.createElement('details');
        const summary = document.createElement('summary');
        const pre = document.createElement('pre');
        summary.textContent = '展开';
        pre.textContent = JSON.stringify(value,null,2);
        details.append(summary,pre);
        td.append(details);
      } else {
        td.textContent = value ?? '—';
      }
      tr.append(td);
    });
    body.append(tr);
  }
}
document.querySelector('.controls').addEventListener('input', () => { page=0; render(); });
document.querySelector('#prev').onclick=()=>{page--; render();};
document.querySelector('#next').onclick=()=>{page++; render();};
if (location.hash) {
  const anchor = decodeURIComponent(location.hash.substring(1));
  const match = rows.find(x => x.anchor === anchor);
  if (match) search.value = match.anchor;
}
render();
</script></body></html>
