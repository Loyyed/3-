://static.cninfo.com.cn/finalpage/2026-04-10/1225091045.PDF","path":"sources/raw/01_年报/2026-04-10_2025年年度报告_1225091045.pdf","page":19,"line":61,"text":"21 发明 激光切割头、激光加工设备以","tag":"经营披露定位"},{"company":"688188_柏楚电子","id":"688188-a343f0dc3c27d114","report":"2025-FY","filed":"2026-04-10","sha256":"e12688b3c2e80e63fae0008983426c644a0ca5bc0da6bed30f9b45f635ecfed2","url":"https://static.cninfo.com.cn/finalpage/2026-04-10/1225091045.PDF","path":"sources/raw/01_年报/2026-04-10_2025年年度报告_1225091045.pdf","page":19,"line":70,"text":"24 发明 喷嘴夹持机构及激光切割头","tag":"经营披露定位"},{"company":"688188_柏楚电子","id":"688188-a343f0dc3c27d114","report":"2025-FY","filed":"2026-04-10","sha256":"e12688b3c2e80e63fae0008983426c644a0ca5bc0da6bed30f9b45f635ecfed2","url":"https://static.cninfo.com.cn/finalpage/2026-04-10/1225091045.PDF","path":"sources/raw/01_年报/2026-04-10_2025年年度报告_1225091045.pdf","page":23,"line":106,"text":"12 智能切割头","tag":"经营披露定位"},{"company":"688188_柏楚电子","id":"688188-a343f0dc3c27d114","report":"2025-FY","filed":"2026-04-10","sha256":"e12688b3c2e80e63fae0008983426c644a0ca5bc0da6bed30f9b45f635ecfed2","url":"https://static.cninfo.com.cn/finalpage/2026-04-10/1225091045.PDF","path":"sources/raw/01_年报/2026-04-10_2025年年度报告_1225091045.pdf","page":29,"line":12,"text":"(2). 产销量情况分析表","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sf92ee8eb3f06a597","report":"2023-FY","filed":"2024-01-31","sha256":"7c56b83d1df3ed1dceb67f51d4a8239c2a88af559427559124d8c0c55fda5035","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000021/isrg-20231231.htm","path":"sources/raw/Sf92ee8eb3f06a597.html","html_block":206,"text":"There are over 70 representative clinical uses for da Vinci surgical systems. We believe that there are numerous additional applications that can be addressed with the da Vinci surgical system, and we work closely with our surgeon customers to refine and explore new techniques in which a da Vinci surgical system may bring value. As of December 31, 2023, we had an installed base of 8,606 da Vinci surgical systems, including 5,111 in the U.S., 1,617 in Europe, 1,484 in Asia, and 394 in the rest of the world. We estimate that surgeons using our technology completed approximately 2,286,000 surgical procedures of various types in hospitals throughout the world during the year ended December 31, 2023.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sf92ee8eb3f06a597","report":"2023-FY","filed":"2024-01-31","sha256":"7c56b83d1df3ed1dceb67f51d4a8239c2a88af559427559124d8c0c55fda5035","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000021/isrg-20231231.htm","path":"sources/raw/Sf92ee8eb3f06a597.html","html_block":207,"text":"Additionally, over time, we believe that there are numerous additional applications that can be addressed with the Ion endoluminal system. As of December 31, 2023, we had an installed base of 534 Ion systems, 531 of which are located in the U.S. We plan to seek additional clearances, certifications, or approvals for Ion in markets outside of the U.S. (“OUS”) over time.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sf92ee8eb3f06a597","report":"2023-FY","filed":"2024-01-31","sha256":"7c56b83d1df3ed1dceb67f51d4a8239c2a88af559427559124d8c0c55fda5035","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000021/isrg-20231231.htm","path":"sources/raw/Sf92ee8eb3f06a597.html","html_block":219,"text":"We have a network of field service and technical support engineers across the U.S., Europe, and Asia and maintain relationships with various distributors around the globe. This infrastructure of service and support specialists, along with advanced service tools and solutions, offers a full complement of services for our customers, including installation, repair, maintenance, 24/7 technical support, and proactive system health monitoring. We generate service revenue by providing these services to our customers through comprehensive service contracts and time and material programs.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sf92ee8eb3f06a597","report":"2023-FY","filed":"2024-01-31","sha256":"7c56b83d1df3ed1dceb67f51d4a8239c2a88af559427559124d8c0c55fda5035","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000021/isrg-20231231.htm","path":"sources/raw/Sf92ee8eb3f06a597.html","html_block":490,"text":"In China, since 2022, several provinces, including the Hunan Provincial Healthcare Security Administration, have implemented significant limits on what hospitals can charge patients for surgeries using robotic surgical technology, including soft tissue surgery and orthopedics. These limits have significantly impacted the number of procedures performed and have impacted our instruments and accessories revenue in those provinces. Companies providing robotic surgical technology,","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sf92ee8eb3f06a597","report":"2023-FY","filed":"2024-01-31","sha256":"7c56b83d1df3ed1dceb67f51d4a8239c2a88af559427559124d8c0c55fda5035","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000021/isrg-20231231.htm","path":"sources/raw/Sf92ee8eb3f06a597.html","html_block":515,"text":"Outbreaks of other epidemic, pandemic, or contagious diseases, such as, historically, the Ebola virus, Middle East Respiratory Syndrome, Severe Acute Respiratory Syndrome, or the H1N1 virus, could also divert medical resources and priorities towards the treatment of that disease. An outbreak of other contagious diseases could negatively affect hospital admission rates or disrupt our business similar to the impact of the COVID-19 pandemic highlighted above. Any of these outbreaks could negatively impact the number of procedures performed and have a material adverse effect on our business, financial condition, or results of operations.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sf92ee8eb3f06a597","report":"2023-FY","filed":"2024-01-31","sha256":"7c56b83d1df3ed1dceb67f51d4a8239c2a88af559427559124d8c0c55fda5035","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000021/isrg-20231231.htm","path":"sources/raw/Sf92ee8eb3f06a597.html","html_block":901,"text":"Service revenue was $1.17 billion in 2023, compared to $1.02 billion in 2022 and $0.92 billion in 2021. The increase in service revenue was primarily driven by the growth of the base of installed da Vinci surgical systems producing service revenue. The installed base of da Vinci surgical systems grew 14% to approximately 8,606 as of December 31, 2023; 12% to approximately 7,544 as of December 31, 2022; and 12% to approximately 6,730 as of December 31, 2021.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sf92ee8eb3f06a597","report":"2023-FY","filed":"2024-01-31","sha256":"7c56b83d1df3ed1dceb67f51d4a8239c2a88af559427559124d8c0c55fda5035","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000021/isrg-20231231.htm","path":"sources/raw/Sf92ee8eb3f06a597.html","html_block":907,"text":"The following table summarizes our system placements under leasing arrangements for the years ended December 31, 2023, 2022, and 2021:","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sf92ee8eb3f06a597","report":"2023-FY","filed":"2024-01-31","sha256":"7c56b83d1df3ed1dceb67f51d4a8239c2a88af559427559124d8c0c55fda5035","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000021/isrg-20231231.htm","path":"sources/raw/Sf92ee8eb3f06a597.html","html_block":964,"text":"In 2023, approximately 2,286,000 surgical procedures were performed with da Vinci surgical systems, compared to approximately 1,875,000 and 1,594,000 surgical procedures performed with da Vinci surgical systems in 2022 and 2021, respectively. The increase in our overall procedure volume in 2023 was largely attributable to growth in U.S. general surgery, OUS urologic surgery, OUS general surgery (particularly cancer), and U.S. gynecologic surgery procedures. The overall","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sf92ee8eb3f06a597","report":"2023-FY","filed":"2024-01-31","sha256":"7c56b83d1df3ed1dceb67f51d4a8239c2a88af559427559124d8c0c55fda5035","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000021/isrg-20231231.htm","path":"sources/raw/Sf92ee8eb3f06a597.html","html_block":974,"text":"In 2023, approximately 54,000 biopsy procedures were performed with Ion systems, compared to approximately 23,500 in 2022 and approximately 7,400 in 2021. The increase in our overall procedure volume in 2023 reflects a larger installed base of approximately 534 systems, an increase of 66% compared to the installed base of approximately 321 systems as of 2022. Currently, the vast majority of Ion biopsy procedures are performed in the U.S.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sf92ee8eb3f06a597","report":"2023-FY","filed":"2024-01-31","sha256":"7c56b83d1df3ed1dceb67f51d4a8239c2a88af559427559124d8c0c55fda5035","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000021/isrg-20231231.htm","path":"sources/raw/Sf92ee8eb3f06a597.html","html_block":1020,"text":"•As of December 31, 2023, we had a da Vinci surgical system installed base of approximately 8,606 systems, an increase of 14% compared to the installed base of approximately 7,544 systems as of December 31, 2022.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sf92ee8eb3f06a597","report":"2023-FY","filed":"2024-01-31","sha256":"7c56b83d1df3ed1dceb67f51d4a8239c2a88af559427559124d8c0c55fda5035","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000021/isrg-20231231.htm","path":"sources/raw/Sf92ee8eb3f06a597.html","html_block":1023,"text":"•As of December 31, 2023, we had an Ion system installed base of approximately 534 systems, an increase of 66% compared to the installed base of approximately 321 systems as of December 31, 2022.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sf92ee8eb3f06a597","report":"2023-FY","filed":"2024-01-31","sha256":"7c56b83d1df3ed1dceb67f51d4a8239c2a88af559427559124d8c0c55fda5035","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000021/isrg-20231231.htm","path":"sources/raw/Sf92ee8eb3f06a597.html","html_block":1048,"text":"Systems revenue remained flat at $1.68 billion for the year ended December 31, 2023, compared to $1.68 billion for the year ended December 31, 2022. The flat system revenue for the year ended December 31, 2023, was primarily driven by higher operating lease revenue, offset by lower sales-type lease revenue, lower ASPs, and a higher proportion of da Vinci system placements under operating leases (partially offset by more systems placements).","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sf92ee8eb3f06a597","report":"2023-FY","filed":"2024-01-31","sha256":"7c56b83d1df3ed1dceb67f51d4a8239c2a88af559427559124d8c0c55fda5035","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000021/isrg-20231231.htm","path":"sources/raw/Sf92ee8eb3f06a597.html","html_block":1050,"text":"The following table summarizes our da Vinci system placements under leasing arrangements for the years ended December 31, 2023, and 2022:","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sf92ee8eb3f06a597","report":"2023-FY","filed":"2024-01-31","sha256":"7c56b83d1df3ed1dceb67f51d4a8239c2a88af559427559124d8c0c55fda5035","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000021/isrg-20231231.htm","path":"sources/raw/Sf92ee8eb3f06a597.html","html_block":1055,"text":"During 2023, 213 Ion systems were placed compared to 192 systems during 2022. The increase in system placements was primarily driven by the demand for additional capacity by our customers due to the procedure growth. As of December 31, 2023, we had an Ion system installed base of approximately 534 systems, compared to an installed base of approximately 321 systems as of December 31, 2022.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sf92ee8eb3f06a597","report":"2023-FY","filed":"2024-01-31","sha256":"7c56b83d1df3ed1dceb67f51d4a8239c2a88af559427559124d8c0c55fda5035","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000021/isrg-20231231.htm","path":"sources/raw/Sf92ee8eb3f06a597.html","html_block":1056,"text":"The following table summarizes our Ion system placements under leasing arrangements for the years ended December 31, 2023, and 2022:","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sf92ee8eb3f06a597","report":"2023-FY","filed":"2024-01-31","sha256":"7c56b83d1df3ed1dceb67f51d4a8239c2a88af559427559124d8c0c55fda5035","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000021/isrg-20231231.htm","path":"sources/raw/Sf92ee8eb3f06a597.html","html_block":1059,"text":"Service revenue increased by 14% to $1.17 billion for the year ended December 31, 2023, compared to $1.02 billion for the year ended December 31, 2022. The increase in service revenue for the year ended December 31, 2023, was primarily driven by a larger installed base of systems producing service revenue.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sf92ee8eb3f06a597","report":"2023-FY","filed":"2024-01-31","sha256":"7c56b83d1df3ed1dceb67f51d4a8239c2a88af559427559124d8c0c55fda5035","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000021/isrg-20231231.htm","path":"sources/raw/Sf92ee8eb3f06a597.html","html_block":1064,"text":"Service gross profit for the year ended December 31, 2023, increased by 17% to $0.82 billion, representing 69.8% of service revenue, compared to $0.70 billion, representing 68.2% of service revenue, for the year ended December 31, 2022. The higher service gross profit for the year ended December 31, 2023, was primarily driven by higher service revenue, reflecting a larger installed base of da Vinci surgical systems, and a higher service gross profit margin. The higher service gross profit margin for the year ended December 31, 2023, was primarily driven by favorable impacts from leveraging volume of repairs.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sf92ee8eb3f06a597","report":"2023-FY","filed":"2024-01-31","sha256":"7c56b83d1df3ed1dceb67f51d4a8239c2a88af559427559124d8c0c55fda5035","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000021/isrg-20231231.htm","path":"sources/raw/Sf92ee8eb3f06a597.html","html_block":1122,"text":"and other accrued liabilities decreased by $33 million, primarily due to timing of income tax payments. The unfavorable impact of these items on cash provided by operating activities was partially offset by an increase in deferred revenue by $53 million, primarily due to collections of payments related to future services, an increase in accounts payable by $42 million, primarily due to the timing of billing and payments, an increase in accrued compensation and employee benefits by $35 million, primarily due to higher headcount and higher variable compensation, and a decrease in prepaid expenses and other assets by $24 million, primarily due to a decrease in net investments in sales-type leases.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sf92ee8eb3f06a597","report":"2023-FY","filed":"2024-01-31","sha256":"7c56b83d1df3ed1dceb67f51d4a8239c2a88af559427559124d8c0c55fda5035","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000021/isrg-20231231.htm","path":"sources/raw/Sf92ee8eb3f06a597.html","html_block":1367,"text":"The Company enters into lease arrangements with certain qualified customers. Leases have terms that generally range from 24 to 84 months and are usually collateralized by a security interest in the underlying assets. The Company also leases systems to certain qualified customers under usage-based arrangements that have terms of up to 84 months. For these usage-based lease arrangements, the lease fee is generally billed monthly in arrears based on a contractual per-use fee, and usage is generally defined as the number of procedures performed with the system.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Se4905bffbdcd3611","report":"2024-FY","filed":"2025-01-31","sha256":"6fb4278641549fc85285088ff6d83f9886757eef188f727e8d8f6a9c93a9c70b","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000017/isrg-20241231.htm","path":"sources/raw/Se4905bffbdcd3611.html","html_block":216,"text":"There are over 70 representative clinical uses for da Vinci surgical systems. We believe that there are numerous additional applications that can be addressed with the da Vinci surgical system, and we work closely with our surgeon customers to refine and explore new techniques in which a da Vinci surgical system may bring value. As of December 31, 2024, we had an installed base of 9,902 da Vinci surgical systems, including 5,807 in the U.S., 1,867 in Europe, 1,745 in Asia, and 483 in the rest of the world. We estimate that surgeons using our technology completed approximately 2,683,000 surgical procedures of various types in hospitals throughout the world during the year ended December 31, 2024.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Se4905bffbdcd3611","report":"2024-FY","filed":"2025-01-31","sha256":"6fb4278641549fc85285088ff6d83f9886757eef188f727e8d8f6a9c93a9c70b","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000017/isrg-20241231.htm","path":"sources/raw/Se4905bffbdcd3611.html","html_block":217,"text":"Additionally, over time, we believe that there are numerous additional applications that can be addressed with our Ion endoluminal system. As of December 31, 2024, we had an installed base of 805 Ion systems, 784 of which are located in the U.S. We plan to seek additional clearances, certifications, or approvals for Ion in OUS markets over time.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Se4905bffbdcd3611","report":"2024-FY","filed":"2025-01-31","sha256":"6fb4278641549fc85285088ff6d83f9886757eef188f727e8d8f6a9c93a9c70b","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000017/isrg-20241231.htm","path":"sources/raw/Se4905bffbdcd3611.html","html_block":230,"text":"We have a network of field service and technical support engineers across the U.S., Canada, Europe, and Asia and maintain relationships with various distributors around the globe. This infrastructure of service and support specialists, along with advanced service tools and solutions, offers a full complement of services for our customers, including installation, repair, maintenance, 24/7 technical support, and proactive system health monitoring. We generate service revenue by providing these services to our customers through comprehensive service contracts and time and material programs.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Se4905bffbdcd3611","report":"2024-FY","filed":"2025-01-31","sha256":"6fb4278641549fc85285088ff6d83f9886757eef188f727e8d8f6a9c93a9c70b","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000017/isrg-20241231.htm","path":"sources/raw/Se4905bffbdcd3611.html","html_block":538,"text":"Our global operations expose us to risks arising from public health crises and outbreaks of epidemic, pandemic, or contagious diseases, such as, historically, the COVID-19 pandemic, the Ebola virus, Middle East Respiratory Syndrome (MERS), Severe Acute Respiratory Syndrome (SARS), and the H1N1 virus. These public health crises can divert medical resources and priorities toward disease treatment and adversely affect global economies and financial markets, which can negatively impact the number of procedures performed and our customers’ capital expenditures. Furthermore, public health","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Se4905bffbdcd3611","report":"2024-FY","filed":"2025-01-31","sha256":"6fb4278641549fc85285088ff6d83f9886757eef188f727e8d8f6a9c93a9c70b","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000017/isrg-20241231.htm","path":"sources/raw/Se4905bffbdcd3611.html","html_block":895,"text":"Service revenue was $1.31 billion in 2024, compared to $1.17 billion in 2023 and $1.02 billion in 2022. The increase in service revenue was primarily driven by the growth of the base of installed da Vinci surgical systems producing service revenue. The installed base of da Vinci surgical systems grew 15% to approximately 9,902 as of December 31, 2024; 14% to approximately 8,606 as of December 31, 2023; and 12% to approximately 7,544 as of December 31, 2022.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Se4905bffbdcd3611","report":"2024-FY","filed":"2025-01-31","sha256":"6fb4278641549fc85285088ff6d83f9886757eef188f727e8d8f6a9c93a9c70b","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000017/isrg-20241231.htm","path":"sources/raw/Se4905bffbdcd3611.html","html_block":903,"text":"The following table summarizes our system placements under leasing arrangements for the years ended December 31, 2024, 2023, and 2022:","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Se4905bffbdcd3611","report":"2024-FY","filed":"2025-01-31","sha256":"6fb4278641549fc85285088ff6d83f9886757eef188f727e8d8f6a9c93a9c70b","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000017/isrg-20241231.htm","path":"sources/raw/Se4905bffbdcd3611.html","html_block":966,"text":"In 2024, approximately 2,683,000 surgical procedures were performed with da Vinci surgical systems, compared to approximately 2,286,000 and 1,875,000 surgical procedures performed with da Vinci surgical systems in 2023 and 2022, respectively. The increase in our overall procedure volume in 2024 was largely attributable to growth in U.S. general surgery, OUS general surgery (particularly cancer), OUS urologic surgery, and U.S. gynecologic surgery procedures. The overall procedure volume in the 2022 comparative year reflects disruption caused by the COVID-19 pandemic.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Se4905bffbdcd3611","report":"2024-FY","filed":"2025-01-31","sha256":"6fb4278641549fc85285088ff6d83f9886757eef188f727e8d8f6a9c93a9c70b","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000017/isrg-20241231.htm","path":"sources/raw/Se4905bffbdcd3611.html","html_block":975,"text":"In 2024, approximately 95,500 biopsy procedures were performed with Ion systems, compared to approximately 53,800 in 2023 and approximately 23,500 in 2022. The increase in our overall procedure volume in 2024 reflects a larger installed base of approximately 805 systems, an increase of 51% compared to the installed base of approximately 534 systems as of 2023. Currently, the vast majority of Ion biopsy procedures are performed in the U.S.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Se4905bffbdcd3611","report":"2024-FY","filed":"2025-01-31","sha256":"6fb4278641549fc85285088ff6d83f9886757eef188f727e8d8f6a9c93a9c70b","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000017/isrg-20241231.htm","path":"sources/raw/Se4905bffbdcd3611.html","html_block":982,"text":"Overall. Total da Vinci procedures performed by our customers grew approximately 17% in 2024, compared to approximately 22% in 2023. We believe that the growth in the comparative 2023 procedure results for both U.S. and OUS procedures partially reflected a benefit from procedures performed related to the backlog of patient treatments that resulted from COVID-19, as noted in the COVID-19 Pandemic section above. The 2024 procedure growth was largely attributable to growth in U.S. general surgery, OUS general surgery (particularly cancer), OUS urologic surgery, and U.S. gynecologic surgery procedures.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Se4905bffbdcd3611","report":"2024-FY","filed":"2025-01-31","sha256":"6fb4278641549fc85285088ff6d83f9886757eef188f727e8d8f6a9c93a9c70b","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000017/isrg-20241231.htm","path":"sources/raw/Se4905bffbdcd3611.html","html_block":983,"text":"U.S. Procedures. U.S. da Vinci procedures grew approximately 15% in 2024, compared to approximately 19% in 2023. The 2024 U.S. procedure growth was largely attributable to strong growth in general surgery procedures, most notably cholecystectomy, hernia repair, and colorectal procedures. The number of U.S. da Vinci bariatric procedures performed declined modestly in 2024 compared to 2023. It is unclear whether the overall decline in the U.S. for surgical bariatric procedures will continue as patients evaluate new drug therapies and, if the decline continues, it is unclear what the rate of decline will be.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Se4905bffbdcd3611","report":"2024-FY","filed":"2025-01-31","sha256":"6fb4278641549fc85285088ff6d83f9886757eef188f727e8d8f6a9c93a9c70b","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000017/isrg-20241231.htm","path":"sources/raw/Se4905bffbdcd3611.html","html_block":997,"text":"We placed 1,526 da Vinci surgical systems in 2024, compared to 1,370 systems in 2023. The increase in system placements reflects incremental demand for our next-generation da Vinci 5 system and continued demand for additional capacity by our customers as a result of procedure growth, partially offset by a smaller number of third-generation da Vinci systems available for trade-in. During 2024, we placed 362 da Vinci 5 systems.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Se4905bffbdcd3611","report":"2024-FY","filed":"2025-01-31","sha256":"6fb4278641549fc85285088ff6d83f9886757eef188f727e8d8f6a9c93a9c70b","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000017/isrg-20241231.htm","path":"sources/raw/Se4905bffbdcd3611.html","html_block":1022,"text":"•As of December 31, 2024, we had a da Vinci surgical system installed base of approximately 9,902 systems, an increase of 15% compared to the installed base of approximately 8,606 systems as of December 31, 2023.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Se4905bffbdcd3611","report":"2024-FY","filed":"2025-01-31","sha256":"6fb4278641549fc85285088ff6d83f9886757eef188f727e8d8f6a9c93a9c70b","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000017/isrg-20241231.htm","path":"sources/raw/Se4905bffbdcd3611.html","html_block":1025,"text":"•As of December 31, 2024, we had an Ion system installed base of approximately 805 systems, an increase of 51% compared to the installed base of approximately 534 systems as of December 31, 2023.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Se4905bffbdcd3611","report":"2024-FY","filed":"2025-01-31","sha256":"6fb4278641549fc85285088ff6d83f9886757eef188f727e8d8f6a9c93a9c70b","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000017/isrg-20241231.htm","path":"sources/raw/Se4905bffbdcd3611.html","html_block":1050,"text":"Systems revenue increased by 17% to $1.97 billion for the year ended December 31, 2024, compared to $1.68 billion for the year ended December 31, 2023. The higher system revenue for the year ended December 31, 2024, was primarily driven by an increase in da Vinci system placements, higher operating lease revenue, higher ASPs, and higher lease buyout revenue, partially offset by a higher proportion of da Vinci system placements under operating leases.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Se4905bffbdcd3611","report":"2024-FY","filed":"2025-01-31","sha256":"6fb4278641549fc85285088ff6d83f9886757eef188f727e8d8f6a9c93a9c70b","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000017/isrg-20241231.htm","path":"sources/raw/Se4905bffbdcd3611.html","html_block":1052,"text":"The following table summarizes our da Vinci system placements and systems installed at customers under leasing arrangements for the years ended December 31, 2024, and 2023:","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Se4905bffbdcd3611","report":"2024-FY","filed":"2025-01-31","sha256":"6fb4278641549fc85285088ff6d83f9886757eef188f727e8d8f6a9c93a9c70b","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000017/isrg-20241231.htm","path":"sources/raw/Se4905bffbdcd3611.html","html_block":1057,"text":"During 2024, 271 Ion systems were placed compared to 213 systems during 2023. By geography, 253 systems were placed in the U.S., 14 in Europe, and 4 in Asia during 2024, compared to 211 systems placed in the U.S. and 2 systems in Europe during 2023. The increase in system placements was primarily driven by the demand for additional capacity by our customers due to the procedure growth and OUS expansion. As of December 31, 2024, we had an Ion system installed base of approximately 805 systems, compared to an installed base of approximately 534 systems as of December 31, 2023.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Se4905bffbdcd3611","report":"2024-FY","filed":"2025-01-31","sha256":"6fb4278641549fc85285088ff6d83f9886757eef188f727e8d8f6a9c93a9c70b","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000017/isrg-20241231.htm","path":"sources/raw/Se4905bffbdcd3611.html","html_block":1058,"text":"The following table summarizes our Ion system placements and systems installed at customers under leasing arrangements for the years ended December 31, 2024, and 2023:","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Se4905bffbdcd3611","report":"2024-FY","filed":"2025-01-31","sha256":"6fb4278641549fc85285088ff6d83f9886757eef188f727e8d8f6a9c93a9c70b","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000017/isrg-20241231.htm","path":"sources/raw/Se4905bffbdcd3611.html","html_block":1061,"text":"Service revenue increased by 12% to $1.31 billion for the year ended December 31, 2024, compared to $1.17 billion for the year ended December 31, 2023. The increase in service revenue for the year ended December 31, 2024, was primarily driven by a larger installed base of systems producing service revenue, partially offset by a higher proportion of early-stage usage-based operating lease arrangements where procedures are ramping up.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Se4905bffbdcd3611","report":"2024-FY","filed":"2025-01-31","sha256":"6fb4278641549fc85285088ff6d83f9886757eef188f727e8d8f6a9c93a9c70b","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000017/isrg-20241231.htm","path":"sources/raw/Se4905bffbdcd3611.html","html_block":1073,"text":"Service gross profit for the year ended December 31, 2024, increased by 11% to $0.90 billion, representing 69.0% of service revenue, compared to $0.82 billion, representing 69.8% of service revenue, for the year ended December 31, 2023. The higher service gross profit for the year ended December 31, 2024, was primarily driven by higher service revenue, reflecting a larger installed base of systems, and a lower service gross profit margin. The lower service gross profit margin for the year ended December 31, 2024, was primarily driven by an unfavorable repair mix and higher excess and obsolete inventory charges, partially offset by fixed cost leverage from higher repair volume.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Se4905bffbdcd3611","report":"2024-FY","filed":"2025-01-31","sha256":"6fb4278641549fc85285088ff6d83f9886757eef188f727e8d8f6a9c93a9c70b","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000017/isrg-20241231.htm","path":"sources/raw/Se4905bffbdcd3611.html","html_block":1369,"text":"The Company enters into lease arrangements with certain qualified customers. Leases have terms that generally range from 12 to 84 months and are usually collateralized by a security interest in the underlying assets. The Company also leases systems to certain qualified customers under usage-based arrangements that have terms of up to 84 months. For these usage-based lease arrangements, the lease fee is generally billed monthly in arrears based on a contractual per-use fee where usage is generally defined as the number of procedures performed with the system.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Se7f95d2f97642180","report":"2025-FY","filed":"2026-02-03","sha256":"bdcd15add5b70b03a8342ffe169b54530d4805c9e4c12796985d3245993ac991","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526726000010/isrg-20251231.htm","path":"sources/raw/Se7f95d2f97642180.html","html_block":235,"text":"We have a network of field service and technical support engineers across the U.S., Canada, Europe, and Asia and maintain relationships with various distributors around the globe. This infrastructure of customer service and support specialists, along with advanced service tools and solutions, offers a full complement of services, including installation, repair, maintenance, 24/7 technical support, and proactive system health monitoring. We generate service revenue by providing these services to our customers through comprehensive service contracts and time and material programs.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Se7f95d2f97642180","report":"2025-FY","filed":"2026-02-03","sha256":"bdcd15add5b70b03a8342ffe169b54530d4805c9e4c12796985d3245993ac991","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526726000010/isrg-20251231.htm","path":"sources/raw/Se7f95d2f97642180.html","html_block":591,"text":"(MERS), Severe Acute Respiratory Syndrome (SARS), and the H1N1 virus. These public health crises can divert medical resources and priorities toward disease treatment and adversely affect global economies and financial markets, which can negatively impact the number of procedures performed and our customers’ capital expenditures. Furthermore, public health crises can cause significant business disruptions, including temporary closures of our facilities and those of our suppliers, as well as reduced access to customers due to measures like travel restrictions. These impacts can have a material adverse effect on our business, financial condition, or results of operations.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Se7f95d2f97642180","report":"2025-FY","filed":"2026-02-03","sha256":"bdcd15add5b70b03a8342ffe169b54530d4805c9e4c12796985d3245993ac991","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526726000010/isrg-20251231.htm","path":"sources/raw/Se7f95d2f97642180.html","html_block":919,"text":"Since 2022, several provinces in China have implemented significant limits on what hospitals can charge patients for surgeries using robotic surgical technology, including soft tissue surgery. These limits have impacted the number of procedures performed in those provinces as well as pricing of our instruments and accessories, which have impacted our instruments and accessories revenue. However, as of the date of this report, these limits have not had a material impact on our business,","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Se7f95d2f97642180","report":"2025-FY","filed":"2026-02-03","sha256":"bdcd15add5b70b03a8342ffe169b54530d4805c9e4c12796985d3245993ac991","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526726000010/isrg-20251231.htm","path":"sources/raw/Se7f95d2f97642180.html","html_block":937,"text":"•1,721 da Vinci surgical systems were placed during the year ended December 31, 2025, an increase of 13% compared to 1,526 systems during the year ended December 31, 2024. The 2025 da Vinci surgical system placements included 870 da Vinci 5 surgical systems, compared with 362 in 2024.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Se7f95d2f97642180","report":"2025-FY","filed":"2026-02-03","sha256":"bdcd15add5b70b03a8342ffe169b54530d4805c9e4c12796985d3245993ac991","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526726000010/isrg-20251231.htm","path":"sources/raw/Se7f95d2f97642180.html","html_block":938,"text":"•As of December 31, 2025, we had a da Vinci surgical system installed base of approximately 11,106 systems, an increase of 12% compared to the installed base of approximately 9,902 systems as of December 31, 2024.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Se7f95d2f97642180","report":"2025-FY","filed":"2026-02-03","sha256":"bdcd15add5b70b03a8342ffe169b54530d4805c9e4c12796985d3245993ac991","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526726000010/isrg-20251231.htm","path":"sources/raw/Se7f95d2f97642180.html","html_block":941,"text":"•As of December 31, 2025, we had an Ion system installed base of approximately 995 systems, an increase of 24% compared to the installed base of approximately 805 systems as of December 31, 2024.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Se7f95d2f97642180","report":"2025-FY","filed":"2026-02-03","sha256":"bdcd15add5b70b03a8342ffe169b54530d4805c9e4c12796985d3245993ac991","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526726000010/isrg-20251231.htm","path":"sources/raw/Se7f95d2f97642180.html","html_block":960,"text":"Overall. Total da Vinci procedures performed by our customers grew approximately 18% in 2025, compared to approximately 17% in 2024, largely attributable to growth in U.S. general surgery, OUS general surgery (particularly cancer), OUS urologic surgery, and U.S. gynecologic surgery procedures.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Se7f95d2f97642180","report":"2025-FY","filed":"2026-02-03","sha256":"bdcd15add5b70b03a8342ffe169b54530d4805c9e4c12796985d3245993ac991","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526726000010/isrg-20251231.htm","path":"sources/raw/Se7f95d2f97642180.html","html_block":962,"text":"U.S. General Surgery. General surgery procedures in the U.S. grew approximately 18% in 2025, compared to approximately 19% in 2024, most notably cholecystectomy, hernia repair, appendectomy, and colorectal procedures. The number of U.S. da Vinci bariatric procedures performed declined in the high-single digits in 2025 compared to 2024. Cholecystectomy, inguinal and ventral hernia repair, and appendectomy procedures contributed the most incremental procedures in 2025. Cholecystectomy, inguinal and ventral hernia repair, and colorectal procedures contributed the most incremental procedures in 2024.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Se7f95d2f97642180","report":"2025-FY","filed":"2026-02-03","sha256":"bdcd15add5b70b03a8342ffe169b54530d4805c9e4c12796985d3245993ac991","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526726000010/isrg-20251231.htm","path":"sources/raw/Se7f95d2f97642180.html","html_block":977,"text":"In 2025, approximately 144,100 biopsy procedures were performed with Ion systems, compared to approximately 95,500 in 2024 and approximately 53,800 in 2023. The increase in our overall procedure volume in 2025 reflects a larger installed base of approximately 995 systems, an increase of 24% compared to the installed base of approximately 805 systems as of 2024. Currently, the vast majority of Ion biopsy procedures are performed in the U.S.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Se7f95d2f97642180","report":"2025-FY","filed":"2026-02-03","sha256":"bdcd15add5b70b03a8342ffe169b54530d4805c9e4c12796985d3245993ac991","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526726000010/isrg-20251231.htm","path":"sources/raw/Se7f95d2f97642180.html","html_block":985,"text":"As of December 31, 2025, we had a da Vinci surgical system installed base of approximately 11,106 systems compared to approximately 9,902 systems as of December 31, 2024. By geography, 6,364 systems were in the U.S., 2,168 in Europe, 1,993 in Asia, and 581 in the rest of the world. The incremental system installed base reflects continued procedure growth and further customer validation that robotic-assisted surgery addresses their Quintuple Aim objectives.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Se7f95d2f97642180","report":"2025-FY","filed":"2026-02-03","sha256":"bdcd15add5b70b03a8342ffe169b54530d4805c9e4c12796985d3245993ac991","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526726000010/isrg-20251231.htm","path":"sources/raw/Se7f95d2f97642180.html","html_block":986,"text":"During 2025, 195 Ion systems were placed compared to 271 systems during 2024. By geography, 169 systems were placed in the U.S., 16 in Europe, 7 in Asia, and 3 in other markets during 2025, compared to 253 systems placed in the U.S., 14 in Europe, and 4 in Asia during 2024. In the U.S., where we estimate that the Ion penetration of lung biopsies is approaching the halfway point of all lung biopsies performed, our customers’ focus has begun to shift from increasing capacity to increasing utilization of their existing systems. As of December 31, 2025, we had an Ion system installed base of approximately 995 systems, compared to an installed base of approximately 805 systems as of December 31, 2024.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Se7f95d2f97642180","report":"2025-FY","filed":"2026-02-03","sha256":"bdcd15add5b70b03a8342ffe169b54530d4805c9e4c12796985d3245993ac991","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526726000010/isrg-20251231.htm","path":"sources/raw/Se7f95d2f97642180.html","html_block":1039,"text":"Systems revenue increased by 26% to $2.47 billion for 2025, compared to $1.97 billion for 2024. The higher system revenue for the year ended December 31, 2025, was primarily driven by an increase in da Vinci surgical system placements, including a decrease in the proportion of da Vinci surgical system placements under operating leases, higher operating lease revenue, and higher ASPs.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Se7f95d2f97642180","report":"2025-FY","filed":"2026-02-03","sha256":"bdcd15add5b70b03a8342ffe169b54530d4805c9e4c12796985d3245993ac991","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526726000010/isrg-20251231.htm","path":"sources/raw/Se7f95d2f97642180.html","html_block":1044,"text":"Service revenue increased by 20% to 1.57 billion for 2025, compared to $1.31 billion for 2024. The increase in 2025 was primarily driven by a larger installed base of systems producing service revenue and favorable product mix, particularly from da Vinci 5 surgical system placements.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Se7f95d2f97642180","report":"2025-FY","filed":"2026-02-03","sha256":"bdcd15add5b70b03a8342ffe169b54530d4805c9e4c12796985d3245993ac991","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526726000010/isrg-20251231.htm","path":"sources/raw/Se7f95d2f97642180.html","html_block":1349,"text":"The Company enters into lease arrangements with certain qualified customers. Leases have terms that generally range from 12 to 84 months and are usually collateralized by a security interest in the underlying assets. The Company also leases systems to certain qualified customers under usage-based arrangements that have terms of up to 84 months. For these usage-based lease arrangements, the lease fee is generally billed monthly in arrears based on a contractual per-use fee where usage is generally defined as the number of procedures performed with the system.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S5d5c8a958ca612e9","report":"2015-FY","filed":"2016-02-02","sha256":"331580c5a525d78e1ae6505f440c0200fbd8f8fe4acab7d4784421daedaf824e","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526716000130/isrg-20151231x10k.htm","path":"sources/raw/S5d5c8a958ca612e9.html","html_block":123,"text":"We have a network of field service engineers across the U.S., Europe, and Asia and maintain relationships with various distributors around the globe. This infrastructure of service and support specialists offers a full complement of services, including 24/7 support, installation, repair, and maintenance for our customers. We generate service revenue by providing these services to our customers through comprehensive service contracts and time and material programs.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S5d5c8a958ca612e9","report":"2015-FY","filed":"2016-02-02","sha256":"331580c5a525d78e1ae6505f440c0200fbd8f8fe4acab7d4784421daedaf824e","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526716000130/isrg-20151231x10k.htm","path":"sources/raw/S5d5c8a958ca612e9.html","html_block":274,"text":"Outbreaks of pandemic or contagious diseases, such as the Ebola virus, Middle East Respiratory Syndrome, Severe Acute Respiratory Syndrome, or the H1N1 virus, could divert medical resources and priorities towards the treatment of that disease. An outbreak of a contagious disease could also negatively affect hospital admission rates. This could negatively impact the number of da Vinci procedures performed and have a material adverse effect on our business, financial condition, results of operations, or cash flows.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S5d5c8a958ca612e9","report":"2015-FY","filed":"2016-02-02","sha256":"331580c5a525d78e1ae6505f440c0200fbd8f8fe4acab7d4784421daedaf824e","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526716000130/isrg-20151231x10k.htm","path":"sources/raw/S5d5c8a958ca612e9.html","html_block":341,"text":"Our capital sales in China are subject to importation authorizations and central purchasing tender processes. Therefore, future system sales and our ability to grow future procedure volumes are dependent on the completion of these central purchasing tender authorizations, the most recent of which expired at the end of 2015. The timing and magnitude of these future authorizations, which may determine our system placements in future years, is not certain and we expect to continue to experience variability in the timing of capital sales in China.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S5d5c8a958ca612e9","report":"2015-FY","filed":"2016-02-02","sha256":"331580c5a525d78e1ae6505f440c0200fbd8f8fe4acab7d4784421daedaf824e","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526716000130/isrg-20151231x10k.htm","path":"sources/raw/S5d5c8a958ca612e9.html","html_block":419,"text":"In 2015, approximately 652,000 surgical procedures were performed with the da Vinci Surgical System, compared with approximately 570,000 and 523,000 procedures performed in 2014 and 2013, respectively. The growth in our overall procedure volume in 2015 was driven by growth in U.S. general surgery procedures and worldwide urologic procedures.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S5d5c8a958ca612e9","report":"2015-FY","filed":"2016-02-02","sha256":"331580c5a525d78e1ae6505f440c0200fbd8f8fe4acab7d4784421daedaf824e","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526716000130/isrg-20151231x10k.htm","path":"sources/raw/S5d5c8a958ca612e9.html","html_block":427,"text":"Recurring revenue has generally grown at a faster rate than system revenue in the last few fiscal years. Recurring revenue increased to $1.7 billion, or 70% of total revenue in 2015, compared with $1.5 billion, or 70% of total revenue in 2014 and $1.4 billion, or 63% of total revenue in 2013. The growth of recurring revenue and its increasing proportion of total revenue largely reflect continued procedure adoption on a growing base of installed da Vinci Surgical Systems. The installed base of da Vinci Surgical Systems has grown to approximately 3,597 at December 31, 2015, compared with 3,266 at December 31, 2014, and 2,966 at December 31, 2013.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S5d5c8a958ca612e9","report":"2015-FY","filed":"2016-02-02","sha256":"331580c5a525d78e1ae6505f440c0200fbd8f8fe4acab7d4784421daedaf824e","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526716000130/isrg-20151231x10k.htm","path":"sources/raw/S5d5c8a958ca612e9.html","html_block":430,"text":"Since 2013, we have entered into sales-type and operating lease arrangements directly with certain qualified customers as a way to offer customers flexibility in how they acquire da Vinci systems and expand da Vinci surgery availability while leveraging our balance sheet. The leases generally have commercially competitive terms as compared with other third party entities that offer equipment leasing. We include both operating and sales-type leases in our system shipment and installed base disclosures. We exclude operating leases from our system average selling prices computations.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S5d5c8a958ca612e9","report":"2015-FY","filed":"2016-02-02","sha256":"331580c5a525d78e1ae6505f440c0200fbd8f8fe4acab7d4784421daedaf824e","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526716000130/isrg-20151231x10k.htm","path":"sources/raw/S5d5c8a958ca612e9.html","html_block":458,"text":"The higher 2015 OUS procedure growth rate reflects increased da Vinci adoption in Asian markets, including China, Japan, and South Korea. While we are encouraged by procedure adoption in China, future system placements and our ability to sustain procedure growth are dependent on obtaining importation authorizations and hospitals completing the central purchasing tender under the authorization, the most recent of which expired at the end of 2015. The timing and magnitude of future authorizations, which may enable system placements in 2016 and beyond, is not certain. In Japan, procedure growth rates are likely to be paced by the timing of procedure reimbursement approvals for procedures in addition to dVP.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S5d5c8a958ca612e9","report":"2015-FY","filed":"2016-02-02","sha256":"331580c5a525d78e1ae6505f440c0200fbd8f8fe4acab7d4784421daedaf824e","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526716000130/isrg-20151231x10k.htm","path":"sources/raw/S5d5c8a958ca612e9.html","html_block":518,"text":"Service revenue increased by 8% to $464.8 million for the year ended December 31, 2015, compared with $429.0 million for the year ended December 31, 2014. Service revenue increased by 8% to $429.0 million for the year ended December 31, 2014, compared with $397.3 million for the year ended December 31, 2013. We typically enter into multi-year fixed annual rate service contracts at the time systems are sold. These service contracts have been generally renewed at the end of the service periods. Higher service revenue in 2015 and 2014 was primarily driven by a larger installed base of da Vinci Surgical Systems producing service revenue.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S5d5c8a958ca612e9","report":"2015-FY","filed":"2016-02-02","sha256":"331580c5a525d78e1ae6505f440c0200fbd8f8fe4acab7d4784421daedaf824e","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526716000130/isrg-20151231x10k.htm","path":"sources/raw/S5d5c8a958ca612e9.html","html_block":527,"text":"Service gross profit for the year ended December 31, 2015, increased to $305.5 million, or 65.7% of service revenue, compared with $281.0 million, or 65.5% of service revenue for the year ended December 31, 2014. The higher 2015 service gross profit was driven by higher service revenue, reflecting a larger installed base of da Vinci Surgical Systems. Consistent with product gross profit margin, service gross profit margin improved during 2015 from 63.3% of service revenue during the first quarter to 67.2% in the fourth quarter, reflecting efficiency gains made during the year to support the recently introduced da Vinci Xi platform in the field.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sf4bd1ac338b40e62","report":"2016-FY","filed":"2017-02-06","sha256":"8a40da9d03284c874053bf1082eb672cbf4844781a3d3d8c19c8b6334421d7f8","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526717000021/isrg-20161231x10k.htm","path":"sources/raw/Sf4bd1ac338b40e62.html","html_block":151,"text":"We have a network of field service engineers across the U.S., Europe, and Asia and maintain relationships with various distributors around the globe. This infrastructure of service and support specialists offers a full complement of services, including 24/7 support, installation, repair, and maintenance for our customers. We generate service revenue by providing these services to our customers through comprehensive service contracts and time and material programs.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sf4bd1ac338b40e62","report":"2016-FY","filed":"2017-02-06","sha256":"8a40da9d03284c874053bf1082eb672cbf4844781a3d3d8c19c8b6334421d7f8","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526717000021/isrg-20161231x10k.htm","path":"sources/raw/Sf4bd1ac338b40e62.html","html_block":349,"text":"Outbreaks of pandemic or contagious diseases, such as the Ebola virus, Middle East Respiratory Syndrome, Severe Acute Respiratory Syndrome, or the H1N1 virus, could divert medical resources and priorities towards the treatment of that disease. An outbreak of a contagious disease could also negatively affect hospital admission rates. This could negatively impact the number of da Vinci procedures performed and have a material adverse effect on our business, financial condition, results of operations, or cash flows.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sf4bd1ac338b40e62","report":"2016-FY","filed":"2017-02-06","sha256":"8a40da9d03284c874053bf1082eb672cbf4844781a3d3d8c19c8b6334421d7f8","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526717000021/isrg-20161231x10k.htm","path":"sources/raw/Sf4bd1ac338b40e62.html","html_block":438,"text":"Our capital sales in China are subject to importation authorizations and central purchasing tender processes. Therefore, future system sales and our ability to grow future procedure volumes are dependent on the completion of these central purchasing tender authorizations, the most recent of which expired at the end of 2015. The timing and magnitude of these future authorizations, which may determine our system placements in future years, is not certain and we expect to continue to experience variability in the timing of capital sales in China.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sf4bd1ac338b40e62","report":"2016-FY","filed":"2017-02-06","sha256":"8a40da9d03284c874053bf1082eb672cbf4844781a3d3d8c19c8b6334421d7f8","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526717000021/isrg-20161231x10k.htm","path":"sources/raw/Sf4bd1ac338b40e62.html","html_block":545,"text":"In 2016, approximately 753,000 surgical procedures were performed with the da Vinci Surgical System, compared with approximately 652,000 and 570,000 procedures performed in 2015 and 2014, respectively. The growth in our overall procedure volume in 2016 was driven by growth in U.S. general surgery procedures and worldwide urologic procedures.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sf4bd1ac338b40e62","report":"2016-FY","filed":"2017-02-06","sha256":"8a40da9d03284c874053bf1082eb672cbf4844781a3d3d8c19c8b6334421d7f8","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526717000021/isrg-20161231x10k.htm","path":"sources/raw/Sf4bd1ac338b40e62.html","html_block":556,"text":"Recurring revenue has generally grown at a faster rate than system revenue in the last few fiscal years. Recurring revenue increased to $1.9 billion, or 71% of total revenue in 2016, compared with $1.7 billion, or 70% of total revenue in 2015 and $1.5 billion, or 70% of total revenue in 2014. The growth of recurring revenue and its increasing proportion of total revenue largely reflect continued procedure adoption on a growing base of installed da Vinci Surgical Systems. The installed base of da Vinci Surgical Systems has grown to approximately 3,919 at December 31, 2016, compared with 3,597 at December 31, 2015, and 3,266 at December 31, 2014.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sf4bd1ac338b40e62","report":"2016-FY","filed":"2017-02-06","sha256":"8a40da9d03284c874053bf1082eb672cbf4844781a3d3d8c19c8b6334421d7f8","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526717000021/isrg-20161231x10k.htm","path":"sources/raw/Sf4bd1ac338b40e62.html","html_block":569,"text":"Since 2013, we have entered into sales-type and operating lease arrangements directly with certain qualified customers as a way to offer customers flexibility in how they acquire da Vinci systems and expand da Vinci surgery availability while leveraging our balance sheet. The leases generally have commercially competitive terms as compared with other third party entities that offer equipment leasing. We include both operating and sales-type leases in our system shipment and installed base disclosures. We exclude operating leases from our system average selling price computations.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sf4bd1ac338b40e62","report":"2016-FY","filed":"2017-02-06","sha256":"8a40da9d03284c874053bf1082eb672cbf4844781a3d3d8c19c8b6334421d7f8","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526717000021/isrg-20161231x10k.htm","path":"sources/raw/Sf4bd1ac338b40e62.html","html_block":603,"text":"We believe the return to growth in U.S. dVP in 2014 and our subsequent growth rate reflects surgical procedures being performed for men who may have previously deferred screening or definitive treatment. We believe that our lower 2016 growth rate reflects surgical volumes coming into closer alignment with new diagnoses of prostate cancer. As the U.S. standard of care for the surgical treatment of prostate cancer, we expect that the number of dVP procedures performed in the U.S. will fluctuate with the overall prostatectomy market. dVP is the largest overall OUS procedure with approximately 92,000 performed in 2016, compared with 79,000 in 2015, and 65,000 in 2014. dVP is at various stages of adoption in different areas of the world.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sf4bd1ac338b40e62","report":"2016-FY","filed":"2017-02-06","sha256":"8a40da9d03284c874053bf1082eb672cbf4844781a3d3d8c19c8b6334421d7f8","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526717000021/isrg-20161231x10k.htm","path":"sources/raw/Sf4bd1ac338b40e62.html","html_block":666,"text":"Service revenue increased by 11% to $517.0 million for the year ended December 31, 2016, compared with $464.8 million for the year ended December 31, 2015. Service revenue increased by 8% to $464.8 million for the year ended December 31, 2015, compared with $429.0 million for the year ended December 31, 2014. Higher service revenue in 2016 and 2015 was primarily driven by a larger installed base of da Vinci Surgical Systems producing service revenue.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sf4bd1ac338b40e62","report":"2016-FY","filed":"2017-02-06","sha256":"8a40da9d03284c874053bf1082eb672cbf4844781a3d3d8c19c8b6334421d7f8","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526717000021/isrg-20161231x10k.htm","path":"sources/raw/Sf4bd1ac338b40e62.html","html_block":681,"text":"Service gross profit for the year ended December 31, 2015, increased to $305.5 million, or 65.7% of service revenue, compared with $281.0 million, or 65.5% of service revenue for the year ended December 31, 2014. The higher 2015 service gross profit was driven by higher service revenue, reflecting a larger installed base of da Vinci Surgical Systems.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S2e9349ddf54993e4","report":"2017-FY","filed":"2018-02-02","sha256":"a5c701a0d87c591dbbdd7acc092f0f6eeda6a0e3172e2d8f7f25a8a37ad6185a","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526718000013/isrg-20171231x10k.htm","path":"sources/raw/S2e9349ddf54993e4.html","html_block":133,"text":"We believe there are numerous additional applications that can be addressed with the da Vinci Surgical System and we work closely with our surgeon customers to refine and explore new techniques in which da Vinci may bring value. As of December 31, 2017, we had an installed base of 4,409 da Vinci Surgical Systems, including 2,862 in the U.S., 742 in Europe, 579 in Asia, and 226 in the rest of the world. We estimate that surgeons using our technology completed approximately 877,000 surgical procedures of various types in hospitals throughout the world during the year ended December 31, 2017.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S2e9349ddf54993e4","report":"2017-FY","filed":"2018-02-02","sha256":"a5c701a0d87c591dbbdd7acc092f0f6eeda6a0e3172e2d8f7f25a8a37ad6185a","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526718000013/isrg-20171231x10k.htm","path":"sources/raw/S2e9349ddf54993e4.html","html_block":147,"text":"We have a network of field service engineers across the U.S., Europe, and Asia and maintain relationships with various distributors around the globe. This infrastructure of service and support specialists offers a full complement of services for our customers, including 24/7 support, installation, repair, and maintenance. We generate service revenue by providing these services to our customers through comprehensive service contracts and time and material programs.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S2e9349ddf54993e4","report":"2017-FY","filed":"2018-02-02","sha256":"a5c701a0d87c591dbbdd7acc092f0f6eeda6a0e3172e2d8f7f25a8a37ad6185a","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526718000013/isrg-20171231x10k.htm","path":"sources/raw/S2e9349ddf54993e4.html","html_block":351,"text":"Outbreaks of pandemic or contagious diseases, such as the Ebola virus, Middle East Respiratory Syndrome, Severe Acute Respiratory Syndrome, or the H1N1 virus, could divert medical resources and priorities towards the treatment of that disease. An outbreak of a contagious disease could also negatively affect hospital admission rates. This could negatively impact the number of da Vinci procedures performed and have a material adverse effect on our business, financial condition, results of operations, or cash flows.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S2e9349ddf54993e4","report":"2017-FY","filed":"2018-02-02","sha256":"a5c701a0d87c591dbbdd7acc092f0f6eeda6a0e3172e2d8f7f25a8a37ad6185a","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526718000013/isrg-20171231x10k.htm","path":"sources/raw/S2e9349ddf54993e4.html","html_block":441,"text":"Our capital sales in China are subject to importation authorizations and central purchasing tender processes. Therefore, future system sales and our ability to grow future procedure volumes are dependent on the completion of these central purchasing tender authorizations, the most recent of which expired at the end of 2015. The timing and magnitude of these future authorizations, which may determine our system placements in future years, is not certain and we expect to continue to experience variability in the timing of capital sales in China.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S2e9349ddf54993e4","report":"2017-FY","filed":"2018-02-02","sha256":"a5c701a0d87c591dbbdd7acc092f0f6eeda6a0e3172e2d8f7f25a8a37ad6185a","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526718000013/isrg-20171231x10k.htm","path":"sources/raw/S2e9349ddf54993e4.html","html_block":551,"text":"Service revenue growth has been driven by the growth of the base of installed da Vinci Surgical Systems. The installed base of da Vinci Surgical Systems grew 13% to approximately 4,409 at December 31, 2017; 9% to approximately 3,919 at December 31, 2016; and 10% to approximately 3,597 at December 31, 2015. Service revenue grew 13% to $581.8 million in 2017; 11% to $517.0 million in 2016; and 8% to $464.8 million in 2015.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S2e9349ddf54993e4","report":"2017-FY","filed":"2018-02-02","sha256":"a5c701a0d87c591dbbdd7acc092f0f6eeda6a0e3172e2d8f7f25a8a37ad6185a","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526718000013/isrg-20171231x10k.htm","path":"sources/raw/S2e9349ddf54993e4.html","html_block":552,"text":"Operating lease revenue has grown as a larger proportion of systems shipped are under operating lease arrangements. In the years ended December 31, 2017, 2016, and 2015, a total of 108, 62, and 43 of system placements were classified as operating leases, respectively. Revenue from operating lease arrangements is generally recognized on a straight-line basis over the lease term. Operating lease revenue for the years ended December 31, 2017, 2016, and 2015, was $25.9 million, $16.6 million and $7.0 million, respectively. As of December 31, 2017, a total of 164 da Vinci Surgical Systems were installed at customers under operating lease arrangements.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S2e9349ddf54993e4","report":"2017-FY","filed":"2018-02-02","sha256":"a5c701a0d87c591dbbdd7acc092f0f6eeda6a0e3172e2d8f7f25a8a37ad6185a","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526718000013/isrg-20171231x10k.htm","path":"sources/raw/S2e9349ddf54993e4.html","html_block":554,"text":"Since 2013, we have entered into sales-type and operating lease arrangements directly with certain qualified customers as a way to offer customers flexibility in how they acquire da Vinci Surgical Systems and expand da Vinci Surgery availability while leveraging our balance sheet. The leases generally have commercially competitive terms as compared with other third party entities that offer equipment leasing. We include both operating and sales-type leases in our system shipment and installed base disclosures. We exclude operating leases from our system average selling prices computations.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S2e9349ddf54993e4","report":"2017-FY","filed":"2018-02-02","sha256":"a5c701a0d87c591dbbdd7acc092f0f6eeda6a0e3172e2d8f7f25a8a37ad6185a","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526718000013/isrg-20171231x10k.htm","path":"sources/raw/S2e9349ddf54993e4.html","html_block":557,"text":"System placements are driven by procedure growth in most markets. In geographies where da Vinci procedure adoption is in an early stage, system sales will precede procedure growth. System placements also vary due to seasonality. System revenue grew 15% to $910.2 million in 2017; 10% to $791.6 million in 2016; and 14% to $721.9 million in 2015. System revenue is also affected by the proportion of systems placed that are under operating lease arrangements, recurring operating lease revenue, operating lease buyouts, product mix, ASPs, and trade-in activities.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S2e9349ddf54993e4","report":"2017-FY","filed":"2018-02-02","sha256":"a5c701a0d87c591dbbdd7acc092f0f6eeda6a0e3172e2d8f7f25a8a37ad6185a","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526718000013/isrg-20171231x10k.htm","path":"sources/raw/S2e9349ddf54993e4.html","html_block":590,"text":"In 2017, approximately 877,000 surgical procedures were performed with the da Vinci Surgical Systems, compared with approximately 753,000 and 652,000 procedures performed in 2016 and 2015, respectively. The growth in our overall procedure volume in 2017 was driven by growth in U.S. general surgery procedures and worldwide urologic procedures.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S2e9349ddf54993e4","report":"2017-FY","filed":"2018-02-02","sha256":"a5c701a0d87c591dbbdd7acc092f0f6eeda6a0e3172e2d8f7f25a8a37ad6185a","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526718000013/isrg-20171231x10k.htm","path":"sources/raw/S2e9349ddf54993e4.html","html_block":672,"text":"Service revenue increased by 13% to $581.8 million for the year ended December 31, 2017, compared with $517.0 million for the year ended December 31, 2016. Service revenue increased by 11% to $517.0 million for the year ended December 31, 2016, compared with $464.8 million for the year ended December 31, 2015. Higher service revenue in 2017 and 2016 was primarily driven by a larger installed base of da Vinci Surgical Systems producing service revenue.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S2e9349ddf54993e4","report":"2017-FY","filed":"2018-02-02","sha256":"a5c701a0d87c591dbbdd7acc092f0f6eeda6a0e3172e2d8f7f25a8a37ad6185a","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526718000013/isrg-20171231x10k.htm","path":"sources/raw/S2e9349ddf54993e4.html","html_block":683,"text":"Service gross profit for the year ended December 31, 2017, increased to $401.9 million, or 69.1% of service revenue, compared with $366.0 million, or 70.8% of service revenue, for the year ended December 31, 2016. The higher 2017 service gross profit was driven by higher service revenue, reflecting a larger installed base of da Vinci Surgical Systems, partially offset by lower service gross profit margin. The lower service gross profit margin for the year ended December 31, 2017, was primarily driven by higher costs associated with the repair of da Vinci Xi endoscope products.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sb1d9b40f5355aa1a","report":"2018-FY","filed":"2019-02-04","sha256":"c1588fb328e0804bf8fe43321adba4d41ce84c08a268d2af70bf515aff1777fa","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526719000012/isrg-20181231x10k.htm","path":"sources/raw/Sb1d9b40f5355aa1a.html","html_block":134,"text":"We believe there are numerous additional applications that can be addressed with the da Vinci Surgical System and we work closely with our surgeon customers to refine and explore new techniques in which da Vinci may bring value. As of December 31, 2018, we had an installed base of 4,986 da Vinci Surgical Systems, including 3,196 in the U.S., 872 in Europe, 651 in Asia, and 267 in the rest of the world. We estimate that surgeons using our technology completed approximately 1,037,000 surgical procedures of various types in hospitals throughout the world during the year ended December 31, 2018.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sb1d9b40f5355aa1a","report":"2018-FY","filed":"2019-02-04","sha256":"c1588fb328e0804bf8fe43321adba4d41ce84c08a268d2af70bf515aff1777fa","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526719000012/isrg-20181231x10k.htm","path":"sources/raw/Sb1d9b40f5355aa1a.html","html_block":144,"text":"We have a network of field service engineers across the U.S., Europe, and Asia and maintain relationships with various distributors around the globe. This infrastructure of service and support specialists offers a full complement of services for our customers, including 24/7 support, installation, repair, and maintenance. We generate service revenue by providing these services to our customers through comprehensive service contracts and time and material programs.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sb1d9b40f5355aa1a","report":"2018-FY","filed":"2019-02-04","sha256":"c1588fb328e0804bf8fe43321adba4d41ce84c08a268d2af70bf515aff1777fa","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526719000012/isrg-20181231x10k.htm","path":"sources/raw/Sb1d9b40f5355aa1a.html","html_block":348,"text":"Outbreaks of pandemic or contagious diseases, such as the Ebola virus, Middle East Respiratory Syndrome, Severe Acute Respiratory Syndrome, or the H1N1 virus, could divert medical resources and priorities towards the treatment of that disease. An outbreak of a contagious disease could also negatively affect hospital admission rates. This could negatively impact the number of da Vinci procedures performed and have a material adverse effect on our business, financial condition, results of operations, or cash flows.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sb1d9b40f5355aa1a","report":"2018-FY","filed":"2019-02-04","sha256":"c1588fb328e0804bf8fe43321adba4d41ce84c08a268d2af70bf515aff1777fa","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526719000012/isrg-20181231x10k.htm","path":"sources/raw/Sb1d9b40f5355aa1a.html","html_block":566,"text":"Service revenue growth has been driven by the growth of the base of installed da Vinci Surgical Systems. The installed base of da Vinci Surgical Systems grew 13% to approximately 4,986 at December 31, 2018; 13% to approximately 4,409 at December 31, 2017; and 9% to approximately 3,919 at December 31, 2016. Service revenue grew 11% to $635.1 million in 2018; 12% to $572.9 million in 2017; and 10% to $510.7 million in 2016.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sb1d9b40f5355aa1a","report":"2018-FY","filed":"2019-02-04","sha256":"c1588fb328e0804bf8fe43321adba4d41ce84c08a268d2af70bf515aff1777fa","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526719000012/isrg-20181231x10k.htm","path":"sources/raw/Sb1d9b40f5355aa1a.html","html_block":567,"text":"Operating lease revenue has grown as a larger proportion of systems shipped are under operating lease arrangements. In the years ended December 31, 2018, 2017, and 2016, a total of 229, 108, and 62 of system placements were classified as operating leases, respectively. Revenue from operating lease arrangements is generally recognized on a straight-line basis over the lease term or based upon system usage. Operating lease revenue for the years ended December 31, 2018, 2017, and 2016, was $51.4 million, $25.9 million and $16.6 million, respectively. As of December 31, 2018, a total of 350 da Vinci Surgical Systems were installed at customers under operating lease arrangements.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sb1d9b40f5355aa1a","report":"2018-FY","filed":"2019-02-04","sha256":"c1588fb328e0804bf8fe43321adba4d41ce84c08a268d2af70bf515aff1777fa","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526719000012/isrg-20181231x10k.htm","path":"sources/raw/Sb1d9b40f5355aa1a.html","html_block":569,"text":"Since 2013, we have entered into sales-type and operating lease arrangements directly with certain qualified customers as a way to offer customers flexibility in how they acquire da Vinci Surgical Systems and expand robotic-assisted surgery availability while leveraging our balance sheet. These leases generally have commercially competitive terms as compared with other third-party entities that offer equipment leasing. We include both operating and sales-type leases in our system shipment and installed base disclosures. We exclude operating leases from our system average selling price (“ASP”) computations.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sb1d9b40f5355aa1a","report":"2018-FY","filed":"2019-02-04","sha256":"c1588fb328e0804bf8fe43321adba4d41ce84c08a268d2af70bf515aff1777fa","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526719000012/isrg-20181231x10k.htm","path":"sources/raw/Sb1d9b40f5355aa1a.html","html_block":572,"text":"System placements are driven by procedure growth in most markets. In geographies where da Vinci procedure adoption is in an early stage, system sales will precede procedure growth. System placements also vary due to seasonality largely aligned with hospital budgeting cycles. We typically place a higher proportion of annual system placements in the fourth quarter and a lower proportion in the first quarter as budgets are reset. System revenue grew 21% to $1,127.1 million in 2018; 16% to $928.4 million","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sb1d9b40f5355aa1a","report":"2018-FY","filed":"2019-02-04","sha256":"c1588fb328e0804bf8fe43321adba4d41ce84c08a268d2af70bf515aff1777fa","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526719000012/isrg-20181231x10k.htm","path":"sources/raw/Sb1d9b40f5355aa1a.html","html_block":615,"text":"In 2018, approximately 1,037,000 surgical procedures were performed with the da Vinci Surgical Systems, compared with approximately 877,000 and 753,000 procedures performed in 2017 and 2016, respectively. The growth in our overall procedure volume in 2018 was driven by growth in U.S. general surgery procedures and worldwide urologic procedures.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sb1d9b40f5355aa1a","report":"2018-FY","filed":"2019-02-04","sha256":"c1588fb328e0804bf8fe43321adba4d41ce84c08a268d2af70bf515aff1777fa","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526719000012/isrg-20181231x10k.htm","path":"sources/raw/Sb1d9b40f5355aa1a.html","html_block":689,"text":"Systems revenue increased by 21% to $1,127.1 million for the year ended December 31, 2018, compared with $928.4 million for the year ended December 31, 2017. Higher systems revenue was primarily driven by higher system shipments, partly offset by a higher number of system placements under operating lease arrangements.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sb1d9b40f5355aa1a","report":"2018-FY","filed":"2019-02-04","sha256":"c1588fb328e0804bf8fe43321adba4d41ce84c08a268d2af70bf515aff1777fa","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526719000012/isrg-20181231x10k.htm","path":"sources/raw/Sb1d9b40f5355aa1a.html","html_block":696,"text":"Systems revenue increased by 16% to $928.4 million during the year ended December 31, 2017, compared with $800.0 million during the year ended December 31, 2016. Higher systems revenue was primarily driven by higher system shipments and partly offset by a higher number of system placements under operating lease arrangements and lower da Vinci Surgical System ASP.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sb1d9b40f5355aa1a","report":"2018-FY","filed":"2019-02-04","sha256":"c1588fb328e0804bf8fe43321adba4d41ce84c08a268d2af70bf515aff1777fa","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526719000012/isrg-20181231x10k.htm","path":"sources/raw/Sb1d9b40f5355aa1a.html","html_block":701,"text":"Service revenue increased by 11% to $635.1 million for the year ended December 31, 2018, compared with $572.9 million for the year ended December 31, 2017. Service revenue increased by 12% to $572.9 million for the year ended December 31, 2017, compared with $510.7 million for the year ended December 31, 2016. Higher service revenue in 2018 and 2017 was primarily driven by a larger installed base of da Vinci Surgical Systems producing service revenue.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sb1d9b40f5355aa1a","report":"2018-FY","filed":"2019-02-04","sha256":"c1588fb328e0804bf8fe43321adba4d41ce84c08a268d2af70bf515aff1777fa","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526719000012/isrg-20181231x10k.htm","path":"sources/raw/Sb1d9b40f5355aa1a.html","html_block":712,"text":"Service gross profit for the year ended December 31, 2018, increased to $421.2 million, or 66.3% of service revenue, compared with $393.0 million, or 68.6% of service revenue, for the year ended December 31, 2017. The higher 2018 service gross profit was driven by higher service revenue, reflecting a larger installed base of da Vinci Surgical Systems, partially offset by lower service gross profit margin. The lower service gross profit margin for the year ended December 31, 2018 was driven by higher costs associated with the repair and replacement of da Vinci Xi/X endoscope products.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sb1d9b40f5355aa1a","report":"2018-FY","filed":"2019-02-04","sha256":"c1588fb328e0804bf8fe43321adba4d41ce84c08a268d2af70bf515aff1777fa","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526719000012/isrg-20181231x10k.htm","path":"sources/raw/Sb1d9b40f5355aa1a.html","html_block":713,"text":"Service gross profit for the year ended December 31, 2017, increased to $393.0 million, or 68.6% of service revenue, compared with $359.7 million, or 70.4% of service revenue, for the year ended December 31, 2016. The higher 2017 service gross profit was driven by higher service revenue, reflecting a large installed base of da Vinci Surgical Systems, partially offset by lower service gross profit margin. The lower service gross profit margin for the year ended December 31, 2017, was primarily driven by higher costs associated with the repair of da Vinci Xi endoscope products.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sfb795f4a51c45110","report":"2019-FY","filed":"2020-02-07","sha256":"eb48afbeccd51370102425a896f18704667095385b108e337896fcdc5484513f","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526720000032/isrg-20191231.htm","path":"sources/raw/Sfb795f4a51c45110.html","html_block":130,"text":"We believe that there are numerous additional applications that can be addressed with the da
