Vinci Surgical System, and we work closely with our surgeon customers to refine and explore new techniques in which a da Vinci Surgical System may bring value. As of December 31, 2019, we had an installed base of 5,582 da Vinci Surgical Systems, including 3,531 in the U.S., 977 in Europe, 780 in Asia, and 294 in the rest of the world. We estimate that surgeons using our technology completed approximately 1,229,000 surgical procedures of various types in hospitals throughout the world during the year ended December 31, 2019.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sfb795f4a51c45110","report":"2019-FY","filed":"2020-02-07","sha256":"eb48afbeccd51370102425a896f18704667095385b108e337896fcdc5484513f","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526720000032/isrg-20191231.htm","path":"sources/raw/Sfb795f4a51c45110.html","html_block":131,"text":"Additionally, we believe that there are numerous additional applications that can be addressed with the Ion endoluminal system. As of December 31, 2019, we had an installed base of 10 Ion endoluminal systems, all of which are located in the U.S.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sfb795f4a51c45110","report":"2019-FY","filed":"2020-02-07","sha256":"eb48afbeccd51370102425a896f18704667095385b108e337896fcdc5484513f","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526720000032/isrg-20191231.htm","path":"sources/raw/Sfb795f4a51c45110.html","html_block":143,"text":"We have a network of field service engineers across the U.S., Europe, and Asia and maintain relationships with various distributors around the globe. This infrastructure of service and support specialists offers a full complement of services for our customers, including 24/7 support, installation, repair, and maintenance. We generate service revenue by providing these services to our customers through comprehensive service contracts and time and material programs.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sfb795f4a51c45110","report":"2019-FY","filed":"2020-02-07","sha256":"eb48afbeccd51370102425a896f18704667095385b108e337896fcdc5484513f","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526720000032/isrg-20191231.htm","path":"sources/raw/Sfb795f4a51c45110.html","html_block":614,"text":"During the first quarter of 2019, the FDA cleared our Ion endoluminal system to enable minimally invasive biopsies in the lung. Our Ion system extends our commercial offering beyond surgery into diagnostic procedures with this first application. We are introducing the Ion system in the U.S. in a measured fashion while we optimize training pathways and our supply chain and collect additional clinical data. We are early in the launch and have placed 10 Ion systems for commercial use through December 31, 2019, which are not included in our da Vinci Surgical System installed base. We have also placed 6 Ion systems with hospitals for gathering clinical data.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sfb795f4a51c45110","report":"2019-FY","filed":"2020-02-07","sha256":"eb48afbeccd51370102425a896f18704667095385b108e337896fcdc5484513f","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526720000032/isrg-20191231.htm","path":"sources/raw/Sfb795f4a51c45110.html","html_block":626,"text":"Service revenue growth has been driven by the growth of the base of installed da Vinci Surgical Systems. The installed base of da Vinci Surgical Systems grew 12% to approximately 5,582 at December 31, 2019; 13% to approximately 4,986 at December 31, 2018; and 13% to approximately 4,409 at December 31, 2017. Service revenue increased to $724 million in 2019, compared with $635 million in 2018 and $573 million in 2017.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sfb795f4a51c45110","report":"2019-FY","filed":"2020-02-07","sha256":"eb48afbeccd51370102425a896f18704667095385b108e337896fcdc5484513f","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526720000032/isrg-20191231.htm","path":"sources/raw/Sfb795f4a51c45110.html","html_block":662,"text":"•In May 2018, we obtained FDA clearance for the da Vinci SP Surgical System for urologic surgical procedures that are appropriate for a single port approach. In March 2019, we obtained FDA clearance for the da Vinci SP Surgical System for certain transoral procedures. We also received regulatory clearance for the da Vinci SP Surgical System in South Korea in May 2018. We continue to introduce the da Vinci SP Surgical System in a measured fashion while we optimize training pathways and our supply chain. We have placed 29 da Vinci SP Surgical Systems in 2019 and have an installed base of 44 as of December 31, 2019.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sfb795f4a51c45110","report":"2019-FY","filed":"2020-02-07","sha256":"eb48afbeccd51370102425a896f18704667095385b108e337896fcdc5484513f","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526720000032/isrg-20191231.htm","path":"sources/raw/Sfb795f4a51c45110.html","html_block":682,"text":"In 2019, approximately 1,229,000 surgical procedures were performed with da Vinci Surgical Systems, compared with approximately 1,038,000 and 877,000 surgical procedures performed with da Vinci Surgical Systems in 2018 and 2017, respectively. The growth in our overall procedure volume in 2019 was driven by growth in U.S. general surgery procedures and worldwide urology procedures.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sfb795f4a51c45110","report":"2019-FY","filed":"2020-02-07","sha256":"eb48afbeccd51370102425a896f18704667095385b108e337896fcdc5484513f","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526720000032/isrg-20191231.htm","path":"sources/raw/Sfb795f4a51c45110.html","html_block":721,"text":"Surgical System in a measured fashion while we optimize training pathways and our supply chain. We have placed 29 da Vinci SP Surgical Systems in 2019 and have an installed base of 44 as of December 31, 2019.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sfb795f4a51c45110","report":"2019-FY","filed":"2020-02-07","sha256":"eb48afbeccd51370102425a896f18704667095385b108e337896fcdc5484513f","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526720000032/isrg-20191231.htm","path":"sources/raw/Sfb795f4a51c45110.html","html_block":736,"text":"•As of December 31, 2019, we had a da Vinci Surgical System installed base of approximately 5,582 systems, an increase of 12% compared with the installed base of approximately 4,986 systems as of December 31, 2018.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sfb795f4a51c45110","report":"2019-FY","filed":"2020-02-07","sha256":"eb48afbeccd51370102425a896f18704667095385b108e337896fcdc5484513f","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526720000032/isrg-20191231.htm","path":"sources/raw/Sfb795f4a51c45110.html","html_block":771,"text":"Service revenue increased by 14% to $724 million for the year ended December 31, 2019, compared with $635 million for the year ended December 31, 2018. Service revenue increased by 11% to $635 million for the year ended December 31, 2018, compared with $573 million for the year ended December 31, 2017. Higher service revenue in 2019 was primarily driven by a larger installed base of da Vinci Surgical Systems producing service revenue.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sfb795f4a51c45110","report":"2019-FY","filed":"2020-02-07","sha256":"eb48afbeccd51370102425a896f18704667095385b108e337896fcdc5484513f","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526720000032/isrg-20191231.htm","path":"sources/raw/Sfb795f4a51c45110.html","html_block":777,"text":"Service gross profit for the year ended December 31, 2019, increased 13% to $475 million, representing 65.6% of service revenue, compared with $421 million, representing 66.3% of service revenue, for the year ended December 31, 2018. The higher 2019 service gross profit was driven by higher service revenue, reflecting a larger installed base of da Vinci Surgical Systems, partially offset by lower service gross profit margin. The lower service gross profit margin for the year ended December 31, 2019, was primarily driven by higher share-based compensation expense and intangible assets amortization.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sa49ea83ea3ce7ef2","report":"2020-FY","filed":"2021-02-10","sha256":"7e479ab73172dfe398a60e2f000fd7946b0026ad34825ef578f4448d73556a5f","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526721000028/isrg-20201231.htm","path":"sources/raw/Sa49ea83ea3ce7ef2.html","html_block":141,"text":"We believe that there are numerous additional applications that can be addressed with the da Vinci Surgical System, and we work closely with our surgeon customers to refine and explore new techniques in which a da Vinci Surgical System may bring value. As of December 31, 2020, we had an installed base of 5,989 da Vinci Surgical Systems, including 3,720 in the U.S., 1,059 in Europe, 894 in Asia, and 316 in the rest of the world. We estimate that surgeons using our technology completed approximately 1,243,000 surgical procedures of various types in hospitals throughout the world during the year ended December 31, 2020.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sa49ea83ea3ce7ef2","report":"2020-FY","filed":"2021-02-10","sha256":"7e479ab73172dfe398a60e2f000fd7946b0026ad34825ef578f4448d73556a5f","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526721000028/isrg-20201231.htm","path":"sources/raw/Sa49ea83ea3ce7ef2.html","html_block":142,"text":"Additionally, we believe that there are numerous additional applications that can be addressed with the Ion endoluminal system. As of December 31, 2020, we had an installed base of 36 Ion endoluminal systems, all of which are located in the U.S.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sa49ea83ea3ce7ef2","report":"2020-FY","filed":"2021-02-10","sha256":"7e479ab73172dfe398a60e2f000fd7946b0026ad34825ef578f4448d73556a5f","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526721000028/isrg-20201231.htm","path":"sources/raw/Sa49ea83ea3ce7ef2.html","html_block":154,"text":"We have a network of field service engineers across the U.S., Europe, and Asia and maintain relationships with various distributors around the globe. This infrastructure of service and support specialists offers a full complement of services for our customers, including 24/7 support, installation, repair, and maintenance. We generate service revenue by providing these services to our customers through comprehensive service contracts and time and material programs.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sa49ea83ea3ce7ef2","report":"2020-FY","filed":"2021-02-10","sha256":"7e479ab73172dfe398a60e2f000fd7946b0026ad34825ef578f4448d73556a5f","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526721000028/isrg-20201231.htm","path":"sources/raw/Sa49ea83ea3ce7ef2.html","html_block":352,"text":"Outbreaks of other epidemic, pandemic, or contagious diseases, such as, historically, the Ebola virus, Middle East Respiratory Syndrome, Severe Acute Respiratory Syndrome, or the H1N1 virus, could also divert medical resources and priorities towards the treatment of that disease. An outbreak of other contagious diseases could negatively affect hospital admission rates or disrupt our business similar to the impact of the COVID-19 pandemic highlighted above. Any of these outbreaks could negatively impact the number of da Vinci procedures performed and have a material adverse effect on our business, financial condition, results of operations, or cash flows.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sa49ea83ea3ce7ef2","report":"2020-FY","filed":"2021-02-10","sha256":"7e479ab73172dfe398a60e2f000fd7946b0026ad34825ef578f4448d73556a5f","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526721000028/isrg-20201231.htm","path":"sources/raw/Sa49ea83ea3ce7ef2.html","html_block":727,"text":"During the first quarter of 2019, the FDA cleared our Ion endoluminal system to enable minimally invasive biopsies in the lung. Our Ion system extends our commercial offering beyond surgery into diagnostic procedures with this first application. We are introducing the Ion system in the U.S. in a measured fashion while we optimize training pathways and our supply chain and collect additional clinical data. We are early in the launch and have placed 36 Ion systems for commercial use as of December 31, 2020. Ion systems are not included in our da Vinci Surgical System installed base. We currently have 3 Ion systems placed with hospitals for gathering clinical data in addition to the systems placed for commercial use.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sa49ea83ea3ce7ef2","report":"2020-FY","filed":"2021-02-10","sha256":"7e479ab73172dfe398a60e2f000fd7946b0026ad34825ef578f4448d73556a5f","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526721000028/isrg-20201231.htm","path":"sources/raw/Sa49ea83ea3ce7ef2.html","html_block":761,"text":"Service revenue was $724 million in 2020, compared to $724 million in 2019 and $635 million in 2018. Service revenue remained unchanged, driven by the growth of the base of installed da Vinci Surgical Systems, offset by the effects of the Customer Relief Program. The installed base of da Vinci Surgical Systems grew 7% to approximately 5,989 at December 31, 2020; 12% to approximately 5,582 at December 31, 2019; and 13% to approximately 4,986 at December 31, 2018.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sa49ea83ea3ce7ef2","report":"2020-FY","filed":"2021-02-10","sha256":"7e479ab73172dfe398a60e2f000fd7946b0026ad34825ef578f4448d73556a5f","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526721000028/isrg-20201231.htm","path":"sources/raw/Sa49ea83ea3ce7ef2.html","html_block":802,"text":"•In May 2018, we obtained FDA clearance for the da Vinci SP Surgical System for urologic surgical procedures that are appropriate for a single port approach. In March 2019, we obtained FDA clearance for the da Vinci SP Surgical System for certain transoral procedures. We also received regulatory clearance for the da Vinci SP Surgical System in South Korea in May 2018. We continue to introduce the da Vinci SP Surgical System in a measured fashion while we optimize training pathways and our supply chain. We have an installed base of 69 da Vinci SP Surgical Systems as of December 31, 2020.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sa49ea83ea3ce7ef2","report":"2020-FY","filed":"2021-02-10","sha256":"7e479ab73172dfe398a60e2f000fd7946b0026ad34825ef578f4448d73556a5f","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526721000028/isrg-20201231.htm","path":"sources/raw/Sa49ea83ea3ce7ef2.html","html_block":823,"text":"In 2020, approximately 1,243,000 surgical procedures were performed with da Vinci Surgical Systems, compared to approximately 1,229,000 and 1,038,000 surgical procedures performed with da Vinci Surgical Systems in 2019 and 2018, respectively. The reduced growth in our overall procedure volume in 2020 reflects significant disruption caused by the COVID-19 pandemic, as noted in the COVID-19 Pandemic section above, and was driven by growth in U.S. general surgery procedures and worldwide urology procedures.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sa49ea83ea3ce7ef2","report":"2020-FY","filed":"2021-02-10","sha256":"7e479ab73172dfe398a60e2f000fd7946b0026ad34825ef578f4448d73556a5f","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526721000028/isrg-20201231.htm","path":"sources/raw/Sa49ea83ea3ce7ef2.html","html_block":884,"text":"•As of December 31, 2020, we had a da Vinci Surgical System installed base of approximately 5,989 systems, an increase of 7% compared to the installed base of approximately 5,582 systems as of December 31, 2019.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sa49ea83ea3ce7ef2","report":"2020-FY","filed":"2021-02-10","sha256":"7e479ab73172dfe398a60e2f000fd7946b0026ad34825ef578f4448d73556a5f","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526721000028/isrg-20201231.htm","path":"sources/raw/Sa49ea83ea3ce7ef2.html","html_block":905,"text":"As the COVID-19 pandemic is expected to continue to cause strain on hospital resources, as outlined in the COVID-19 Pandemic section above, including recommended deferrals of elective procedures by various authorities and policy makers, we cannot reliably estimate the extent procedures and system placements will be impacted in the first quarter of 2021 and beyond.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sa49ea83ea3ce7ef2","report":"2020-FY","filed":"2021-02-10","sha256":"7e479ab73172dfe398a60e2f000fd7946b0026ad34825ef578f4448d73556a5f","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526721000028/isrg-20201231.htm","path":"sources/raw/Sa49ea83ea3ce7ef2.html","html_block":921,"text":"Service revenue remained unchanged at $724 million for the year ended December 31, 2020, compared to $724 million for the year ended December 31, 2019. Service revenue for the year ended December 31, 2019, increased by 14% compared to $635 million for the year ended December 31, 2018. Service revenue in 2020 was primarily driven by a larger installed base of da Vinci Surgical Systems producing service revenue, offset by an $80 million decrease as a result of the service fee credits provided to customers as part of our Customer Relief Program.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sa49ea83ea3ce7ef2","report":"2020-FY","filed":"2021-02-10","sha256":"7e479ab73172dfe398a60e2f000fd7946b0026ad34825ef578f4448d73556a5f","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526721000028/isrg-20201231.htm","path":"sources/raw/Sa49ea83ea3ce7ef2.html","html_block":1244,"text":"The Company enters into lease arrangements with certain qualified customers. Leases have terms that generally range from 24 to 84 months and are usually collateralized by a security interest in the underlying assets. The Company also leases systems to certain qualified customers under usage-based arrangements that have terms up to 84 months. For these usage-based lease arrangements, the lease fee is generally billed monthly in arrears based on a predetermined per-use fee, and usage is generally defined as the number of da Vinci procedures performed with the system.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S78f74b10f3f686c7","report":"2021-FY","filed":"2022-02-03","sha256":"e572d9bbc4dc035d7ffd9b140026f89cd4fdae5314208bcf2bb3102867ca235e","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526722000014/isrg-20211231.htm","path":"sources/raw/S78f74b10f3f686c7.html","html_block":203,"text":"There are approximately 70 representative clinical uses for da Vinci Surgical Systems. We believe that there are numerous additional applications that can be addressed with the da Vinci Surgical System, and we work closely with our surgeon customers to refine and explore new techniques in which a da Vinci Surgical System may bring value. As of December 31, 2021, we had an installed base of 6,730 da Vinci Surgical Systems, including 4,139 in the U.S., 1,199 in Europe, 1,050 in Asia, and 342 in the rest of the world. We estimate that surgeons using our technology completed approximately 1,594,000 surgical procedures of various types in hospitals throughout the world during the year ended December 31, 2021.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S78f74b10f3f686c7","report":"2021-FY","filed":"2022-02-03","sha256":"e572d9bbc4dc035d7ffd9b140026f89cd4fdae5314208bcf2bb3102867ca235e","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526722000014/isrg-20211231.htm","path":"sources/raw/S78f74b10f3f686c7.html","html_block":204,"text":"Additionally, over time, we believe that there are numerous additional applications that can be addressed with the Ion endoluminal system. As of December 31, 2021, we had an installed base of 129 Ion endoluminal systems, 128 of which are located in the U.S. We plan to seek additional clearances for Ion in markets outside of the U.S. (“OUS”) over time.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S78f74b10f3f686c7","report":"2021-FY","filed":"2022-02-03","sha256":"e572d9bbc4dc035d7ffd9b140026f89cd4fdae5314208bcf2bb3102867ca235e","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526722000014/isrg-20211231.htm","path":"sources/raw/S78f74b10f3f686c7.html","html_block":216,"text":"We have a network of field service engineers across the U.S., Europe, and Asia and maintain relationships with various distributors around the globe. This infrastructure of service and support specialists offers a full complement of services for our customers, including 24/7 support, installation, repair, and maintenance. We generate service revenue by providing these services to our customers through comprehensive service contracts and time and material programs.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S78f74b10f3f686c7","report":"2021-FY","filed":"2022-02-03","sha256":"e572d9bbc4dc035d7ffd9b140026f89cd4fdae5314208bcf2bb3102867ca235e","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526722000014/isrg-20211231.htm","path":"sources/raw/S78f74b10f3f686c7.html","html_block":773,"text":"Our rollout of the Ion system is progressing well, and we are continuing to gather additional clinical evidence. We have placed 129 Ion systems as of December 31, 2021. Ion systems are not included in our da Vinci Surgical System installed base. We plan to seek additional clearances for Ion in OUS markets over time.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S78f74b10f3f686c7","report":"2021-FY","filed":"2022-02-03","sha256":"e572d9bbc4dc035d7ffd9b140026f89cd4fdae5314208bcf2bb3102867ca235e","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526722000014/isrg-20211231.htm","path":"sources/raw/S78f74b10f3f686c7.html","html_block":781,"text":"In the first quarter of 2021, in the U.S., the COVID-19 resurgence that affected procedures later in the fourth quarter of 2020 continued well into January 2021. Then, as COVID-19 cases subsided, procedures experienced a steady improvement throughout February and March. In Europe, the spread of COVID-19 varied regionally, and procedure growth rates were mixed. While there were COVID-19 hot spots within some of our Asia Pacific markets, they tended to be isolated and, in general, procedures performed well.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S78f74b10f3f686c7","report":"2021-FY","filed":"2022-02-03","sha256":"e572d9bbc4dc035d7ffd9b140026f89cd4fdae5314208bcf2bb3102867ca235e","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526722000014/isrg-20211231.htm","path":"sources/raw/S78f74b10f3f686c7.html","html_block":782,"text":"In the second quarter of 2021, as the U.S. continued its broad rollout of vaccinations, COVID-19 cases and hospitalizations decreased, and procedure volumes recovered, partially attributed to the performance of a number of procedures that were deferred during the pandemic. In Europe, the rollout of vaccinations and spread of COVID-19 varied regionally, and procedure growth rates were mixed. We continued to see the impacts of regional resurgences of COVID-19 cases within the Asia Pacific markets. China growth continued to be strong year over year, primarily reflecting the growth in the system installed base.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S78f74b10f3f686c7","report":"2021-FY","filed":"2022-02-03","sha256":"e572d9bbc4dc035d7ffd9b140026f89cd4fdae5314208bcf2bb3102867ca235e","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526722000014/isrg-20211231.htm","path":"sources/raw/S78f74b10f3f686c7.html","html_block":817,"text":"Service revenue was $916 million in 2021, compared to $724 million in 2020 and 2019. The increase in service revenue was primarily driven by the growth of the base of installed da Vinci Surgical Systems producing service revenue, as well as the effects of the Customer Relief Program in the prior year, which resulted in an $80 million decrease in service revenue in 2020. The installed base of da Vinci Surgical Systems grew 12% to approximately 6,730 as of December 31, 2021; 7% to approximately 5,989 as of December 31, 2020; and 12% to approximately 5,582 as of December 31, 2019.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S78f74b10f3f686c7","report":"2021-FY","filed":"2022-02-03","sha256":"e572d9bbc4dc035d7ffd9b140026f89cd4fdae5314208bcf2bb3102867ca235e","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526722000014/isrg-20211231.htm","path":"sources/raw/S78f74b10f3f686c7.html","html_block":872,"text":"In 2021, approximately 1,594,000 surgical procedures were performed with da Vinci Surgical Systems, compared to approximately 1,243,000 and 1,229,000 surgical procedures performed with da Vinci Surgical Systems in 2020 and 2019, respectively. The increase in our overall procedure volume in 2021 reflects the significant disruption caused by the COVID-19 pandemic in 2020, as noted in the COVID-19 Pandemic section above, and was driven by growth in U.S. general surgery and gynecology procedures and worldwide urology procedures.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S78f74b10f3f686c7","report":"2021-FY","filed":"2022-02-03","sha256":"e572d9bbc4dc035d7ffd9b140026f89cd4fdae5314208bcf2bb3102867ca235e","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526722000014/isrg-20211231.htm","path":"sources/raw/S78f74b10f3f686c7.html","html_block":898,"text":"OUS Procedures. The 2021 OUS procedure growth rate reflects continued da Vinci adoption in European and Asian markets, although it also reflects disruption caused by the COVID-19 pandemic, as noted in the COVID-19 Pandemic section above. We saw strong procedure growth in China, Japan, South Korea, Germany, Brazil, France, and the UK during 2021. In China, procedure growth accelerated as a result of new system placements during the year as well as very high system utilization.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S78f74b10f3f686c7","report":"2021-FY","filed":"2022-02-03","sha256":"e572d9bbc4dc035d7ffd9b140026f89cd4fdae5314208bcf2bb3102867ca235e","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526722000014/isrg-20211231.htm","path":"sources/raw/S78f74b10f3f686c7.html","html_block":932,"text":"•As of December 31, 2021, we had a da Vinci Surgical System installed base of approximately 6,730 systems, an increase of 12% compared to the installed base of approximately 5,989 systems as of December 31, 2020.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S78f74b10f3f686c7","report":"2021-FY","filed":"2022-02-03","sha256":"e572d9bbc4dc035d7ffd9b140026f89cd4fdae5314208bcf2bb3102867ca235e","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526722000014/isrg-20211231.htm","path":"sources/raw/S78f74b10f3f686c7.html","html_block":963,"text":"Systems revenue increased by 44% to $1.69 billion for the year ended December 31, 2021, compared to $1.18 billion for the year ended December 31, 2020. The higher 2021 systems revenue was primarily driven by higher system placements, higher operating lease revenue, higher lease buyouts, and higher 2021 ASPs, partially offset by a higher proportion of system placements under operating leases.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S78f74b10f3f686c7","report":"2021-FY","filed":"2022-02-03","sha256":"e572d9bbc4dc035d7ffd9b140026f89cd4fdae5314208bcf2bb3102867ca235e","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526722000014/isrg-20211231.htm","path":"sources/raw/S78f74b10f3f686c7.html","html_block":969,"text":"Service revenue increased by 27% to $916 million for the year ended December 31, 2021, compared to $724 million for the year ended December 31, 2020. Service revenue for the year ended December 31, 2020, remained unchanged at $724 million for the year ended December 31, 2019. Higher service revenue in 2021 was primarily driven by a larger installed base of da Vinci Surgical Systems producing service revenue, as well as the effects of the Customer Relief Program in the prior year, which resulted in an $80 million decrease in service revenue in 2020 as a result of service fee credits provided to customers.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S78f74b10f3f686c7","report":"2021-FY","filed":"2022-02-03","sha256":"e572d9bbc4dc035d7ffd9b140026f89cd4fdae5314208bcf2bb3102867ca235e","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526722000014/isrg-20211231.htm","path":"sources/raw/S78f74b10f3f686c7.html","html_block":976,"text":"Service gross profit for the year ended December 31, 2021, increased by 38% to $629 million, representing 68.6% of service revenue, compared to $457 million, representing 63.1% of service revenue, for the year ended December 31, 2020. The higher 2021 service gross profit was driven by higher service revenue, reflecting a larger installed base of da Vinci Surgical Systems, and higher service gross profit margin. The lower service gross profit margin for the year ended December 31, 2020, was primarily driven by the $80 million decrease in service revenue as a result of the Customer Relief Program.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S78f74b10f3f686c7","report":"2021-FY","filed":"2022-02-03","sha256":"e572d9bbc4dc035d7ffd9b140026f89cd4fdae5314208bcf2bb3102867ca235e","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526722000014/isrg-20211231.htm","path":"sources/raw/S78f74b10f3f686c7.html","html_block":1297,"text":"The Company enters into lease arrangements with certain qualified customers. Leases have terms that generally range from 24 to 84 months and are usually collateralized by a security interest in the underlying assets. The Company also leases systems to certain qualified customers under usage-based arrangements that have terms up to 84 months. For these usage-based lease arrangements, the lease fee is generally billed monthly in arrears based on a contractual per-use fee, and usage is generally defined as the number of procedures performed with the system.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S665e685caf9f272d","report":"2022-FY","filed":"2023-02-10","sha256":"f8a005fc1f29d360453e633f2c3248bffd50cf3f58cf327f0d9e09abf67380ab","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526723000019/isrg-20221231.htm","path":"sources/raw/S665e685caf9f272d.html","html_block":204,"text":"There are over 70 representative clinical uses for da Vinci Surgical Systems. We believe that there are numerous additional applications that can be addressed with the da Vinci Surgical System, and we work closely with our surgeon customers to refine and explore new techniques in which a da Vinci Surgical System may bring value. As of December 31, 2022, we had an installed base of 7,544 da Vinci Surgical Systems, including 4,563 in the U.S., 1,388 in Europe, 1,234 in Asia, and 359 in the rest of the world. We estimate that surgeons using our technology completed approximately 1,875,000 surgical procedures of various types in hospitals throughout the world during the year ended December 31, 2022.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S665e685caf9f272d","report":"2022-FY","filed":"2023-02-10","sha256":"f8a005fc1f29d360453e633f2c3248bffd50cf3f58cf327f0d9e09abf67380ab","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526723000019/isrg-20221231.htm","path":"sources/raw/S665e685caf9f272d.html","html_block":205,"text":"Additionally, over time, we believe that there are numerous additional applications that can be addressed with the Ion endoluminal system. As of December 31, 2022, we had an installed base of 321 Ion systems, 320 of which are located in the U.S. We plan to seek additional clearances for Ion in markets outside of the U.S. (“OUS”) over time.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S665e685caf9f272d","report":"2022-FY","filed":"2023-02-10","sha256":"f8a005fc1f29d360453e633f2c3248bffd50cf3f58cf327f0d9e09abf67380ab","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526723000019/isrg-20221231.htm","path":"sources/raw/S665e685caf9f272d.html","html_block":217,"text":"We have a network of field service and technical support engineers across the U.S., Europe, and Asia and maintain relationships with various distributors around the globe. This infrastructure of service and support specialists, along with advanced service tools and solutions, offers a full complement of services for our customers, including installation, repair, maintenance, 24/7 technical support, and proactive system health monitoring. We generate service revenue by providing these services to our customers through comprehensive service contracts and time and material programs.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S665e685caf9f272d","report":"2022-FY","filed":"2023-02-10","sha256":"f8a005fc1f29d360453e633f2c3248bffd50cf3f58cf327f0d9e09abf67380ab","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526723000019/isrg-20221231.htm","path":"sources/raw/S665e685caf9f272d.html","html_block":391,"text":"In addition, in early 2023, the U.S. Government reached its existing statutory limit on the amount of permissible federal debt, and this limit must be raised in order for the U.S. Government to continue to pay its obligations on a timely basis. If the debt ceiling is not raised, it is unclear how the U.S. Government would prioritize its payments towards its various programs, which could have a significant impact on the overall economy as well as on medical procedures performed.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S665e685caf9f272d","report":"2022-FY","filed":"2023-02-10","sha256":"f8a005fc1f29d360453e633f2c3248bffd50cf3f58cf327f0d9e09abf67380ab","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526723000019/isrg-20221231.htm","path":"sources/raw/S665e685caf9f272d.html","html_block":405,"text":"Outbreaks of other epidemic, pandemic, or contagious diseases, such as, historically, the Ebola virus, Middle East Respiratory Syndrome, Severe Acute Respiratory Syndrome, or the H1N1 virus, could also divert medical resources and priorities towards the treatment of that disease. An outbreak of other contagious diseases could negatively affect hospital admission rates or disrupt our business similar to the impact of the COVID-19 pandemic highlighted above. Any of these outbreaks could negatively impact the number of procedures performed and have a material adverse effect on our business, financial condition, or results of operations.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S665e685caf9f272d","report":"2022-FY","filed":"2023-02-10","sha256":"f8a005fc1f29d360453e633f2c3248bffd50cf3f58cf327f0d9e09abf67380ab","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526723000019/isrg-20221231.htm","path":"sources/raw/S665e685caf9f272d.html","html_block":851,"text":"Service revenue was $1.02 billion in 2022, compared to $0.92 billion in 2021 and $0.72 billion in 2020. The increase in service revenue was primarily driven by the growth of the base of installed da Vinci Surgical Systems producing service revenue, as well as the effects of the Customer Relief Program in 2020, which resulted in an $80 million decrease in service revenue. The installed base of da Vinci Surgical Systems grew 12% to approximately 7,544 as of December 31, 2022; 12% to approximately 6,730 as of December 31, 2021; and 7% to approximately 5,989 as of December 31, 2020.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S665e685caf9f272d","report":"2022-FY","filed":"2023-02-10","sha256":"f8a005fc1f29d360453e633f2c3248bffd50cf3f58cf327f0d9e09abf67380ab","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526723000019/isrg-20221231.htm","path":"sources/raw/S665e685caf9f272d.html","html_block":913,"text":"In 2022, approximately 1,875,000 surgical procedures were performed with da Vinci Surgical Systems, compared to approximately 1,594,000 and 1,243,000 surgical procedures performed with da Vinci Surgical Systems in 2021 and 2020, respectively. The increase in our overall procedure volume in 2022 reflects the disruption caused by the COVID-19 pandemic in 2022 and 2021, as noted in the COVID-19 Pandemic section above, and was driven by growth in U.S. general surgery, OUS urology, and OUS general surgery (particularly cancer) procedures.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S665e685caf9f272d","report":"2022-FY","filed":"2023-02-10","sha256":"f8a005fc1f29d360453e633f2c3248bffd50cf3f58cf327f0d9e09abf67380ab","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526723000019/isrg-20221231.htm","path":"sources/raw/S665e685caf9f272d.html","html_block":914,"text":"In 2022, approximately 23,500 biopsy procedures were performed with Ion systems, compared to approximately 7,400 and 1,700 biopsy procedures performed with Ion systems in 2021 and 2020, respectively. The increase in our overall procedure volume in 2022 reflects a larger installed base of approximately 321 systems, an increase of 149% compared to the installed base of approximately 129 systems as of 2021. Currently, the vast majority of Ion biopsy procedures are performed in the U.S.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S665e685caf9f272d","report":"2022-FY","filed":"2023-02-10","sha256":"f8a005fc1f29d360453e633f2c3248bffd50cf3f58cf327f0d9e09abf67380ab","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526723000019/isrg-20221231.htm","path":"sources/raw/S665e685caf9f272d.html","html_block":967,"text":"•As of December 31, 2022, we had a da Vinci Surgical System installed base of approximately 7,544 systems, an increase of 12% compared to the installed base of approximately 6,730 systems as of December 31, 2021.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S665e685caf9f272d","report":"2022-FY","filed":"2023-02-10","sha256":"f8a005fc1f29d360453e633f2c3248bffd50cf3f58cf327f0d9e09abf67380ab","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526723000019/isrg-20221231.htm","path":"sources/raw/S665e685caf9f272d.html","html_block":970,"text":"•As of December 31, 2022, we had an Ion system installed base of approximately 321 systems, an increase of 149% compared to the installed base of approximately 129 systems as of December 31, 2021.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S665e685caf9f272d","report":"2022-FY","filed":"2023-02-10","sha256":"f8a005fc1f29d360453e633f2c3248bffd50cf3f58cf327f0d9e09abf67380ab","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526723000019/isrg-20221231.htm","path":"sources/raw/S665e685caf9f272d.html","html_block":996,"text":"Systems revenue decreased by 1% to $1.68 billion for the year ended December 31, 2022, compared to $1.69 billion for the year ended December 31, 2021. The decrease in systems revenue was primarily driven by lower sales-type lease revenue, fewer da Vinci system placements, lower 2022 da Vinci ASPs, lower lease buyout revenue, and a higher proportion of da Vinci system placements under operating leases, partially offset by higher operating lease revenue and more Ion system placements.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S665e685caf9f272d","report":"2022-FY","filed":"2023-02-10","sha256":"f8a005fc1f29d360453e633f2c3248bffd50cf3f58cf327f0d9e09abf67380ab","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526723000019/isrg-20221231.htm","path":"sources/raw/S665e685caf9f272d.html","html_block":1010,"text":"Service gross profit for the year ended December 31, 2022, increased by 11% to $0.70 billion, representing 68.2% of service revenue, compared to $0.63 billion, representing 68.6% of service revenue, for the year ended December 31, 2021. The higher service gross profit for the year ended December 31, 2022, was primarily driven by higher service revenue, reflecting a larger installed base of da Vinci Surgical Systems, partially offset by a lower service gross profit margin. The lower service gross profit margin for the year ended December 31, 2022, was primarily driven by higher freight and overhead costs, as well as unfavorable foreign currency impacts, partially offset by lower materials costs for repairs.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S665e685caf9f272d","report":"2022-FY","filed":"2023-02-10","sha256":"f8a005fc1f29d360453e633f2c3248bffd50cf3f58cf327f0d9e09abf67380ab","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526723000019/isrg-20221231.htm","path":"sources/raw/S665e685caf9f272d.html","html_block":1318,"text":"The Company enters into lease arrangements with certain qualified customers. Leases have terms that generally range from 24 to 84 months and are usually collateralized by a security interest in the underlying assets. The Company also leases systems to certain qualified customers under usage-based arrangements that have terms of up to 84 months. For these usage-based lease arrangements, the lease fee is generally billed monthly in arrears based on a contractual per-use fee, and usage is generally defined as the number of procedures performed with the system.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sac687c07d0508ae9","report":"2024-Q1","filed":"2024-04-19","sha256":"09f13e4284d98891f983946ee87e58371915d70a1f7b7ada73743d3aa68f6b66","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000137/isrg-20240331.htm","path":"sources/raw/Sac687c07d0508ae9.html","html_block":294,"text":"We are in the early stages of launching our da Vinci SP surgical system, and we have an installed base of 201 da Vinci SP surgical systems as of March 31, 2024. We have received FDA clearance for the da Vinci SP surgical system for urologic and certain transoral procedures. We have received regulatory clearance in South Korea, where the da Vinci SP surgical system may be used for a broad set of procedures, and in Japan, where the da Vinci SP surgical system may be used for the same set of","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sac687c07d0508ae9","report":"2024-Q1","filed":"2024-04-19","sha256":"09f13e4284d98891f983946ee87e58371915d70a1f7b7ada73743d3aa68f6b66","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000137/isrg-20240331.htm","path":"sources/raw/Sac687c07d0508ae9.html","html_block":298,"text":"In March 2024, we obtained FDA clearance for da Vinci 5, the company’s next-generation multi-port robotic system, for use in all surgical specialties and procedures indicated for da Vinci Xi, except for cardiac and pediatric indications. We are in the early stages of launching our da Vinci 5 surgical system, and we have an installed base of 8 da Vinci 5 surgical systems as of March 31, 2024. We plan a phased launch over several quarters, giving us time to mature our supply and manufacturing processes for the new system. Additionally, we are in the regulatory process in Japan and South Korea for da Vinci 5.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sac687c07d0508ae9","report":"2024-Q1","filed":"2024-04-19","sha256":"09f13e4284d98891f983946ee87e58371915d70a1f7b7ada73743d3aa68f6b66","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000137/isrg-20240331.htm","path":"sources/raw/Sac687c07d0508ae9.html","html_block":330,"text":"Service revenue was $1.17 billion in 2023, compared to $1.02 billion in 2022 and $0.92 billion in 2021. The increase in service revenue was primarily driven by the growth of the base of installed da Vinci surgical systems producing service revenue. The installed base of da Vinci surgical systems grew 14% to approximately 8,606 as of December 31, 2023; 12% to approximately 7,544 as of December 31, 2022; and 12% to approximately 6,730 as of December 31, 2021.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sac687c07d0508ae9","report":"2024-Q1","filed":"2024-04-19","sha256":"09f13e4284d98891f983946ee87e58371915d70a1f7b7ada73743d3aa68f6b66","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000137/isrg-20240331.htm","path":"sources/raw/Sac687c07d0508ae9.html","html_block":337,"text":"The following table summarizes our system placements under leasing arrangements for the years ended December 31, 2023, 2022, and 2021:","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sac687c07d0508ae9","report":"2024-Q1","filed":"2024-04-19","sha256":"09f13e4284d98891f983946ee87e58371915d70a1f7b7ada73743d3aa68f6b66","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000137/isrg-20240331.htm","path":"sources/raw/Sac687c07d0508ae9.html","html_block":398,"text":"In 2023, approximately 2,286,000 surgical procedures were performed with da Vinci surgical systems, compared to approximately 1,875,000 and 1,594,000 surgical procedures performed with da Vinci surgical systems in 2022 and 2021, respectively. The increase in our overall procedure volume in 2023 was largely attributable to growth in U.S. general surgery, OUS urologic surgery, OUS general surgery (particularly cancer), and U.S. gynecologic surgery procedures. The overall procedure volumes in the comparative 2022 and 2021 years reflect the disruption caused by the COVID-19 pandemic in 2022 and 2021.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sac687c07d0508ae9","report":"2024-Q1","filed":"2024-04-19","sha256":"09f13e4284d98891f983946ee87e58371915d70a1f7b7ada73743d3aa68f6b66","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000137/isrg-20240331.htm","path":"sources/raw/Sac687c07d0508ae9.html","html_block":405,"text":"In 2023, approximately 53,800 biopsy procedures were performed with Ion systems, compared to approximately 23,500 in 2022 and approximately 7,400 in 2021. The increase in our overall procedure volume in 2023 reflects a larger installed base of approximately 534 systems, an increase of 66% compared to the installed base of approximately 321 systems as of 2022. Currently, the vast majority of Ion biopsy procedures are performed in the U.S.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sac687c07d0508ae9","report":"2024-Q1","filed":"2024-04-19","sha256":"09f13e4284d98891f983946ee87e58371915d70a1f7b7ada73743d3aa68f6b66","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000137/isrg-20240331.htm","path":"sources/raw/Sac687c07d0508ae9.html","html_block":413,"text":"Overall. Total da Vinci procedures performed by our customers grew approximately 16% for the three months ended March 31, 2024, compared to approximately 26% for the three months ended March 31, 2023. We believe that the growth in the comparative first quarter 2023 procedure results for both U.S. and OUS procedures partially reflected a benefit from procedures performed related to the backlog of patient treatments that resulted from COVID-19, as noted in the COVID-19 Pandemic section above. The first quarter 2024 procedure growth was largely attributable to growth in U.S. general surgery, OUS general surgery (particularly cancer), OUS urologic surgery, and U.S. gynecologic surgery.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sac687c07d0508ae9","report":"2024-Q1","filed":"2024-04-19","sha256":"09f13e4284d98891f983946ee87e58371915d70a1f7b7ada73743d3aa68f6b66","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000137/isrg-20240331.htm","path":"sources/raw/Sac687c07d0508ae9.html","html_block":420,"text":"We placed 313 da Vinci surgical systems in the first quarter of 2024, compared to 312 systems in the first quarter of 2023. The increase in system placements reflects an increase in demand for additional capacity by our customers as a result of procedure growth, partially offset by a smaller number of third-generation da Vinci systems available for trade-in.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sac687c07d0508ae9","report":"2024-Q1","filed":"2024-04-19","sha256":"09f13e4284d98891f983946ee87e58371915d70a1f7b7ada73743d3aa68f6b66","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000137/isrg-20240331.htm","path":"sources/raw/Sac687c07d0508ae9.html","html_block":440,"text":"•Systems revenue decreased by 2% to $418 million for the three months ended March 31, 2024, compared to $427 million during the three months ended March 31, 2023, primarily as a function of a higher proportion of da Vinci system placements under operating leases.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sac687c07d0508ae9","report":"2024-Q1","filed":"2024-04-19","sha256":"09f13e4284d98891f983946ee87e58371915d70a1f7b7ada73743d3aa68f6b66","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000137/isrg-20240331.htm","path":"sources/raw/Sac687c07d0508ae9.html","html_block":442,"text":"•As of March 31, 2024, we had a da Vinci surgical system installed base of approximately 8,887 systems, an increase of 14% compared to an installed base of approximately 7,779 systems as of March 31, 2023.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sac687c07d0508ae9","report":"2024-Q1","filed":"2024-04-19","sha256":"09f13e4284d98891f983946ee87e58371915d70a1f7b7ada73743d3aa68f6b66","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000137/isrg-20240331.htm","path":"sources/raw/Sac687c07d0508ae9.html","html_block":445,"text":"•As of March 31, 2024, we had an Ion system installed base of approximately 604 systems, an increase of 61% compared to an installed base of approximately 376 systems as of March 31, 2023.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sac687c07d0508ae9","report":"2024-Q1","filed":"2024-04-19","sha256":"09f13e4284d98891f983946ee87e58371915d70a1f7b7ada73743d3aa68f6b66","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000137/isrg-20240331.htm","path":"sources/raw/Sac687c07d0508ae9.html","html_block":475,"text":"Systems revenue was $418 million for the three months ended March 31, 2024, compared to $427 million for the three months ended March 31, 2023. The lower first quarter 2024 system revenue was primarily driven by a higher proportion of da Vinci system placements under operating leases (partially offset by more systems placements), lower first quarter 2024 ASPs, and lower sales-type lease revenue, partially offset by higher operating lease revenue.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sac687c07d0508ae9","report":"2024-Q1","filed":"2024-04-19","sha256":"09f13e4284d98891f983946ee87e58371915d70a1f7b7ada73743d3aa68f6b66","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000137/isrg-20240331.htm","path":"sources/raw/Sac687c07d0508ae9.html","html_block":477,"text":"The following table summarizes our da Vinci system placements and systems installed at customers under leasing arrangements for three months ended March 31, 2024, and 2023:","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sac687c07d0508ae9","report":"2024-Q1","filed":"2024-04-19","sha256":"09f13e4284d98891f983946ee87e58371915d70a1f7b7ada73743d3aa68f6b66","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000137/isrg-20240331.htm","path":"sources/raw/Sac687c07d0508ae9.html","html_block":482,"text":"During the first quarter of 2024, 70 Ion systems were placed compared to 55 systems during the first quarter of 2023. The increase in system placements was primarily driven by the demand for additional capacity by our customers due to the procedure growth. As of March 31, 2024, we had an Ion system installed base of approximately 604 systems, compared to an installed base of approximately 376 systems as of March 31, 2023.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sac687c07d0508ae9","report":"2024-Q1","filed":"2024-04-19","sha256":"09f13e4284d98891f983946ee87e58371915d70a1f7b7ada73743d3aa68f6b66","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000137/isrg-20240331.htm","path":"sources/raw/Sac687c07d0508ae9.html","html_block":483,"text":"The following table summarizes our Ion system placements and systems installed at customers under leasing arrangements for three months ended March 31, 2024, and 2023:","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sac687c07d0508ae9","report":"2024-Q1","filed":"2024-04-19","sha256":"09f13e4284d98891f983946ee87e58371915d70a1f7b7ada73743d3aa68f6b66","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000137/isrg-20240331.htm","path":"sources/raw/Sac687c07d0508ae9.html","html_block":487,"text":"Service revenue increased by 11% to $314 million for the three months ended March 31, 2024, compared to $283 million for the three months ended March 31, 2023. The increase in service revenue was primarily driven by a larger installed base of systems producing service revenue, partially offset by a lower volume of incremental repairs and a higher proportion of early-stage usage-based operating lease arrangements where procedures are ramping up.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Sac687c07d0508ae9","report":"2024-Q1","filed":"2024-04-19","sha256":"09f13e4284d98891f983946ee87e58371915d70a1f7b7ada73743d3aa68f6b66","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000137/isrg-20240331.htm","path":"sources/raw/Sac687c07d0508ae9.html","html_block":495,"text":"Service gross profit for the three months ended March 31, 2024, increased by 15% to $223 million, representing 71.0% of service revenue, compared to $193 million, representing 68.1% of service revenue, for the three months ended March 31, 2023. The higher service gross profit for the three months ended March 31, 2024, was primarily driven by higher service revenue, reflecting a larger installed base of da Vinci surgical systems, and a higher service gross profit margin. The higher service gross profit margin for the three months ended March 31, 2024, was primarily driven by favorable impacts from leveraging volume of repairs.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S156ed881a09e396a","report":"2024-H1","filed":"2024-07-19","sha256":"28a33f5ffcaab3193920f0c91a8b1d8ceccb01ec243681a91bfd51647bd7c000","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000207/isrg-20240630.htm","path":"sources/raw/S156ed881a09e396a.html","html_block":299,"text":"We are in the early stages of launching our da Vinci SP surgical system, and we have an installed base of 222 da Vinci SP surgical systems as of June 30, 2024. We have received FDA clearance for the da Vinci SP surgical system for urologic, general","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S156ed881a09e396a","report":"2024-H1","filed":"2024-07-19","sha256":"28a33f5ffcaab3193920f0c91a8b1d8ceccb01ec243681a91bfd51647bd7c000","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000207/isrg-20240630.htm","path":"sources/raw/S156ed881a09e396a.html","html_block":303,"text":"In March 2024, we obtained FDA clearance for our da Vinci 5 surgical system, our next-generation multi-port robotic system, for use in all surgical specialties and procedures indicated for da Vinci Xi, except for cardiac and pediatric indications. We are in the early stages of launching da Vinci 5, and we have an installed base of 78 da Vinci 5 surgical systems as of June 30, 2024. We plan a phased launch over several quarters, giving us time to mature our supply and manufacturing processes for the new system. Additionally, we are in the regulatory process in Japan and South Korea for da Vinci 5.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S156ed881a09e396a","report":"2024-H1","filed":"2024-07-19","sha256":"28a33f5ffcaab3193920f0c91a8b1d8ceccb01ec243681a91bfd51647bd7c000","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000207/isrg-20240630.htm","path":"sources/raw/S156ed881a09e396a.html","html_block":331,"text":"Service revenue was $1.17 billion in 2023, compared to $1.02 billion in 2022 and $0.92 billion in 2021. The increase in service revenue was primarily driven by the growth of the base of installed da Vinci surgical systems producing service revenue. The installed base of da Vinci surgical systems grew 14% to approximately 8,606 as of December 31, 2023; 12% to approximately 7,544 as of December 31, 2022; and 12% to approximately 6,730 as of December 31, 2021.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S156ed881a09e396a","report":"2024-H1","filed":"2024-07-19","sha256":"28a33f5ffcaab3193920f0c91a8b1d8ceccb01ec243681a91bfd51647bd7c000","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000207/isrg-20240630.htm","path":"sources/raw/S156ed881a09e396a.html","html_block":337,"text":"The following table summarizes our system placements under leasing arrangements for the years ended December 31, 2023, 2022, and 2021:","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S156ed881a09e396a","report":"2024-H1","filed":"2024-07-19","sha256":"28a33f5ffcaab3193920f0c91a8b1d8ceccb01ec243681a91bfd51647bd7c000","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000207/isrg-20240630.htm","path":"sources/raw/S156ed881a09e396a.html","html_block":395,"text":"In 2023, approximately 2,286,000 surgical procedures were performed with da Vinci surgical systems, compared to approximately 1,875,000 and 1,594,000 surgical procedures performed with da Vinci surgical systems in 2022 and 2021, respectively. The increase in our overall procedure volume in 2023 was largely attributable to growth in U.S. general surgery, OUS urologic surgery, OUS general surgery (particularly cancer), and U.S. gynecologic surgery procedures. The overall","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S156ed881a09e396a","report":"2024-H1","filed":"2024-07-19","sha256":"28a33f5ffcaab3193920f0c91a8b1d8ceccb01ec243681a91bfd51647bd7c000","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000207/isrg-20240630.htm","path":"sources/raw/S156ed881a09e396a.html","html_block":405,"text":"In 2023, approximately 53,800 biopsy procedures were performed with Ion systems, compared to approximately 23,500 in 2022 and approximately 7,400 in 2021. The increase in our overall procedure volume in 2023 reflects a larger installed base of approximately 534 systems, an increase of 66% compared to the installed base of approximately 321 systems as of 2022. Currently, the vast majority of Ion biopsy procedures are performed in the U.S.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S156ed881a09e396a","report":"2024-H1","filed":"2024-07-19","sha256":"28a33f5ffcaab3193920f0c91a8b1d8ceccb01ec243681a91bfd51647bd7c000","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000207/isrg-20240630.htm","path":"sources/raw/S156ed881a09e396a.html","html_block":420,"text":"We placed 341 da Vinci surgical systems in the second quarter of 2024, compared to 331 systems in the second quarter of 2023. The increase in system placements reflects incremental sales of our next-generation da Vinci 5 system and continued demand for additional capacity by our customers as a result of procedure growth, partially offset by a smaller number of third-generation da Vinci systems available for trade-in. During the second quarter of 2024, we placed 70 da Vinci 5 systems.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S156ed881a09e396a","report":"2024-H1","filed":"2024-07-19","sha256":"28a33f5ffcaab3193920f0c91a8b1d8ceccb01ec243681a91bfd51647bd7c000","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000207/isrg-20240630.htm","path":"sources/raw/S156ed881a09e396a.html","html_block":442,"text":"•During the three months ended June 30, 2024, we placed 341 da Vinci surgical systems compared to 331 systems during the three months ended June 30, 2023. The second quarter 2024 da Vinci surgical system placements included 70 da Vinci 5 systems.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S156ed881a09e396a","report":"2024-H1","filed":"2024-07-19","sha256":"28a33f5ffcaab3193920f0c91a8b1d8ceccb01ec243681a91bfd51647bd7c000","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000207/isrg-20240630.htm","path":"sources/raw/S156ed881a09e396a.html","html_block":443,"text":"•As of June 30, 2024, we had a da Vinci surgical system installed base of approximately 9,203 systems, an increase of 14% compared to an installed base of approximately 8,042 systems as of June 30, 2023.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S156ed881a09e396a","report":"2024-H1","filed":"2024-07-19","sha256":"28a33f5ffcaab3193920f0c91a8b1d8ceccb01ec243681a91bfd51647bd7c000","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000207/isrg-20240630.htm","path":"sources/raw/S156ed881a09e396a.html","html_block":446,"text":"•As of June 30, 2024, we had an Ion system installed base of approximately 678 systems, an increase of 56% compared to an installed base of approximately 435 systems as of June 30, 2023.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S156ed881a09e396a","report":"2024-H1","filed":"2024-07-19","sha256":"28a33f5ffcaab3193920f0c91a8b1d8ceccb01ec243681a91bfd51647bd7c000","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000207/isrg-20240630.htm","path":"sources/raw/S156ed881a09e396a.html","html_block":477,"text":"Systems revenue increased by 14% to $448 million for the three months ended June 30, 2024, compared to $393 million for the three months ended June 30, 2023. The higher second quarter 2024 system revenue was primarily driven by higher operating lease revenue, higher sales-type lease revenue, and higher lease buyout revenue, partially offset by a higher proportion of da Vinci system placements under operating leases (despite more da Vinci system placements).","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S156ed881a09e396a","report":"2024-H1","filed":"2024-07-19","sha256":"28a33f5ffcaab3193920f0c91a8b1d8ceccb01ec243681a91bfd51647bd7c000","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000207/isrg-20240630.htm","path":"sources/raw/S156ed881a09e396a.html","ht Ion systems were placed compared to 114 systems during the six months ended June 30, 2023. The increase in system placements was primarily driven by the demand for additional capacity by our customers due to procedure growth. As of June 30, 2024, we had an Ion system installed base of approximately 678 systems, compared to an installed base of approximately 435 systems as of June 30, 2023.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S156ed881a09e396a","report":"2024-H1","filed":"2024-07-19","sha256":"28a33f5ffcaab3193920f0c91a8b1d8ceccb01ec243681a91bfd51647bd7c000","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000207/isrg-20240630.htm","path":"sources/raw/S156ed881a09e396a.html","html_block":500,"text":"The following table summarizes our Ion system placements at customers under leasing arrangements for six months ended June 30, 2024, and 2023:","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S156ed881a09e396a","report":"2024-H1","filed":"2024-07-19","sha256":"28a33f5ffcaab3193920f0c91a8b1d8ceccb01ec243681a91bfd51647bd7c000","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000207/isrg-20240630.htm","path":"sources/raw/S156ed881a09e396a.html","html_block":504,"text":"Service revenue increased by 10% to $317 million for the three months ended June 30, 2024, compared to $287 million for the three months ended June 30, 2023. The increase in service revenue was primarily driven by a larger installed base of systems producing service revenue, partially offset by a higher proportion of early-stage usage-based operating lease arrangements where procedures are ramping up and a lower volume of incremental repairs.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S156ed881a09e396a","report":"2024-H1","filed":"2024-07-19","sha256":"28a33f5ffcaab3193920f0c91a8b1d8ceccb01ec243681a91bfd51647bd7c000","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000207/isrg-20240630.htm","path":"sources/raw/S156ed881a09e396a.html","html_block":506,"text":"Service revenue increased by 11% to $631 million for the six months ended June 30, 2024, compared to $571 million for the six months ended June 30, 2023. The increase in service revenue was primarily driven by a larger installed base of systems","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S156ed881a09e396a","report":"2024-H1","filed":"2024-07-19","sha256":"28a33f5ffcaab3193920f0c91a8b1d8ceccb01ec243681a91bfd51647bd7c000","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000207/isrg-20240630.htm","path":"sources/raw/S156ed881a09e396a.html","html_block":519,"text":"Service gross profit for the three months ended June 30, 2024, increased by 9% to $220 million, representing 69.2% of service revenue, compared to $201 million, representing 70.1% of service revenue, for the three months ended June 30, 2023. The higher service gross profit for the three months ended June 30, 2024, was primarily driven by higher service revenue, reflecting a larger installed base of da Vinci surgical systems, partially offset by a lower service gross profit margin. The lower service gross profit margin for the three months ended June 30, 2024, was primarily driven by early-stage usage-based operating lease arrangements where procedures are ramping up, partially offset by favorable impacts from leveraging volume of repairs.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S156ed881a09e396a","report":"2024-H1","filed":"2024-07-19","sha256":"28a33f5ffcaab3193920f0c91a8b1d8ceccb01ec243681a91bfd51647bd7c000","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000207/isrg-20240630.htm","path":"sources/raw/S156ed881a09e396a.html","html_block":521,"text":"Service gross profit for the six months ended June 30, 2024, increased by 12% to $442 million, representing 70.1% of service revenue, compared to $394 million, representing 69.1% of service revenue, for the six months ended June 30, 2023. The higher service gross profit for the six months ended June 30, 2024, was primarily driven by higher service revenue, reflecting a larger installed base of da Vinci surgical systems, and a higher service gross profit margin. The higher service gross profit margin for the six months ended June 30, 2024, was primarily driven by favorable impacts from leveraging volume of repairs, partially offset by early-stage usage-based operating lease arrangements where procedures are ramping up.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S521c47d894f16ef6","report":"2024-Q3","filed":"2024-10-18","sha256":"9e73f3dbd013abfb5e09deb97ff733ea2cd1d8d8967984f11cb11413a139e495","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000247/isrg-20240930.htm","path":"sources/raw/S521c47d894f16ef6.html","html_block":299,"text":"We are in the early stages of launching our da Vinci SP surgical system, and we have an installed base of 243 da Vinci SP surgical systems as of September 30, 2024. We have received FDA clearance for the da Vinci SP surgical system for urologic, general thoracoscopic, and certain transoral procedures. Additionally, the da Vinci SP surgical system has received regulatory clearance in South Korea for a broad set of procedures. The da Vinci SP surgical system has also received regulatory clearance in Japan for the same set of procedures that are currently allowed with the da Vinci Xi surgical system in Japan. In January","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S521c47d894f16ef6","report":"2024-Q3","filed":"2024-10-18","sha256":"9e73f3dbd013abfb5e09deb97ff733ea2cd1d8d8967984f11cb11413a139e495","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000247/isrg-20240930.htm","path":"sources/raw/S521c47d894f16ef6.html","html_block":331,"text":"Service revenue was $1.17 billion in 2023, compared to $1.02 billion in 2022 and $0.92 billion in 2021. The increase in service revenue was primarily driven by the growth of the base of installed da Vinci surgical systems producing service revenue. The installed base of da Vinci surgical systems grew 14% to approximately 8,606 as of December 31, 2023; 12% to approximately 7,544 as of December 31, 2022; and 12% to approximately 6,730 as of December 31, 2021.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S521c47d894f16ef6","report":"2024-Q3","filed":"2024-10-18","sha256":"9e73f3dbd013abfb5e09deb97ff733ea2cd1d8d8967984f11cb11413a139e495","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000247/isrg-20240930.htm","path":"sources/raw/S521c47d894f16ef6.html","html_block":337,"text":"The following table summarizes our system placements under leasing arrangements for the years ended December 31, 2023, 2022, and 2021:","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S521c47d894f16ef6","report":"2024-Q3","filed":"2024-10-18","sha256":"9e73f3dbd013abfb5e09deb97ff733ea2cd1d8d8967984f11cb11413a139e495","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000247/isrg-20240930.htm","path":"sources/raw/S521c47d894f16ef6.html","html_block":393,"text":"In 2023, approximately 2,286,000 surgical procedures were performed with da Vinci surgical systems, compared to approximately 1,875,000 and 1,594,000 surgical procedures performed with da Vinci surgical systems in 2022 and 2021,","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S521c47d894f16ef6","report":"2024-Q3","filed":"2024-10-18","sha256":"9e73f3dbd013abfb5e09deb97ff733ea2cd1d8d8967984f11cb11413a139e495","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000247/isrg-20240930.htm","path":"sources/raw/S521c47d894f16ef6.html","html_block":403,"text":"In 2023, approximately 53,800 biopsy procedures were performed with Ion systems, compared to approximately 23,500 in 2022 and approximately 7,400 in 2021. The increase in our overall procedure volume in 2023 reflects a larger installed base of approximately 534 systems, an increase of 66% compared to the installed base of approximately 321 systems as of 2022. Currently, the vast majority of Ion biopsy procedures are performed in the U.S.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S521c47d894f16ef6","report":"2024-Q3","filed":"2024-10-18","sha256":"9e73f3dbd013abfb5e09deb97ff733ea2cd1d8d8967984f11cb11413a139e495","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000247/isrg-20240930.htm","path":"sources/raw/S521c47d894f16ef6.html","html_block":411,"text":"Overall. Total da Vinci procedures performed by our customers grew approximately 18% for the three months ended September 30, 2024, compared to approximately 19% for the three months ended September 30, 2023. Total da Vinci procedures performed by our customers grew approximately 17% for the nine months ended September 30, 2024, compared to approximately 22% for the nine months ended September 30, 2023. The third quarter 2024 procedure growth was largely attributable to growth in U.S. general surgery, OUS general surgery (particularly cancer), OUS urologic surgery, U.S. gynecologic surgery, and OUS gynecologic surgery.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S521c47d894f16ef6","report":"2024-Q3","filed":"2024-10-18","sha256":"9e73f3dbd013abfb5e09deb97ff733ea2cd1d8d8967984f11cb11413a139e495","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000247/isrg-20240930.htm","path":"sources/raw/S521c47d894f16ef6.html","html_block":418,"text":"We placed 379 da Vinci surgical systems in the third quarter of 2024, compared to 312 systems in the third quarter of 2023. The increase in system placements reflects incremental demand for our next-generation da Vinci 5 system and continued demand for additional capacity by our customers as a result of procedure growth, partially offset by a smaller number of third-generation da Vinci systems available for trade-in. During the third quarter of 2024, we placed 110 da Vinci 5 systems.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S521c47d894f16ef6","report":"2024-Q3","filed":"2024-10-18","sha256":"9e73f3dbd013abfb5e09deb97ff733ea2cd1d8d8967984f11cb11413a139e495","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000247/isrg-20240930.htm","path":"sources/raw/S521c47d894f16ef6.html","html_block":439,"text":"•During the three months ended September 30, 2024, we placed 379 da Vinci surgical systems compared to 312 systems during the three months ended September 30, 2023. The third quarter 2024 da Vinci surgical system placements included 110 da Vinci 5 systems.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S521c47d894f16ef6","report":"2024-Q3","filed":"2024-10-18","sha256":"9e73f3dbd013abfb5e09deb97ff733ea2cd1d8d8967984f11cb11413a139e495","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000247/isrg-20240930.htm","path":"sources/raw/S521c47d894f16ef6.html","html_block":440,"text":"•As of September 30, 2024, we had a da Vinci surgical system installed base of approximately 9,539 systems, an increase of 15% compared to an installed base of approximately 8,285 systems as of September 30, 2023.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S521c47d894f16ef6","report":"2024-Q3","filed":"2024-10-18","sha256":"9e73f3dbd013abfb5e09deb97ff733ea2cd1d8d8967984f11cb11413a139e495","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000247/isrg-20240930.htm","path":"sources/raw/S521c47d894f16ef6.html","html_block":443,"text":"•As of September 30, 2024, we had an Ion system installed base of approximately 736 systems, an increase of 50% compared to an installed base of approximately 490 systems as of September 30, 2023.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S521c47d894f16ef6","report":"2024-Q3","filed":"2024-10-18","sha256":"9e73f3dbd013abfb5e09deb97ff733ea2cd1d8d8967984f11cb11413a139e495","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000247/isrg-20240930.htm","path":"sources/raw/S521c47d894f16ef6.html","html_block":474,"text":"Systems revenue increased by 17% to $445 million for the three months ended September 30, 2024, compared to $379 million for the three months ended September 30, 2023. The higher third quarter 2024 system revenue was primarily driven by an increase in da Vinci system placements, higher operating lease revenue, and higher third quarter 2024 ASPs, partially offset by a higher proportion of da Vinci system placements under operating leases.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S521c47d894f16ef6","report":"2024-Q3","filed":"2024-10-18","sha256":"9e73f3dbd013abfb5e09deb97ff733ea2cd1d8d8967984f11cb11413a139e495","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000247/isrg-20240930.htm","path":"sources/raw/S521c47d894f16ef6.html","html_block":476,"text":"The following table summarizes our da Vinci system placements and systems installed at customers under leasing arrangements for three months ended September 30, 2024, and 2023:","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S521c47d894f16ef6","report":"2024-Q3","filed":"2024-10-18","sha256":"9e73f3dbd013abfb5e09deb97ff733ea2cd1d8d8967984f11cb11413a139e495","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000247/isrg-20240930.htm","path":"sources/raw/S521c47d894f16ef6.html","html_block":481,"text":"During the third quarter of 2024, 58 Ion systems were placed compared to 55 systems during the third quarter of 2023. By geography, 53 systems were placed in the U.S., three in Europe, and two in Asia during third quarter of 2024, compared to 55 systems placed in the U.S. during the third quarter of 2023. The increase in system placements was primarily driven by the demand for additional capacity by our customers due to procedure growth and OUS expansion. As of September 30, 2024, we had an Ion system installed base of approximately 736 systems, compared to an installed base of approximately 490 systems as of September 30, 2023.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S521c47d894f16ef6","report":"2024-Q3","filed":"2024-10-18","sha256":"9e73f3dbd013abfb5e09deb97ff733ea2cd1d8d8967984f11cb11413a139e495","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000247/isrg-20240930.htm","path":"sources/raw/S521c47d894f16ef6.html","html_block":482,"text":"The following table summarizes our Ion system placements and systems installed at customers under leasing arrangements for three months ended September 30, 2024, and 2023:","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S521c47d894f16ef6","report":"2024-Q3","filed":"2024-10-18","sha256":"9e73f3dbd013abfb5e09deb97ff733ea2cd1d8d8967984f11cb11413a139e495","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000247/isrg-20240930.htm","path":"sources/raw/S521c47d894f16ef6.html","html_block":487,"text":"Systems revenue increased by 9% to $1.31 billion for the nine months ended September 30, 2024, compared to $1.20 billion for the nine months ended September 30, 2023. The higher year-to-date 2024 system revenue was primarily driven by higher operating lease revenue, an increase in da Vinci system placements, and higher lease buyout revenue, partially offset by a higher proportion of da Vinci system placements under operating leases.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S521c47d894f16ef6","report":"2024-Q3","filed":"2024-10-18","sha256":"9e73f3dbd013abfb5e09deb97ff733ea2cd1d8d8967984f11cb11413a139e495","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000247/isrg-20240930.htm","path":"sources/raw/S521c47d894f16ef6.html","html_block":491,"text":"U.S., 237 in Europe, 195 in Asia, and 66 in other markets during the nine months ended September 30, 2023. The increase in system placements was primarily driven by 188 da Vinci 5 system placements and continued demand for additional capacity by our customers as a result of procedure growth, partially offset by a smaller number of third-generation da Vinci systems available for trade-in.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S521c47d894f16ef6","report":"2024-Q3","filed":"2024-10-18","sha256":"9e73f3dbd013abfb5e09deb97ff733ea2cd1d8d8967984f11cb11413a139e495","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000247/isrg-20240930.htm","path":"sources/raw/S521c47d894f16ef6.html","html_block":492,"text":"The following table summarizes our da Vinci system placements at customers under leasing arrangements for nine months ended September 30, 2024, and 2023:","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S521c47d894f16ef6","report":"2024-Q3","filed":"2024-10-18","sha256":"9e73f3dbd013abfb5e09deb97ff733ea2cd1d8d8967984f11cb11413a139e495","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000247/isrg-20240930.htm","path":"sources/raw/S521c47d894f16ef6.html","html_block":495,"text":"During the nine months ended September 30, 2024, 202 Ion systems were placed compared to 169 systems during the nine months ended September 30, 2023. By geography, 191 systems were placed in the U.S., nine in Europe, and two in Asia during nine months ended September 30, 2024, compared to 168 systems placed in the U.S. and one in Europe during the nine months ended September 30, 2023. The increase in system placements was primarily driven by the demand for additional capacity by our customers due to procedure growth and OUS expansion. As of September 30, 2024, we had an Ion system installed base of approximately 736 systems, compared to an installed base of approximately 490 systems as of September 30, 2023.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S521c47d894f16ef6","report":"2024-Q3","filed":"2024-10-18","sha256":"9e73f3dbd013abfb5e09deb97ff733ea2cd1d8d8967984f11cb11413a139e495","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000247/isrg-20240930.htm","path":"sources/raw/S521c47d894f16ef6.html","html_block":496,"text":"The following table summarizes our Ion system placements at customers under leasing arrangements for nine months ended September 30, 2024, and 2023:","tag":"经营披露定位"},{"company":"US_ISRG_
