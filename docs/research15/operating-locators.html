直觉外科","id":"S521c47d894f16ef6","report":"2024-Q3","filed":"2024-10-18","sha256":"9e73f3dbd013abfb5e09deb97ff733ea2cd1d8d8967984f11cb11413a139e495","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000247/isrg-20240930.htm","path":"sources/raw/S521c47d894f16ef6.html","html_block":500,"text":"Service revenue increased by 12% to $329 million for the three months ended September 30, 2024, compared to $293 million for the three months ended September 30, 2023. The increase in service revenue was primarily driven by a larger installed base of systems producing service revenue, partially offset by a higher proportion of early-stage usage-based operating lease arrangements where procedures are ramping up.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S521c47d894f16ef6","report":"2024-Q3","filed":"2024-10-18","sha256":"9e73f3dbd013abfb5e09deb97ff733ea2cd1d8d8967984f11cb11413a139e495","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000247/isrg-20240930.htm","path":"sources/raw/S521c47d894f16ef6.html","html_block":504,"text":"Service revenue increased by 11% to $960 million for the nine months ended September 30, 2024, compared to $863 million for the nine months ended September 30, 2023. The increase in service revenue was primarily driven by a larger installed base of systems producing service revenue, partially offset by a higher proportion of early-stage usage-based operating lease arrangements where procedures are ramping up.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S521c47d894f16ef6","report":"2024-Q3","filed":"2024-10-18","sha256":"9e73f3dbd013abfb5e09deb97ff733ea2cd1d8d8967984f11cb11413a139e495","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000247/isrg-20240930.htm","path":"sources/raw/S521c47d894f16ef6.html","html_block":516,"text":"Service gross profit for the three months ended September 30, 2024, increased by 7% to $220 million, representing 66.9% of service revenue, compared to $206 million, representing 70.3% of service revenue, for the three months ended September 30, 2023. The higher service gross profit for the three months ended September 30, 2024, was primarily driven by higher service revenue, reflecting a larger installed base of da Vinci surgical systems, partially offset by a lower service gross profit margin. The lower service gross profit margin for the three months ended September 30, 2024, was primarily driven by higher inventory reserves and an unfavorable repair mix.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S521c47d894f16ef6","report":"2024-Q3","filed":"2024-10-18","sha256":"9e73f3dbd013abfb5e09deb97ff733ea2cd1d8d8967984f11cb11413a139e495","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526724000247/isrg-20240930.htm","path":"sources/raw/S521c47d894f16ef6.html","html_block":518,"text":"Service gross profit for the nine months ended September 30, 2024, increased by 10% to $662 million, representing 69.0% of service revenue, compared to $600 million, representing 69.5% of service revenue, for the nine months ended September 30, 2023. The higher service gross profit for the nine months ended September 30, 2024, was primarily driven by higher service revenue, reflecting a larger installed base of da Vinci surgical systems, and a lower service gross profit margin. The lower service gross profit margin for the nine months ended September 30, 2024, was primarily driven by higher inventory reserves and an unfavorable repair mix, partially offset by overhead leverage from higher repair volume.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S561e5bdd00d58c75","report":"2025-Q1","filed":"2025-04-23","sha256":"041e47fb9853ad885cc69509a0104b6cee4c5d87f20443af4cbb506f012165ee","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000109/isrg-20250331.htm","path":"sources/raw/S561e5bdd00d58c75.html","html_block":300,"text":"We are in the early stages of launching our da Vinci SP surgical system and have an installed base of 291 da Vinci SP surgical systems as of March 31, 2025. We have received FDA clearance for the da Vinci SP surgical system for urologic,","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S561e5bdd00d58c75","report":"2025-Q1","filed":"2025-04-23","sha256":"041e47fb9853ad885cc69509a0104b6cee4c5d87f20443af4cbb506f012165ee","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000109/isrg-20250331.htm","path":"sources/raw/S561e5bdd00d58c75.html","html_block":333,"text":"Service revenue was $1.31 billion in 2024, compared to $1.17 billion in 2023 and $1.02 billion in 2022. The increase in service revenue was primarily driven by the growth of the base of installed da Vinci surgical systems producing service revenue. The installed base of da Vinci surgical systems grew 15% to approximately 9,902 as of December 31, 2024; 14% to approximately 8,606 as of December 31, 2023; and 12% to approximately 7,544 as of December 31, 2022.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S561e5bdd00d58c75","report":"2025-Q1","filed":"2025-04-23","sha256":"041e47fb9853ad885cc69509a0104b6cee4c5d87f20443af4cbb506f012165ee","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000109/isrg-20250331.htm","path":"sources/raw/S561e5bdd00d58c75.html","html_block":382,"text":"Since 2022, several provinces in China have implemented significant limits on what hospitals can charge patients for surgeries using robotic surgical technology, including soft tissue surgery. These limits have significantly impacted the number of procedures performed and have impacted our instruments and accessories revenue in those provinces. However, as of the date of this report, these limits have not had a material impact on our business, financial condition, or results of operations, as","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S561e5bdd00d58c75","report":"2025-Q1","filed":"2025-04-23","sha256":"041e47fb9853ad885cc69509a0104b6cee4c5d87f20443af4cbb506f012165ee","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000109/isrg-20250331.htm","path":"sources/raw/S561e5bdd00d58c75.html","html_block":400,"text":"In 2024, approximately 2,683,000 surgical procedures were performed with da Vinci surgical systems, compared to approximately 2,286,000 and 1,875,000 surgical procedures performed with da Vinci surgical systems in 2023 and 2022, respectively. The increase in our overall procedure volume in 2024 was largely attributable to growth in U.S. general surgery, OUS general surgery (particularly cancer), OUS urologic surgery, and U.S. gynecologic surgery procedures. The overall procedure volume in the 2022 comparative year reflects disruption caused by the COVID-19 pandemic.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S561e5bdd00d58c75","report":"2025-Q1","filed":"2025-04-23","sha256":"041e47fb9853ad885cc69509a0104b6cee4c5d87f20443af4cbb506f012165ee","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000109/isrg-20250331.htm","path":"sources/raw/S561e5bdd00d58c75.html","html_block":407,"text":"In 2024, approximately 95,500 biopsy procedures were performed with Ion systems, compared to approximately 53,800 in 2023 and approximately 23,500 in 2022. The increase in our overall procedure volume in 2024 reflects a larger installed base of approximately 805 systems, an increase of 51% compared to the installed base of approximately 534 systems as of 2023. In 2024, 2023, and 2022, the vast majority of Ion biopsy procedures were performed in the U.S.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S561e5bdd00d58c75","report":"2025-Q1","filed":"2025-04-23","sha256":"041e47fb9853ad885cc69509a0104b6cee4c5d87f20443af4cbb506f012165ee","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000109/isrg-20250331.htm","path":"sources/raw/S561e5bdd00d58c75.html","html_block":415,"text":"Overall. Total da Vinci procedures performed by our customers grew approximately 17% for the three months ended March 31, 2025, compared to approximately 16% for the three months ended March 31, 2024. The first quarter 2025 procedure growth was largely attributable to growth in U.S. general surgery, OUS general surgery (particularly cancer), OUS urology, and OUS gynecology procedures.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S561e5bdd00d58c75","report":"2025-Q1","filed":"2025-04-23","sha256":"041e47fb9853ad885cc69509a0104b6cee4c5d87f20443af4cbb506f012165ee","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000109/isrg-20250331.htm","path":"sources/raw/S561e5bdd00d58c75.html","html_block":417,"text":"U.S. Procedures. U.S. da Vinci procedures grew approximately 13% for the three months ended March 31, 2025, compared to approximately 14% for the three months ended March 31, 2024. The first quarter 2025 U.S. procedure growth was largely attributable to strong growth in general surgery procedures, most notably cholecystectomy and hernia repair procedures. The number of U.S. da Vinci bariatric procedures performed continued to decline in the mid-single digits in the first quarter of 2025 compared to the first quarter of 2024.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S561e5bdd00d58c75","report":"2025-Q1","filed":"2025-04-23","sha256":"041e47fb9853ad885cc69509a0104b6cee4c5d87f20443af4cbb506f012165ee","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000109/isrg-20250331.htm","path":"sources/raw/S561e5bdd00d58c75.html","html_block":422,"text":"Overall. Total Ion procedures performed by our customers grew approximately 58% for the three months ended March 31, 2025, compared to approximately 90% for the three months ended March 31, 2024. The first quarter 2025 procedure growth was largely attributable to a larger installed base of Ion systems and the conversion of other lung biopsy modalities.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S561e5bdd00d58c75","report":"2025-Q1","filed":"2025-04-23","sha256":"041e47fb9853ad885cc69509a0104b6cee4c5d87f20443af4cbb506f012165ee","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000109/isrg-20250331.htm","path":"sources/raw/S561e5bdd00d58c75.html","html_block":425,"text":"We placed 367 da Vinci surgical systems in the first quarter of 2025, compared to 313 systems in the first quarter of 2024. The increase in system placements reflects continued demand for additional capacity by our customers as a result of procedure growth as well as demand for our next-generation da Vinci 5 system, including the impact from customers beginning to trade in fourth-generation da Vinci systems. During the first quarter of 2025, we placed 147 da Vinci 5 systems, compared to 8 systems in the first quarter of 2024.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S561e5bdd00d58c75","report":"2025-Q1","filed":"2025-04-23","sha256":"041e47fb9853ad885cc69509a0104b6cee4c5d87f20443af4cbb506f012165ee","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000109/isrg-20250331.htm","path":"sources/raw/S561e5bdd00d58c75.html","html_block":449,"text":"•During the three months ended March 31, 2025, we placed 367 da Vinci surgical systems compared to 313 systems during the three months ended March 31, 2024. The first quarter 2025 da Vinci surgical system placements included 147 da Vinci 5 systems compared to 8 systems during the three months ended March 31, 2024.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S561e5bdd00d58c75","report":"2025-Q1","filed":"2025-04-23","sha256":"041e47fb9853ad885cc69509a0104b6cee4c5d87f20443af4cbb506f012165ee","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000109/isrg-20250331.htm","path":"sources/raw/S561e5bdd00d58c75.html","html_block":450,"text":"•As of March 31, 2025, we had a da Vinci surgical system installed base of approximately 10,189 systems, an increase of 15% compared to an installed base of approximately 8,887 systems as of March 31, 2024.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S561e5bdd00d58c75","report":"2025-Q1","filed":"2025-04-23","sha256":"041e47fb9853ad885cc69509a0104b6cee4c5d87f20443af4cbb506f012165ee","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000109/isrg-20250331.htm","path":"sources/raw/S561e5bdd00d58c75.html","html_block":453,"text":"•As of March 31, 2025, we had an Ion system installed base of approximately 853 systems, an increase of 41% compared to an installed base of approximately 604 systems as of March 31, 2024.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S561e5bdd00d58c75","report":"2025-Q1","filed":"2025-04-23","sha256":"041e47fb9853ad885cc69509a0104b6cee4c5d87f20443af4cbb506f012165ee","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000109/isrg-20250331.htm","path":"sources/raw/S561e5bdd00d58c75.html","html_block":482,"text":"general surgery procedures, most notably cholecystectomy and hernia repair procedures. The number of U.S. da Vinci bariatric procedures performed continued to decline in the mid-single digits in the first quarter of 2025 compared to the first quarter of 2024. The first quarter 2025 OUS da Vinci procedure growth was approximately 24%, driven by growth in general surgery procedures, most notably colorectal and hernia repair procedures, urologic procedures, most notably prostatectomy and partial nephrectomy procedures, and gynecologic procedures, most notably hysterectomy procedures. Geographically, the first quarter 2025 OUS da Vinci procedure growth was driven by several markets with particular strength in the UK, India, and South Korea.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S561e5bdd00d58c75","report":"2025-Q1","filed":"2025-04-23","sha256":"041e47fb9853ad885cc69509a0104b6cee4c5d87f20443af4cbb506f012165ee","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000109/isrg-20250331.htm","path":"sources/raw/S561e5bdd00d58c75.html","html_block":483,"text":"Systems revenue increased by 25% to $523 million for the three months ended March 31, 2025, compared to $418 million for the three months ended March 31, 2024. The higher first quarter 2025 system revenue was primarily driven by an increase in da Vinci system placements, higher operating lease revenue, higher first quarter 2025 ASPs, and higher lease buyout revenue, partially offset by a higher proportion of da Vinci system placements under operating leases.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S561e5bdd00d58c75","report":"2025-Q1","filed":"2025-04-23","sha256":"041e47fb9853ad885cc69509a0104b6cee4c5d87f20443af4cbb506f012165ee","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000109/isrg-20250331.htm","path":"sources/raw/S561e5bdd00d58c75.html","html_block":491,"text":"capacity to increasing utilization of their existing systems. As of March 31, 2025, we had an Ion system installed base of approximately 853 systems, compared to an installed base of approximately 604 systems as of March 31, 2024.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S561e5bdd00d58c75","report":"2025-Q1","filed":"2025-04-23","sha256":"041e47fb9853ad885cc69509a0104b6cee4c5d87f20443af4cbb506f012165ee","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000109/isrg-20250331.htm","path":"sources/raw/S561e5bdd00d58c75.html","html_block":496,"text":"Service revenue increased by 16% to $363 million for the three months ended March 31, 2025, compared to $314 million for the three months ended March 31, 2024. The increase in service revenue was primarily driven by a larger installed base of systems producing service revenue.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S7dcc79dfc1b7786f","report":"2025-H1","filed":"2025-07-23","sha256":"0871af9d301341a7d73ba9901ffce6b8a7b286d2b835a07cb2f352f7280838d7","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000192/isrg-20250630.htm","path":"sources/raw/S7dcc79dfc1b7786f.html","html_block":355,"text":"Service revenue was $1.31 billion in 2024, compared to $1.17 billion in 2023 and $1.02 billion in 2022. The increase in service revenue was primarily driven by the growth of the base of installed da Vinci surgical systems producing service revenue. The installed base of da Vinci surgical systems grew 15% to approximately 9,902 as of December 31, 2024; 14% to approximately 8,606 as of December 31, 2023; and 12% to approximately 7,544 as of December 31, 2022.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S7dcc79dfc1b7786f","report":"2025-H1","filed":"2025-07-23","sha256":"0871af9d301341a7d73ba9901ffce6b8a7b286d2b835a07cb2f352f7280838d7","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000192/isrg-20250630.htm","path":"sources/raw/S7dcc79dfc1b7786f.html","html_block":380,"text":"For the years ended December 31, 2024, 2023, and 2022, more than half of the da Vinci procedures performed were for benign conditions, most notably hernia repairs, hysterectomies, and cholecystectomies. These benign procedures and other short-term elective procedures tend to be more seasonal than cancer operations and surgeries for other life-threatening conditions. Seasonality in the U.S. for procedures for benign conditions typically results in higher fourth quarter procedure volume when more patients have met annual deductibles and lower first quarter procedure volume when deductibles are reset. Seasonality outside of the U.S. varies and is more pronounced around local holidays and vacation periods, which have lower procedure volume.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S7dcc79dfc1b7786f","report":"2025-H1","filed":"2025-07-23","sha256":"0871af9d301341a7d73ba9901ffce6b8a7b286d2b835a07cb2f352f7280838d7","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000192/isrg-20250630.htm","path":"sources/raw/S7dcc79dfc1b7786f.html","html_block":423,"text":"In 2024, approximately 2,683,000 surgical procedures were performed with da Vinci surgical systems, compared to approximately 2,286,000 and 1,875,000 surgical procedures performed with da Vinci surgical systems in 2023 and 2022, respectively. The increase in our overall procedure volume in 2024 was largely attributable to growth in U.S. general surgery, OUS general surgery (particularly cancer), OUS urologic surgery, and U.S. gynecologic surgery procedures. The overall procedure volume in the 2022 comparative year reflects disruption caused by the COVID-19 pandemic.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S7dcc79dfc1b7786f","report":"2025-H1","filed":"2025-07-23","sha256":"0871af9d301341a7d73ba9901ffce6b8a7b286d2b835a07cb2f352f7280838d7","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000192/isrg-20250630.htm","path":"sources/raw/S7dcc79dfc1b7786f.html","html_block":432,"text":"In 2024, approximately 95,500 biopsy procedures were performed with Ion systems, compared to approximately 53,800 in 2023 and approximately 23,500 in 2022. The increase in our overall procedure volume in 2024 reflects a larger installed base of approximately 805 systems, an increase of 51% compared to the installed base of approximately 534 systems as of 2023. In 2024, 2023, and 2022, the vast majority of Ion biopsy procedures were performed in the U.S.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S7dcc79dfc1b7786f","report":"2025-H1","filed":"2025-07-23","sha256":"0871af9d301341a7d73ba9901ffce6b8a7b286d2b835a07cb2f352f7280838d7","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000192/isrg-20250630.htm","path":"sources/raw/S7dcc79dfc1b7786f.html","html_block":438,"text":"Overall. Total da Vinci procedures performed by our customers grew approximately 17% for the three months ended June 30, 2025, compared to approximately 17% for the three months ended June 30, 2024. Total da Vinci procedures performed by our customers grew approximately 17% for the six months ended June 30, 2025, compared to approximately 16% for the six months ended June 30, 2024. The second quarter 2025 procedure growth was largely attributable to growth in U.S. general surgery, OUS general surgery (particularly cancer), and OUS urology procedures.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S7dcc79dfc1b7786f","report":"2025-H1","filed":"2025-07-23","sha256":"0871af9d301341a7d73ba9901ffce6b8a7b286d2b835a07cb2f352f7280838d7","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000192/isrg-20250630.htm","path":"sources/raw/S7dcc79dfc1b7786f.html","html_block":440,"text":"U.S. Procedures. U.S. da Vinci procedures grew approximately 14% for the three months ended June 30, 2025, compared to approximately 14% for the three months ended June 30, 2024. U.S. da Vinci procedures grew approximately 14% for the six months ended June 30, 2025, compared to approximately 14% for the six months ended June 30, 2024. The second quarter 2025 U.S. procedure growth was largely attributable to strong growth in general surgery procedures, most notably cholecystectomy, hernia repair, and appendectomy procedures, as well as growth in gynecological procedures. The number of U.S. da Vinci bariatric procedures performed declined in the high-single digits in the second quarter of 2025 compared to the second quarter of 2024.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S7dcc79dfc1b7786f","report":"2025-H1","filed":"2025-07-23","sha256":"0871af9d301341a7d73ba9901ffce6b8a7b286d2b835a07cb2f352f7280838d7","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000192/isrg-20250630.htm","path":"sources/raw/S7dcc79dfc1b7786f.html","html_block":447,"text":"Overall. Total Ion procedures performed by our customers grew approximately 52% for the three months ended June 30, 2025, compared to approximately 82% for the three months ended June 30, 2024. Total Ion procedures performed by our customers grew approximately 55% for the six months ended June 30, 2025, compared to approximately 86% for the six months ended June 30, 2024. The second quarter 2025 procedure growth was largely attributable to a larger installed base of Ion systems and the conversion of other lung biopsy modalities.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S7dcc79dfc1b7786f","report":"2025-H1","filed":"2025-07-23","sha256":"0871af9d301341a7d73ba9901ffce6b8a7b286d2b835a07cb2f352f7280838d7","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000192/isrg-20250630.htm","path":"sources/raw/S7dcc79dfc1b7786f.html","html_block":450,"text":"We placed 395 da Vinci surgical systems in the second quarter of 2025, compared to 341 systems in the second quarter of 2024. The increase in system placements reflects continued demand for additional capacity by our customers as a result of procedure growth as well as increased demand for our next-generation da Vinci 5 system, including the impact from customers beginning to trade in fourth-generation da Vinci systems. During the second quarter of 2025, we placed 180 da Vinci 5 systems, compared to 70 systems in the second quarter of 2024.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S7dcc79dfc1b7786f","report":"2025-H1","filed":"2025-07-23","sha256":"0871af9d301341a7d73ba9901ffce6b8a7b286d2b835a07cb2f352f7280838d7","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000192/isrg-20250630.htm","path":"sources/raw/S7dcc79dfc1b7786f.html","html_block":476,"text":"•During the three months ended June 30, 2025, we placed 395 da Vinci surgical systems compared to 341 systems during the three months ended June 30, 2024. The second quarter 2025 da Vinci surgical system placements included 180 da Vinci 5 systems compared to 70 systems during the three months ended June 30, 2024.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S7dcc79dfc1b7786f","report":"2025-H1","filed":"2025-07-23","sha256":"0871af9d301341a7d73ba9901ffce6b8a7b286d2b835a07cb2f352f7280838d7","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000192/isrg-20250630.htm","path":"sources/raw/S7dcc79dfc1b7786f.html","html_block":477,"text":"•As of June 30, 2025, we had a da Vinci surgical system installed base of approximately 10,488 systems, an increase of 14% compared to an installed base of approximately 9,203 systems as of June 30, 2024.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S7dcc79dfc1b7786f","report":"2025-H1","filed":"2025-07-23","sha256":"0871af9d301341a7d73ba9901ffce6b8a7b286d2b835a07cb2f352f7280838d7","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000192/isrg-20250630.htm","path":"sources/raw/S7dcc79dfc1b7786f.html","html_block":480,"text":"•As of June 30, 2025, we had an Ion system installed base of approximately 905 systems, an increase of 33% compared to an installed base of approximately 678 systems as of June 30, 2024.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S7dcc79dfc1b7786f","report":"2025-H1","filed":"2025-07-23","sha256":"0871af9d301341a7d73ba9901ffce6b8a7b286d2b835a07cb2f352f7280838d7","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000192/isrg-20250630.htm","path":"sources/raw/S7dcc79dfc1b7786f.html","html_block":512,"text":"Systems revenue increased by 28% to $575 million for the three months ended June 30, 2025, compared to $448 million for the three months ended June 30, 2024. The higher second quarter 2025 system revenue was primarily driven by an increase in da Vinci system placements, higher operating lease revenue, and higher ASPs in the second quarter of 2025, driven by an increase in da Vinci 5 system placements.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S7dcc79dfc1b7786f","report":"2025-H1","filed":"2025-07-23","sha256":"0871af9d301341a7d73ba9901ffce6b8a7b286d2b835a07cb2f352f7280838d7","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000192/isrg-20250630.htm","path":"sources/raw/S7dcc79dfc1b7786f.html","html_block":518,"text":"The da Vinci surgical system ASP, excluding systems placed under fixed-payment or usage-based operating lease arrangements, Ion systems, and the impact of specified-price trade-in rights, was approximately $1.50 million for the three months ended June 30, 2025, compared to approximately $1.44 million for the three months ended June 30, 2024. The higher second quarter 2025 ASP was largely driven by favorable product mix, including from da Vinci 5 system placements, partially offset by more trade-ins. ASP fluctuates from period to period based on geographic and product mix, product pricing, systems placed involving trade-ins, and changes in foreign exchange rates.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S7dcc79dfc1b7786f","report":"2025-H1","filed":"2025-07-23","sha256":"0871af9d301341a7d73ba9901ffce6b8a7b286d2b835a07cb2f352f7280838d7","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000192/isrg-20250630.htm","path":"sources/raw/S7dcc79dfc1b7786f.html","html_block":519,"text":"During the second quarter of 2025, 54 Ion systems were placed compared to 74 systems during the second quarter of 2024. By geography, 47 systems were placed in the U.S., three in Europe, two in Asia, and two in other markets during second quarter of 2025, compared to 72 systems placed in the U.S. and two in Europe during the second quarter of 2024. In the U.S., where we estimate that penetration of lung biopsy is approaching the halfway point, our customers’ focus has begun to shift from increasing capacity to increasing utilization of their existing systems. As of June 30, 2025, we had an Ion system installed base of approximately 905 systems, compared to an installed base of approximately 678 systems as of June 30, 2024.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S7dcc79dfc1b7786f","report":"2025-H1","filed":"2025-07-23","sha256":"0871af9d301341a7d73ba9901ffce6b8a7b286d2b835a07cb2f352f7280838d7","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000192/isrg-20250630.htm","path":"sources/raw/S7dcc79dfc1b7786f.html","html_block":525,"text":"Systems revenue increased by 27% to $1.10 billion for the six months ended June 30, 2025, compared to $0.87 billion for the six months ended June 30, 2024. The higher year-to-date 2025 system revenue was primarily driven by an increase in da Vinci system placements, higher operating lease revenue, and higher year-to-date 2025 ASPs, driven by an increase in da Vinci 5 system placements.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S7dcc79dfc1b7786f","report":"2025-H1","filed":"2025-07-23","sha256":"0871af9d301341a7d73ba9901ffce6b8a7b286d2b835a07cb2f352f7280838d7","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000192/isrg-20250630.htm","path":"sources/raw/S7dcc79dfc1b7786f.html","html_block":526,"text":"During the six months ended June 30, 2025, a total of 762 da Vinci surgical systems were placed compared to 654 systems during the six months ended June 30, 2024. By geography, 420 systems were placed in the U.S., 161 in Europe, 121 in Asia, and 60 in other OUS markets during the six months ended June 30, 2025, compared to 297 systems placed in the U.S., 155 in Europe, 151 in Asia, and 51 in other OUS markets during the six months ended June 30, 2024. The increase in system placements was primarily driven by continued demand for additional capacity by our customers as a result of procedure growth","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S7dcc79dfc1b7786f","report":"2025-H1","filed":"2025-07-23","sha256":"0871af9d301341a7d73ba9901ffce6b8a7b286d2b835a07cb2f352f7280838d7","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000192/isrg-20250630.htm","path":"sources/raw/S7dcc79dfc1b7786f.html","html_block":532,"text":"The da Vinci surgical system ASP, excluding systems placed under fixed-payment or usage-based operating lease arrangements, Ion systems, and the impact of specified-price trade-in rights, was approximately $1.55 million for the six months ended June 30, 2025, compared to approximately $1.41 million for the six months ended June 30, 2024. The higher year-to-date 2025 ASP was largely driven by favorable product mix, including from da Vinci 5 system placements, and lower pricing discounts. ASP fluctuates from period to period based on geographic and product mix, product pricing, systems placed involving trade-ins, and changes in foreign exchange rates.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S7dcc79dfc1b7786f","report":"2025-H1","filed":"2025-07-23","sha256":"0871af9d301341a7d73ba9901ffce6b8a7b286d2b835a07cb2f352f7280838d7","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000192/isrg-20250630.htm","path":"sources/raw/S7dcc79dfc1b7786f.html","html_block":540,"text":"Service revenue increased by 23% to $391 million for the three months ended June 30, 2025, compared to $317 million for the three months ended June 30, 2024. The increase in service revenue was primarily driven by a larger installed base of systems producing service revenue and higher revenue from operating lease arrangements.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S7dcc79dfc1b7786f","report":"2025-H1","filed":"2025-07-23","sha256":"0871af9d301341a7d73ba9901ffce6b8a7b286d2b835a07cb2f352f7280838d7","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000192/isrg-20250630.htm","path":"sources/raw/S7dcc79dfc1b7786f.html","html_block":542,"text":"Service revenue increased by 20% to $754 million for the six months ended June 30, 2025, compared to $631 million for the six months ended June 30, 2024. The increase in service revenue was primarily driven by a larger installed base of systems producing service revenue and higher revenue from operating lease arrangements.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S7dcc79dfc1b7786f","report":"2025-H1","filed":"2025-07-23","sha256":"0871af9d301341a7d73ba9901ffce6b8a7b286d2b835a07cb2f352f7280838d7","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000192/isrg-20250630.htm","path":"sources/raw/S7dcc79dfc1b7786f.html","html_block":555,"text":"Service gross profit for the three months ended June 30, 2025, increased by 16% to $255 million, representing 65.3% of service revenue, compared to $220 million, representing 69.2% of service revenue, for the three months ended June 30, 2024. The higher service gross profit for the three months ended June 30, 2025, was primarily driven by higher service revenue, reflecting a larger installed base of da Vinci surgical systems, partially offset by a lower service gross profit margin. The lower service gross profit margin for the three months ended June 30, 2025, was primarily driven by incremental fixed costs,","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Scec5a9c35af66cb0","report":"2025-Q3","filed":"2025-10-22","sha256":"c8386dd6002e9b8dd7afa172e7efa15eae85d0d32457bf8876f241a257d0bd1a","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000209/isrg-20250930.htm","path":"sources/raw/Scec5a9c35af66cb0.html","html_block":354,"text":"Service revenue was $1.31 billion in 2024, compared to $1.17 billion in 2023 and $1.02 billion in 2022. The increase in service revenue was primarily driven by the growth of the base of installed da Vinci surgical systems producing service revenue. The installed base of da Vinci surgical systems grew 15% to approximately 9,902 as of December 31, 2024; 14% to approximately 8,606 as of December 31, 2023; and 12% to approximately 7,544 as of December 31, 2022.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Scec5a9c35af66cb0","report":"2025-Q3","filed":"2025-10-22","sha256":"c8386dd6002e9b8dd7afa172e7efa15eae85d0d32457bf8876f241a257d0bd1a","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000209/isrg-20250930.htm","path":"sources/raw/Scec5a9c35af66cb0.html","html_block":380,"text":"For the years ended December 31, 2024, 2023, and 2022, more than half of the da Vinci procedures performed were for benign conditions, most notably hernia repairs, hysterectomies, and cholecystectomies. These benign procedures and other short-term elective procedures tend to be more seasonal than cancer operations and surgeries for other life-threatening conditions. Seasonality in the U.S. for procedures for benign conditions typically results in higher fourth quarter procedure volume when more patients have met annual deductibles and lower first quarter procedure volume when deductibles are reset. Seasonality outside of the U.S. varies and is more pronounced around local holidays and vacation periods, which have lower procedure volume.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Scec5a9c35af66cb0","report":"2025-Q3","filed":"2025-10-22","sha256":"c8386dd6002e9b8dd7afa172e7efa15eae85d0d32457bf8876f241a257d0bd1a","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000209/isrg-20250930.htm","path":"sources/raw/Scec5a9c35af66cb0.html","html_block":428,"text":"In 2024, approximately 2,683,000 surgical procedures were performed with da Vinci surgical systems, compared to approximately 2,286,000 and 1,875,000 surgical procedures performed with da Vinci surgical systems in 2023 and 2022, respectively. The increase in our overall procedure volume in 2024 was largely attributable to growth in U.S. general surgery, OUS general surgery (particularly cancer), OUS urologic surgery, and U.S. gynecologic surgery procedures. The overall procedure volume in the 2022 comparative year reflects disruption caused by the COVID-19 pandemic.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Scec5a9c35af66cb0","report":"2025-Q3","filed":"2025-10-22","sha256":"c8386dd6002e9b8dd7afa172e7efa15eae85d0d32457bf8876f241a257d0bd1a","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000209/isrg-20250930.htm","path":"sources/raw/Scec5a9c35af66cb0.html","html_block":437,"text":"In 2024, approximately 95,500 biopsy procedures were performed with Ion systems, compared to approximately 53,800 in 2023 and approximately 23,500 in 2022. The increase in our overall procedure volume in 2024 reflects a larger installed base of approximately 805 systems, an increase of 51% compared to the installed base of approximately 534 systems as of 2023. In 2024, 2023, and 2022, the vast majority of Ion biopsy procedures were performed in the U.S.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Scec5a9c35af66cb0","report":"2025-Q3","filed":"2025-10-22","sha256":"c8386dd6002e9b8dd7afa172e7efa15eae85d0d32457bf8876f241a257d0bd1a","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000209/isrg-20250930.htm","path":"sources/raw/Scec5a9c35af66cb0.html","html_block":445,"text":"Overall. Total da Vinci procedures performed by our customers grew approximately 19% for the three months ended September 30, 2025, compared to approximately 18% for the three months ended September 30, 2024. Total da Vinci procedures performed by our customers grew approximately 18% for the nine months ended September 30, 2025, compared to approximately 17% for the nine months ended September 30, 2024. The third quarter 2025 procedure growth was largely attributable to growth in general surgery, OUS urology, and U.S. gynecology procedures.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Scec5a9c35af66cb0","report":"2025-Q3","filed":"2025-10-22","sha256":"c8386dd6002e9b8dd7afa172e7efa15eae85d0d32457bf8876f241a257d0bd1a","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000209/isrg-20250930.htm","path":"sources/raw/Scec5a9c35af66cb0.html","html_block":452,"text":"Overall. Total Ion procedures performed by our customers grew approximately 52% for the three months ended September 30, 2025, compared to approximately 73% for the three months ended September 30, 2024. Total Ion procedures performed by our customers grew approximately 54% for the nine months ended September 30, 2025, compared to approximately 81% for the nine months ended September 30, 2024. The third quarter 2025 procedure growth was largely attributable to a larger installed base of Ion systems and the conversion of other lung biopsy modalities.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Scec5a9c35af66cb0","report":"2025-Q3","filed":"2025-10-22","sha256":"c8386dd6002e9b8dd7afa172e7efa15eae85d0d32457bf8876f241a257d0bd1a","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000209/isrg-20250930.htm","path":"sources/raw/Scec5a9c35af66cb0.html","html_block":455,"text":"We placed 427 da Vinci surgical systems in the third quarter of 2025, compared to 379 systems in the third quarter of 2024. The increase in system placements reflects continued demand for additional capacity by our customers as a result of procedure growth as well as increased demand for our next-generation da Vinci 5 system, including the impact from customers beginning to trade in fourth-generation da Vinci systems. During the third quarter of 2025, we placed 240 da Vinci 5 systems, compared to 110 systems in the third quarter of 2024.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Scec5a9c35af66cb0","report":"2025-Q3","filed":"2025-10-22","sha256":"c8386dd6002e9b8dd7afa172e7efa15eae85d0d32457bf8876f241a257d0bd1a","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000209/isrg-20250930.htm","path":"sources/raw/Scec5a9c35af66cb0.html","html_block":485,"text":"•During the three months ended September 30, 2025, we placed 427 da Vinci surgical systems compared to 379 systems during the three months ended September 30, 2024. The third quarter 2025 da Vinci surgical system placements included 240 da Vinci 5 systems compared to 110 systems in the third quarter of 2024.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Scec5a9c35af66cb0","report":"2025-Q3","filed":"2025-10-22","sha256":"c8386dd6002e9b8dd7afa172e7efa15eae85d0d32457bf8876f241a257d0bd1a","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000209/isrg-20250930.htm","path":"sources/raw/Scec5a9c35af66cb0.html","html_block":486,"text":"•As of September 30, 2025, we had a da Vinci surgical system installed base of approximately 10,763 systems, an increase of 13% compared to an installed base of approximately 9,539 systems as of September 30, 2024.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Scec5a9c35af66cb0","report":"2025-Q3","filed":"2025-10-22","sha256":"c8386dd6002e9b8dd7afa172e7efa15eae85d0d32457bf8876f241a257d0bd1a","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000209/isrg-20250930.htm","path":"sources/raw/Scec5a9c35af66cb0.html","html_block":489,"text":"•As of September 30, 2025, we had an Ion system installed base of approximately 954 systems, an increase of 30% compared to an installed base of approximately 736 systems as of September 30, 2024.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Scec5a9c35af66cb0","report":"2025-Q3","filed":"2025-10-22","sha256":"c8386dd6002e9b8dd7afa172e7efa15eae85d0d32457bf8876f241a257d0bd1a","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000209/isrg-20250930.htm","path":"sources/raw/Scec5a9c35af66cb0.html","html_block":522,"text":"Systems revenue increased by 33% to $590 million for the three months ended September 30, 2025, compared to $445 million for the three months ended September 30, 2024. The higher third quarter 2025 system revenue was primarily driven by an increase in da Vinci system placements, including a decrease in the proportion of da Vinci system placements under operating leases, higher operating lease revenue, and higher ASPs in the third quarter of 2025, driven by an increase in da Vinci 5 system placements.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Scec5a9c35af66cb0","report":"2025-Q3","filed":"2025-10-22","sha256":"c8386dd6002e9b8dd7afa172e7efa15eae85d0d32457bf8876f241a257d0bd1a","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000209/isrg-20250930.htm","path":"sources/raw/Scec5a9c35af66cb0.html","html_block":528,"text":"The da Vinci surgical system ASP, excluding systems placed under fixed-payment or usage-based operating lease arrangements, Ion systems, and the impact of specified-price trade-in rights, was approximately $1.60 million for the three months ended September 30, 2025, compared to approximately $1.51 million for the three months ended September 30, 2024. The higher third quarter 2025 ASP was largely driven by favorable product mix, including from da Vinci 5 system placements, partially offset by higher pricing discounts and more trade-ins. ASP fluctuates from period to period based on geographic and product mix, product pricing, systems placed involving trade-ins, and changes in foreign exchange rates.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Scec5a9c35af66cb0","report":"2025-Q3","filed":"2025-10-22","sha256":"c8386dd6002e9b8dd7afa172e7efa15eae85d0d32457bf8876f241a257d0bd1a","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000209/isrg-20250930.htm","path":"sources/raw/Scec5a9c35af66cb0.html","html_block":529,"text":"During the third quarter of 2025, 50 Ion systems were placed compared to 58 systems during the third quarter of 2024. By geography, 41 systems were placed in the U.S., 5 in Europe, and 4 in Asia during third quarter of 2025, compared to 53 systems placed in the U.S. and 3 in Europe during the third quarter of 2024. In the U.S., where we estimate that penetration of lung biopsy is approaching the halfway point, our customers’ focus has begun to shift from increasing capacity to increasing utilization of their existing systems. As of September 30, 2025, we had an Ion system installed base of approximately 954 systems, compared to an installed base of approximately 736 systems as of September 30, 2024.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Scec5a9c35af66cb0","report":"2025-Q3","filed":"2025-10-22","sha256":"c8386dd6002e9b8dd7afa172e7efa15eae85d0d32457bf8876f241a257d0bd1a","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000209/isrg-20250930.htm","path":"sources/raw/Scec5a9c35af66cb0.html","html_block":535,"text":"Systems revenue increased by 29% to $1.69 billion for the nine months ended September 30, 2025, compared to $1.31 billion for the nine months ended September 30, 2024. The higher year-to-date 2025 system revenue was primarily driven by an increase in da Vinci system placements, including a decrease in the proportion of da Vinci system placements under operating leases, higher operating lease revenue, and higher year-to-date 2025 ASPs, driven by an increase in da Vinci 5 system placements.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Scec5a9c35af66cb0","report":"2025-Q3","filed":"2025-10-22","sha256":"c8386dd6002e9b8dd7afa172e7efa15eae85d0d32457bf8876f241a257d0bd1a","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000209/isrg-20250930.htm","path":"sources/raw/Scec5a9c35af66cb0.html","html_block":536,"text":"During the nine months ended September 30, 2025, a total of 1,189 da Vinci surgical systems were placed compared to 1,033 systems during the nine months ended September 30, 2024. By geography, 683 systems were placed in the U.S., 224 in Europe, 181 in Asia, and 101 in other OUS markets during the nine months ended September 30, 2025, compared to 516 systems placed in the U.S., 220 in Europe, 225 in Asia, and 72 in other OUS markets during the nine months ended September 30, 2024. The increase in system placements was primarily driven by continued demand for additional capacity by","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Scec5a9c35af66cb0","report":"2025-Q3","filed":"2025-10-22","sha256":"c8386dd6002e9b8dd7afa172e7efa15eae85d0d32457bf8876f241a257d0bd1a","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000209/isrg-20250930.htm","path":"sources/raw/Scec5a9c35af66cb0.html","html_block":542,"text":"The da Vinci surgical system ASP, excluding systems placed under fixed-payment or usage-based operating lease arrangements, Ion systems, and the impact of specified-price trade-in rights, was approximately $1.57 million for the nine months ended September 30, 2025, compared to approximately $1.44 million for the nine months ended September 30, 2024. The higher year-to-date 2025 ASP was largely driven by favorable product mix, including from da Vinci 5 system placements, partially offset by more trade-ins. ASP fluctuates from period to period based on geographic and product mix, product pricing, systems placed involving trade-ins, and changes in foreign exchange rates.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Scec5a9c35af66cb0","report":"2025-Q3","filed":"2025-10-22","sha256":"c8386dd6002e9b8dd7afa172e7efa15eae85d0d32457bf8876f241a257d0bd1a","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000209/isrg-20250930.htm","path":"sources/raw/Scec5a9c35af66cb0.html","html_block":550,"text":"Service revenue increased by 20% to $396 million for the three months ended September 30, 2025, compared to $329 million for the three months ended September 30, 2024. The increase in service revenue was primarily driven by a larger installed base of systems producing service revenue and favorable product mix, including from da Vinci 5 system placements.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Scec5a9c35af66cb0","report":"2025-Q3","filed":"2025-10-22","sha256":"c8386dd6002e9b8dd7afa172e7efa15eae85d0d32457bf8876f241a257d0bd1a","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000209/isrg-20250930.htm","path":"sources/raw/Scec5a9c35af66cb0.html","html_block":552,"text":"Service revenue increased by 20% to $1.15 billion for the nine months ended September 30, 2025, compared to $0.96 billion for the nine months ended September 30, 2024. The increase in service revenue was primarily driven by a larger installed base of systems producing service revenue and favorable product mix, including from da Vinci 5 system placements.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"Scec5a9c35af66cb0","report":"2025-Q3","filed":"2025-10-22","sha256":"c8386dd6002e9b8dd7afa172e7efa15eae85d0d32457bf8876f241a257d0bd1a","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526725000209/isrg-20250930.htm","path":"sources/raw/Scec5a9c35af66cb0.html","html_block":565,"text":"Service gross profit for the three months ended September 30, 2025, increased by 15% to $253 million, representing 63.8% of service revenue, compared to $220 million, representing 66.9% of service revenue, for the three months ended September 30, 2024. The higher service gross profit for the three months ended September 30, 2025, was primarily driven by higher service revenue, reflecting a larger installed base of da Vinci surgical systems, partially offset by a lower service gross profit margin. The lower service gross profit margin for the three months ended September 30, 2025, was primarily driven by higher costs associated with the phased launch of our da Vinci 5 surgical system, an unfavorable repair mix, incremental fixed costs,","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S380546aaf536ce14","report":"2026-Q1","filed":"2026-04-22","sha256":"bfca8cc4ef9f0cd7380e5192d5635626801073d9601f1f0b353429124c678bdd","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526726000032/isrg-20260331.htm","path":"sources/raw/S380546aaf536ce14.html","html_block":386,"text":"•431 da Vinci surgical systems were placed during the three months ended March 31, 2026, an increase of 17% compared to 367 systems during the three months ended March 31, 2025. The first quarter 2026 da Vinci surgical system placements included 232 da Vinci 5 systems compared to 147 systems in the first quarter of 2025.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S380546aaf536ce14","report":"2026-Q1","filed":"2026-04-22","sha256":"bfca8cc4ef9f0cd7380e5192d5635626801073d9601f1f0b353429124c678bdd","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526726000032/isrg-20260331.htm","path":"sources/raw/S380546aaf536ce14.html","html_block":387,"text":"•As of March 31, 2026, we had a da Vinci surgical system installed base of approximately 11,395 systems, an increase of 12% compared to an installed base of approximately 10,189 systems as of March 31, 2025.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S380546aaf536ce14","report":"2026-Q1","filed":"2026-04-22","sha256":"bfca8cc4ef9f0cd7380e5192d5635626801073d9601f1f0b353429124c678bdd","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526726000032/isrg-20260331.htm","path":"sources/raw/S380546aaf536ce14.html","html_block":390,"text":"•As of March 31, 2026, we had an Ion system installed base of approximately 1,041 systems, an increase of 22% compared to an installed base of approximately 853 systems as of March 31, 2025.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S380546aaf536ce14","report":"2026-Q1","filed":"2026-04-22","sha256":"bfca8cc4ef9f0cd7380e5192d5635626801073d9601f1f0b353429124c678bdd","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526726000032/isrg-20260331.htm","path":"sources/raw/S380546aaf536ce14.html","html_block":408,"text":"Overall. Total da Vinci procedures performed by our customers grew approximately 16% for the three months ended March 31, 2026, compared to approximately 17% for the three months ended March 31, 2025. The first quarter 2026 procedure growth was largely attributable to growth in U.S. general surgery procedures and OUS procedures.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S380546aaf536ce14","report":"2026-Q1","filed":"2026-04-22","sha256":"bfca8cc4ef9f0cd7380e5192d5635626801073d9601f1f0b353429124c678bdd","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526726000032/isrg-20260331.htm","path":"sources/raw/S380546aaf536ce14.html","html_block":413,"text":"largely attributable to strong growth in general surgery procedures, most notably cholecystectomy, hernia repair, and appendectomy procedures, as well as growth in gynecological procedures. The number of U.S. da Vinci bariatric procedures performed declined approximately 10% in the first quarter of 2026 compared to the first quarter of 2025.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S380546aaf536ce14","report":"2026-Q1","filed":"2026-04-22","sha256":"bfca8cc4ef9f0cd7380e5192d5635626801073d9601f1f0b353429124c678bdd","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526726000032/isrg-20260331.htm","path":"sources/raw/S380546aaf536ce14.html","html_block":419,"text":"In the three months ended March 31, 2026, approximately 42,700 biopsy procedures were performed by our customers with Ion systems, compared to approximately 30,700 in the three months ended March 31, 2025. The growth in our overall procedure volume reflects a larger installed base of approximately 1,041 systems, an increase of 22% compared to the installed base of approximately 853 systems as of March 31, 2025. Currently, the vast majority of Ion biopsy procedures are performed in the U.S.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S380546aaf536ce14","report":"2026-Q1","filed":"2026-04-22","sha256":"bfca8cc4ef9f0cd7380e5192d5635626801073d9601f1f0b353429124c678bdd","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526726000032/isrg-20260331.htm","path":"sources/raw/S380546aaf536ce14.html","html_block":425,"text":"As of March 31, 2026, we had a da Vinci surgical system installed base of approximately 11,395 systems compared to approximately 10,189 systems as of March 31, 2025. By geography, 6,477 systems were in the U.S., 2,257 in Europe, 2,049 in","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S380546aaf536ce14","report":"2026-Q1","filed":"2026-04-22","sha256":"bfca8cc4ef9f0cd7380e5192d5635626801073d9601f1f0b353429124c678bdd","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526726000032/isrg-20260331.htm","path":"sources/raw/S380546aaf536ce14.html","html_block":428,"text":"Asia, and 612 in the rest of the world. The incremental system installed base reflects continued procedure growth and further customer validation that robotic-assisted surgery addresses their Quintuple Aim objectives.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S380546aaf536ce14","report":"2026-Q1","filed":"2026-04-22","sha256":"bfca8cc4ef9f0cd7380e5192d5635626801073d9601f1f0b353429124c678bdd","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526726000032/isrg-20260331.htm","path":"sources/raw/S380546aaf536ce14.html","html_block":429,"text":"During the first quarter of 2026, 52 Ion systems were placed compared to 49 systems in the first quarter of 2025. By geography, 39 systems were placed in the U.S., 9 in Europe, 2 in Asia, and 2 in other geographic markets during the first quarter of 2026, compared to 45 systems placed in the U.S., 3 in Europe, and 1 in other geographic markets during the first quarter of 2025. In the U.S., where we estimate that penetration of lung biopsy has exceeded the halfway point, our customers’ focus has begun to shift from increasing capacity to increasing utilization of their existing systems. As of March 31, 2026, we had an Ion system installed base of approximately 1,041 systems, compared to approximately 853 systems as of March 31, 2025.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S380546aaf536ce14","report":"2026-Q1","filed":"2026-04-22","sha256":"bfca8cc4ef9f0cd7380e5192d5635626801073d9601f1f0b353429124c678bdd","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526726000032/isrg-20260331.htm","path":"sources/raw/S380546aaf536ce14.html","html_block":482,"text":"Systems revenue increased by 24% to $651 million for the three months ended March 31, 2026, compared to $523 million for the three months ended March 31, 2025. The higher first quarter 2026 system revenue was primarily driven by an increase in da Vinci system placements, partially offset by an increase in the proportion of da Vinci system placements under operating leases; higher operating lease revenue; and higher ASPs in the first quarter of 2026, driven by an increase in da Vinci 5 sales.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S380546aaf536ce14","report":"2026-Q1","filed":"2026-04-22","sha256":"bfca8cc4ef9f0cd7380e5192d5635626801073d9601f1f0b353429124c678bdd","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526726000032/isrg-20260331.htm","path":"sources/raw/S380546aaf536ce14.html","html_block":488,"text":"Service revenue increased by 19% to $434 million for the three months ended March 31, 2026, compared to $363 million for the three months ended March 31, 2025. The increase in service revenue was primarily driven by a larger installed base of systems producing service revenue and favorable product mix, including from da Vinci 5 system placements.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S62ee221f79d393a3","report":"2026-H1","filed":"2026-07-21","sha256":"2fa78f70f69bc2c0fbe7979860d040d8eb86c2d7e4bf48894230ccd0e1aafc09","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526726000058/isrg-20260630.htm","path":"sources/raw/S62ee221f79d393a3.html","html_block":319,"text":"(the “EU MDR”) for the da Vinci 5 surgical system for adult and pediatric use in minimally invasive endoscopic procedures across abdominopelvic and thoracoscopic surgical procedures, including urologic, gynecologic, and general laparoscopic procedures, excluding the use of force feedback. We are currently seeking European certification for the use of force feedback in the future. In select geographic markets outside of the U.S. (“OUS”) where we have obtained regulatory clearance, we have launched our da Vinci 5 surgical system. As of June 30, 2026, we have an installed base of 1,710 da Vinci 5 surgical systems, of which 136 systems are located in geographic markets outside of the U.S.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S62ee221f79d393a3","report":"2026-H1","filed":"2026-07-21","sha256":"2fa78f70f69bc2c0fbe7979860d040d8eb86c2d7e4bf48894230ccd0e1aafc09","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526726000058/isrg-20260630.htm","path":"sources/raw/S62ee221f79d393a3.html","html_block":388,"text":"•468 da Vinci surgical systems were placed during the three months ended June 30, 2026, an increase of 18% compared to 395 systems during the three months ended June 30, 2025. The second quarter 2026 da Vinci surgical system placements included 246 da Vinci 5 systems compared to 180 systems in the second quarter of 2025.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S62ee221f79d393a3","report":"2026-H1","filed":"2026-07-21","sha256":"2fa78f70f69bc2c0fbe7979860d040d8eb86c2d7e4bf48894230ccd0e1aafc09","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526726000058/isrg-20260630.htm","path":"sources/raw/S62ee221f79d393a3.html","html_block":389,"text":"•As of June 30, 2026, we had a da Vinci surgical system installed base of approximately 11,710 systems, an increase of 12% compared to an installed base of approximately 10,488 systems as of June 30, 2025.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S62ee221f79d393a3","report":"2026-H1","filed":"2026-07-21","sha256":"2fa78f70f69bc2c0fbe7979860d040d8eb86c2d7e4bf48894230ccd0e1aafc09","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526726000058/isrg-20260630.htm","path":"sources/raw/S62ee221f79d393a3.html","html_block":392,"text":"•As of June 30, 2026, we had an Ion system installed base of approximately 1,096 systems, an increase of 21% compared to an installed base of approximately 905 systems as of June 30, 2025.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S62ee221f79d393a3","report":"2026-H1","filed":"2026-07-21","sha256":"2fa78f70f69bc2c0fbe7979860d040d8eb86c2d7e4bf48894230ccd0e1aafc09","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526726000058/isrg-20260630.htm","path":"sources/raw/S62ee221f79d393a3.html","html_block":410,"text":"Overall. Total da Vinci procedures performed by our customers grew approximately 15% for the three months ended June 30, 2026, compared to approximately 17% for the three months ended June 30, 2025, and grew approximately 15% for the","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S62ee221f79d393a3","report":"2026-H1","filed":"2026-07-21","sha256":"2fa78f70f69bc2c0fbe7979860d040d8eb86c2d7e4bf48894230ccd0e1aafc09","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526726000058/isrg-20260630.htm","path":"sources/raw/S62ee221f79d393a3.html","html_block":421,"text":"In the three months ended June 30, 2026, approximately 47,900 biopsy procedures were performed by our customers with Ion systems, compared to approximately 35,300 in the three months ended June 30, 2025. The growth in our overall procedure volume reflects a larger installed base of approximately 1,096 systems, an increase of 21% compared to the installed base of approximately 905 systems as of June 30, 2025. Currently, the vast majority of Ion biopsy procedures are performed in the U.S.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S62ee221f79d393a3","report":"2026-H1","filed":"2026-07-21","sha256":"2fa78f70f69bc2c0fbe7979860d040d8eb86c2d7e4bf48894230ccd0e1aafc09","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526726000058/isrg-20260630.htm","path":"sources/raw/S62ee221f79d393a3.html","html_block":426,"text":"During the second quarter of 2026, 468 da Vinci surgical systems were placed compared to 395 systems in the second quarter of 2025. By geography, 267 systems were placed in the U.S., 79 in Europe, 75 in Asia, and 47 in other geographic markets during the second quarter of 2026, compared to 216 systems placed in the U.S., 73 in Europe, 69 in Asia, and 37 in other geographic markets during the second quarter of 2025. The increase in system placements reflects continued demand for additional capacity by our customers as a result of procedure growth as well as increased demand for our da Vinci 5 system,","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S62ee221f79d393a3","report":"2026-H1","filed":"2026-07-21","sha256":"2fa78f70f69bc2c0fbe7979860d040d8eb86c2d7e4bf48894230ccd0e1aafc09","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526726000058/isrg-20260630.htm","path":"sources/raw/S62ee221f79d393a3.html","html_block":430,"text":"As of June 30, 2026, we had a da Vinci surgical system installed base of approximately 11,710 systems compared to approximately 10,488 systems as of June 30, 2025. By geography, 6,615 systems were in the U.S., 2,325 in Europe, 2,111 in Asia, and 659 in the rest of the world. The incremental system installed base reflects continued procedure growth and further customer validation that robotic-assisted surgery addresses their Quintuple Aim objectives.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S62ee221f79d393a3","report":"2026-H1","filed":"2026-07-21","sha256":"2fa78f70f69bc2c0fbe7979860d040d8eb86c2d7e4bf48894230ccd0e1aafc09","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526726000058/isrg-20260630.htm","path":"sources/raw/S62ee221f79d393a3.html","html_block":487,"text":"Systems revenue increased by 19% to $685 million for the three months ended June 30, 2026, compared to $575 million for the three months ended June 30, 2025. The higher second quarter 2026 system revenue was primarily driven by an increase in da Vinci surgical system placements, partially offset by an increase in the proportion of da Vinci surgical system placements under operating leases, higher operating lease revenue, and higher lease buyout revenue.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S62ee221f79d393a3","report":"2026-H1","filed":"2026-07-21","sha256":"2fa78f70f69bc2c0fbe7979860d040d8eb86c2d7e4bf48894230ccd0e1aafc09","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526726000058/isrg-20260630.htm","path":"sources/raw/S62ee221f79d393a3.html","html_block":495,"text":"Systems revenue increased by 22% to $1.34 billion for the six months ended June 30, 2026, compared to $1.10 billion for the six months ended June 30, 2025. The higher year-to-date 2026 system revenue was primarily driven by an increase in da Vinci surgical system placements, partially offset by an increase in the proportion of da Vinci surgical system placements under operating leases, higher operating lease revenue, and higher year-to-date 2026 ASPs, driven by an increase in da Vinci 5 system placements.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S62ee221f79d393a3","report":"2026-H1","filed":"2026-07-21","sha256":"2fa78f70f69bc2c0fbe7979860d040d8eb86c2d7e4bf48894230ccd0e1aafc09","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526726000058/isrg-20260630.htm","path":"sources/raw/S62ee221f79d393a3.html","html_block":497,"text":"The da Vinci surgical system ASP, excluding systems placed under fixed-payment or usage-based operating lease arrangements, Ion systems, and the impact of specified-price trade-in rights, was approximately $1.66 million for the six months ended June 30, 2026, compared to approximately $1.55 million for the six months ended June 30, 2025. The higher year-to-date 2026 ASP was largely driven by favorable product mix, including from da Vinci 5 system placements, partially offset by an unfavorable geographic mix. ASP fluctuates from period to period based on geographic and product mix, product pricing, systems placed involving trade-ins, and changes in foreign exchange rates.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S62ee221f79d393a3","report":"2026-H1","filed":"2026-07-21","sha256":"2fa78f70f69bc2c0fbe7979860d040d8eb86c2d7e4bf48894230ccd0e1aafc09","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526726000058/isrg-20260630.htm","path":"sources/raw/S62ee221f79d393a3.html","html_block":501,"text":"Service revenue increased by 21% to $472 million for the three months ended June 30, 2026, compared to $391 million for the three months ended June 30, 2025. The increase in service revenue was primarily driven by a larger installed base of systems producing service revenue and favorable product mix, including from da Vinci 5 system placements.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S62ee221f79d393a3","report":"2026-H1","filed":"2026-07-21","sha256":"2fa78f70f69bc2c0fbe7979860d040d8eb86c2d7e4bf48894230ccd0e1aafc09","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526726000058/isrg-20260630.htm","path":"sources/raw/S62ee221f79d393a3.html","html_block":503,"text":"Service revenue increased by 20% to $906 million for the six months ended June 30, 2026, compared to $754 million for the six months ended June 30, 2025. The increase in service revenue was primarily driven by a larger installed base of systems producing service revenue and favorable product mix, particularly from da Vinci 5 surgical system placements.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S83c179dfd93521d4","report":"2026-Q3","filed":"2026-10-21","sha256":"df5b434e5ae926551c12632ba637d5d182aa1fdf3eab00b5668983bc86c3ac61","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526726000071/isrg-20260930.htm","path":"sources/raw/S83c179dfd93521d4.html","html_block":397,"text":"•546 da Vinci surgical systems were placed during the three months ended September 30, 2026, an increase of 28% compared to 427 systems during the three months ended September 30, 2025. The third quarter 2026 da Vinci surgical system placements included 315 da Vinci 5 systems compared to 240 systems in the third quarter of 2025.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S83c179dfd93521d4","report":"2026-Q3","filed":"2026-10-21","sha256":"df5b434e5ae926551c12632ba637d5d182aa1fdf3eab00b5668983bc86c3ac61","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526726000071/isrg-20260930.htm","path":"sources/raw/S83c179dfd93521d4.html","html_block":398,"text":"•As of September 30, 2026, we had a da Vinci surgical system installed base of approximately 12,094 systems, an increase of 12% compared to an installed base of approximately 10,763 systems as of September 30, 2025.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S83c179dfd93521d4","report":"2026-Q3","filed":"2026-10-21","sha256":"df5b434e5ae926551c12632ba637d5d182aa1fdf3eab00b5668983bc86c3ac61","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526726000071/isrg-20260930.htm","path":"sources/raw/S83c179dfd93521d4.html","html_block":401,"text":"•As of September 30, 2026, we had an Ion system installed base of approximately 1,152 systems, an increase of 21% compared to an installed base of approximately 954 systems as of September 30, 2025.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S83c179dfd93521d4","report":"2026-Q3","filed":"2026-10-21","sha256":"df5b434e5ae926551c12632ba637d5d182aa1fdf3eab00b5668983bc86c3ac61","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526726000071/isrg-20260930.htm","path":"sources/raw/S83c179dfd93521d4.html","html_block":420,"text":"Overall. Total da Vinci procedures performed by our customers grew approximately 14% for the three months ended September 30, 2026, compared to approximately 19% for the three months ended September 30, 2025, and grew approximately 15% for the nine months ended September 30, 2026, compared to approximately 18% for the nine months ended September 30,","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S83c179dfd93521d4","report":"2026-Q3","filed":"2026-10-21","sha256":"df5b434e5ae926551c12632ba637d5d182aa1fdf3eab00b5668983bc86c3ac61","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526726000071/isrg-20260930.htm","path":"sources/raw/S83c179dfd93521d4.html","html_block":431,"text":"In the three months ended September 30, 2026, approximately 49,700 biopsy procedures were performed by our customers with Ion systems, compared to approximately 37,900 in the three months ended September 30, 2025. In the nine months ended September 30, 2026, approximately 140,300 biopsy procedures were performed by our customers with Ion systems, compared to approximately 103,900 in the nine months ended September 30, 2025. The growth in our overall procedure volume reflects a larger installed base of approximately 1,152 systems as of September 30, 2026, an increase of 21% compared to the installed base of approximately 954 systems as of September 30, 2025. Currently, the vast majority of Ion biopsy procedures are performed in the U.S.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S83c179dfd93521d4","report":"2026-Q3","filed":"2026-10-21","sha256":"df5b434e5ae926551c12632ba637d5d182aa1fdf3eab00b5668983bc86c3ac61","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526726000071/isrg-20260930.htm","path":"sources/raw/S83c179dfd93521d4.html","html_block":439,"text":"As of September 30, 2026, we had a da Vinci surgical system installed base of approximately 12,094 systems compared to approximately 10,763 systems as of September 30, 2025. By geography, 6,807 systems were in the U.S., 2,436 in Europe, 2,176 in Asia, and 675 in the rest of the world. The incremental system installed base reflects continued procedure growth and further customer validation that robotic-assisted surgery addresses their Quintuple Aim objectives.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S83c179dfd93521d4","report":"2026-Q3","filed":"2026-10-21","sha256":"df5b434e5ae926551c12632ba637d5d182aa1fdf3eab00b5668983bc86c3ac61","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526726000071/isrg-20260930.htm","path":"sources/raw/S83c179dfd93521d4.html","html_block":498,"text":"Systems revenue increased by 30% to $769 million for the three months ended September 30, 2026, compared to $590 million for the three months ended September 30, 2025. The higher third quarter 2026 systems revenue was primarily driven by an increase in da Vinci surgical system placements, higher operating lease revenue, and higher lease buyout revenue.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S83c179dfd93521d4","report":"2026-Q3","filed":"2026-10-21","sha256":"df5b434e5ae926551c12632ba637d5d182aa1fdf3eab00b5668983bc86c3ac61","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526726000071/isrg-20260930.htm","path":"sources/raw/S83c179dfd93521d4.html","html_block":500,"text":"The da Vinci surgical system ASP, excluding systems placed under fixed-payment or usage-based operating lease arrangements, Ion systems, and the impact of specified-price trade-in rights, was approximately $1.61 million for the three months ended September 30, 2026, compared to approximately $1.60 million for the three months ended September 30, 2025. The higher third quarter 2026 ASP was primarily driven by favorable geographic mix and favorable product mix, including from da Vinci 5 system placements, partially offset by higher pricing discounts. ASP fluctuates from period to period based on geographic and product mix, product pricing, systems placed involving trade-ins, and changes in foreign exchange rates.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S83c179dfd93521d4","report":"2026-Q3","filed":"2026-10-21","sha256":"df5b434e5ae926551c12632ba637d5d182aa1fdf3eab00b5668983bc86c3ac61","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526726000071/isrg-20260930.htm","path":"sources/raw/S83c179dfd93521d4.html","html_block":506,"text":"Systems revenue increased by 25% to $2.10 billion for the nine months ended September 30, 2026, compared to $1.69 billion for the nine months ended September 30, 2025. The higher year-to-date 2026 system revenue was primarily driven by an increase in da Vinci surgical system placements, partially offset by an increase in the proportion of da Vinci surgical system placements under operating leases, higher operating lease revenue, and higher lease buyout revenue.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S83c179dfd93521d4","report":"2026-Q3","filed":"2026-10-21","sha256":"df5b434e5ae926551c12632ba637d5d182aa1fdf3eab00b5668983bc86c3ac61","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526726000071/isrg-20260930.htm","path":"sources/raw/S83c179dfd93521d4.html","html_block":508,"text":"The da Vinci surgical system ASP, excluding systems placed under fixed-payment or usage-based operating lease arrangements, Ion systems, and the impact of specified-price trade-in rights, was approximately $1.64 million for the nine months ended September 30, 2026, compared to approximately $1.57 million for the nine months ended September 30, 2025. The higher year-to-date 2026 ASP was primarily driven by favorable product mix, including from da Vinci 5 system placements, partially offset by higher pricing discounts. ASP fluctuates from period to period based on geographic and product mix, product pricing, systems placed involving trade-ins, and changes in foreign exchange rates.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S83c179dfd93521d4","report":"2026-Q3","filed":"2026-10-21","sha256":"df5b434e5ae926551c12632ba637d5d182aa1fdf3eab00b5668983bc86c3ac61","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526726000071/isrg-20260930.htm","path":"sources/raw/S83c179dfd93521d4.html","html_block":512,"text":"Service revenue increased by 22% to $482 million for the three months ended September 30, 2026, compared to $396 million for the three months ended September 30, 2025. The increase in service revenue was primarily driven by a larger installed base of systems producing service revenue and favorable product mix, particularly from da Vinci 5 system placements.","tag":"经营披露定位"},{"company":"US_ISRG_直觉外科","id":"S83c179dfd93521d4","report":"2026-Q3","filed":"2026-10-21","sha256":"df5b434e5ae926551c12632ba637d5d182aa1fdf3eab00b5668983bc86c3ac61","url":"https://www.sec.gov/Archives/edgar/data/1035267/000103526726000071/isrg-20260930.htm","path":"sources/raw/S83c179dfd93521d4.html","html_block":514,"text":"Service revenue increased by 21% to $1.39 billion for the nine months ended September 30, 2026, compared to $1.15 billion for the nine months ended September 30, 2025. The increase in service revenue was primarily driven by a larger installed base of systems producing service revenue and favorable product mix, particularly from da Vinci 5 surgical system placements.","tag":"经营披露定位"}]</script>
    <script type="application/json" id="columns">["company","id","report","filed","sha256","url","path","page","line","text","tag","html_block"]</script><script>
const rows = JSON.parse(document.querySelector('#data').textContent);
const columns = JSON.parse(document.querySelector('#columns').textContent);
const selector = [...document.querySelectorAll('select')];
const body = document.querySelector('tbody');
const search = document.querySelector('input[type=search]');
const status = document.querySelector('#status');
const filters = ['company','tag','scenario'];
let page = 0;
const size = 60;
selector.forEach((select, i) => {
  [...new Set(rows.map(row => row[filters[i]]).filter(Boolean))].sort().forEach(value => {
    const option = document.createElement('option');
    option.value = value;
    option.textContent = value;
    select.append(option);
  });
});
const index = rows.map(row => JSON.stringify(row).toLowerCase());
function render() {
  const terms = search.value.toLowerCase().trim().split(/\s+/);
  const result = rows.filter((row, i) => selector.every((s, n) => !s.value || row[filters[n]] === s.value) &&
                                         terms.every(term => index[i].includes(term)));
  const maxPage = Math.max(0, Math.ceil(result.length / size) - 1);
  page = Math.min(maxPage, Math.max(0, page));
  status.textContent = '共 ' + result.length + ' 行 · 第 ' + (page+1) + ' / ' + (maxPage+1) + ' 页';
  body.replaceChildren();
  for (const row of result.slice(page * size, (page+1)*size)) {
    const tr = document.createElement('tr');
    if (row.anchor) tr.id = row.anchor;
    columns.forEach(key => {
      const td = document.createElement('td');
      const value = row[key];
      if (key === 'url' && value && /^https?:/.test(value)) {
        const a = document.createElement('a');
        a.textContent = '发行人或监管原件';
        a.href = value;
        td.append(a);
      } else if (key === 'jump' && value) {
        const a = document.createElement('a');
        a.textContent = '当前账本条目';
        a.href = value;
        td.append(a);
      } else if (value != null && typeof value === 'object') {
        const details = document.createElement('details');
        const summary = document.createElement('summary');
        const pre = document.createElement('pre');
        summary.textContent = '展开';
        pre.textContent = JSON.stringify(value,null,2);
        details.append(summary,pre);
        td.append(details);
      } else {
        td.textContent = value ?? '—';
      }
      tr.append(td);
    });
    body.append(tr);
  }
}
document.querySelector('.controls').addEventListener('input', () => { page=0; render(); });
document.querySelector('#prev').onclick=()=>{page--; render();};
document.querySelector('#next').onclick=()=>{page++; render();};
if (location.hash) {
  const anchor = decodeURIComponent(location.hash.substring(1));
  const match = rows.find(x => x.anchor === anchor);
  if (match) search.value = match.anchor;
}
render();
</script></body></html>
